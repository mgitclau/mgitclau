<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生活英文 3000 字</title>
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --sub:#6a6f76; --line:#e4e0d8;
  --accent:#2f6f5e; --accent-soft:#e3efe9; --done:#9aa0a6; --chip:#efece5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --card:#1f2226; --ink:#e8e6e1; --sub:#9aa0a6; --line:#2e3238;
    --accent:#6cc3a6; --accent-soft:#1f3a32; --done:#5d636a; --chip:#2a2e33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e8e6e1; --sub:#9aa0a6; --line:#2e3238;
  --accent:#6cc3a6; --accent-soft:#1f3a32; --done:#5d636a; --chip:#2a2e33;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 60px}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:.02em}
.lead{color:var(--sub);margin:0 0 20px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:.95rem;cursor:pointer}
.tab small{color:var(--sub);margin-left:4px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab[aria-selected="true"] small{color:rgba(255,255,255,.8)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 220px;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
label.opt{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:.9rem;cursor:pointer;user-select:none}
.progress{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--sub)}
.track{flex:1;height:6px;background:var(--chip);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.levelnote{color:var(--sub);font-size:.9rem;margin:16px 0 8px}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li.w{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
li.w.known{opacity:.55}
.rank{color:var(--sub);font-size:.78rem;font-variant-numeric:tabular-nums;padding-top:4px;min-width:2.6em}
.head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.word{font-size:1.18rem;font-weight:650}
.pos{font-size:.78rem;color:var(--sub);background:var(--chip);border-radius:6px;padding:1px 6px}
.zh{font-weight:500}
.ex{color:var(--sub);font-size:.92rem;grid-column:2/4}
.ex b{color:var(--ink);font-weight:500}
.actions{display:flex;gap:6px}
button.icon{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1rem;display:grid;place-items:center}
button.icon.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.quiz .zh,.quiz .exzh{filter:blur(6px);cursor:pointer;transition:filter .2s}
.quiz .shown .zh,.quiz .shown .exzh{filter:none}
.more{display:block;margin:16px auto 0;padding:10px 20px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.95rem}
.empty{color:var(--sub);text-align:center;padding:30px 0}
.foot{color:var(--sub);font-size:.82rem;margin-top:28px;line-height:1.7}
@media (max-width:480px){ li.w{grid-template-columns:1fr auto} .rank{display:none} .ex{grid-column:1/3} }
</style>
</head>
<body>
<div class="wrap">
  <h1>生活英文 3000 字</h1>
  <p class="lead">依照日常生活的使用頻率排序，分三級。點 🔊 聽發音，學會了就打勾 ✓。</p>

  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="row">
      <input type="search" id="q" placeholder="搜尋英文或中文，例如 coffee、咖啡" aria-label="搜尋單字">
      <label class="opt"><input type="checkbox" id="hideKnown"> 隱藏已會的字</label>
      <label class="opt"><input type="checkbox" id="quiz"> 測驗模式（遮住中文）</label>
    </div>
    <div class="progress"><span id="ptext"></span><div class="track"><div class="fill" id="pfill"></div></div></div>
  </div>

  <p class="levelnote" id="note"></p>
  <ul class="list" id="list"></ul>
  <button class="more" id="more" hidden>再顯示 100 個</button>
  <p class="empty" id="empty" hidden>找不到符合的單字</p>

  <p class="foot">說明：排序是依常見詞頻清單（類似 NGSL、Oxford 3000）並偏重日常生活用語整理的，屬於大致順序。發音使用你裝置內建的語音。「已會」的勾選只存在這台裝置的瀏覽器裡。</p>
</div>

our supervisor first.","ex_zh":"先問你的主管。"},{"w":"surgeon","pos":"n.","zh":"外科醫生","ex":"The surgeon did the operation.","ex_zh":"外科醫生做了這個手術。"},{"w":"surround","pos":"v.","zh":"包圍；圍繞","ex":"The house is surrounded by trees.","ex_zh":"房子被樹圍繞著。"},{"w":"survive","pos":"v.","zh":"存活；度過","ex":"Plants can't survive without water.","ex_zh":"植物沒有水就活不下去。"},{"w":"suspect","pos":"v./n.","zh":"懷疑；嫌疑犯","ex":"I suspect he is lying.","ex_zh":"我懷疑他在說謊。"},{"w":"suspend","pos":"v.","zh":"暫停；停學","ex":"The game was suspended due to rain.","ex_zh":"比賽因為下雨暫停了。"},{"w":"sustain","pos":"v.","zh":"維持；支撐","ex":"We can't sustain this speed.","ex_zh":"我們無法維持這個速度。"},{"w":"swap","pos":"v./n.","zh":"交換","ex":"Can we swap seats?","ex_zh":"我們可以換座位嗎？"},{"w":"sweetheart","pos":"n.","zh":"親愛的；情人","ex":"Good night, sweetheart.","ex_zh":"晚安，親愛的。"},{"w":"sword","pos":"n.","zh":"劍","ex":"The knight held a sword.","ex_zh":"騎士拿著一把劍。"},{"w":"sympathetic","pos":"adj.","zh":"同情的；體諒的","ex":"My boss was very sympathetic.","ex_zh":"我的老闆很體諒我。"},{"w":"tackle","pos":"v.","zh":"處理；應付；擒抱","ex":"Let's tackle this problem together.","ex_zh":"我們一起處理這個問題。"},{"w":"tactic","pos":"n.","zh":"策略；手段","ex":"That's a smart tactic.","ex_zh":"那是一個聰明的策略。"},{"w":"tag","pos":"n.","zh":"標籤；吊牌","ex":"Cut the price tag off the shirt.","ex_zh":"把襯衫的價格吊牌剪掉。"},{"w":"tale","pos":"n.","zh":"故事；傳說","ex":"Grandma told us an old tale.","ex_zh":"奶奶跟我們說了一個老故事。"},{"w":"tank","pos":"n.","zh":"水箱；油箱；坦克","ex":"Fill up the tank, please.","ex_zh":"請幫我加滿油。"},{"w":"teammate","pos":"n.","zh":"隊友","ex":"My teammates are very friendly.","ex_zh":"我的隊友們都很友善。"},{"w":"tease","pos":"v.","zh":"取笑；逗弄","ex":"Stop teasing your little sister.","ex_zh":"別再捉弄你妹妹了。"},{"w":"temporary","pos":"adj.","zh":"暫時的；臨時的","ex":"This is only a temporary job.","ex_zh":"這只是一份臨時工作。"},{"w":"tend","pos":"v.","zh":"傾向；往往會","ex":"I tend to sleep late on weekends.","ex_zh":"我週末往往會睡得比較晚。"},{"w":"tendency","pos":"n.","zh":"傾向；趨勢","ex":"He has a tendency to be late.","ex_zh":"他有遲到的傾向。"},{"w":"tension","pos":"n.","zh":"緊張；壓力","ex":"There is tension between them.","ex_zh":"他們之間關係很緊張。"},{"w":"terminal","pos":"n.","zh":"航廈；終點站","ex":"Our flight leaves from Terminal 2.","ex_zh":"我們的班機從第二航廈出發。"},{"w":"territory","pos":"n.","zh":"領土；地盤","ex":"The dog guards its territory.","ex_zh":"狗守護著自己的地盤。"},{"w":"theory","pos":"n.","zh":"理論","ex":"It's a good theory, but is it true?","ex_zh":"這是個好理論，但它是真的嗎？"},{"w":"thesis","pos":"n.","zh":"論文","ex":"She is writing her master's thesis.","ex_zh":"她正在寫碩士論文。"},{"w":"thorough","pos":"adj.","zh":"徹底的；仔細的","ex":"The doctor gave me a thorough check.","ex_zh":"醫生幫我做了詳細的檢查。"},{"w":"thoughtful","pos":"adj.","zh":"體貼的；深思的","ex":"What a thoughtful gift!","ex_zh":"真是個貼心的禮物！"},{"w":"thrill","pos":"n./v.","zh":"興奮；激動","ex":"Riding a roller coaster is a thrill.","ex_zh":"坐雲霄飛車很刺激。"},{"w":"thrilling","pos":"adj.","zh":"刺激的；令人興奮的","ex":"The game had a thrilling ending.","ex_zh":"這場比賽的結尾很刺激。"},{"w":"thrive","pos":"v.","zh":"茁壯成長；興旺","ex":"These plants thrive in the sun.","ex_zh":"這些植物在陽光下長得很好。"},{"w":"tide","pos":"n.","zh":"潮汐；潮水","ex":"The tide is coming in.","ex_zh":"漲潮了。"},{"w":"timber","pos":"n.","zh":"木材","ex":"The house is made of timber.","ex_zh":"這棟房子是用木材蓋的。"},{"w":"tin","pos":"n.","zh":"錫；罐頭","ex":"I opened a tin of tuna.","ex_zh":"我打開一罐鮪魚罐頭。"},{"w":"tolerate","pos":"v.","zh":"容忍；忍受","ex":"I can't tolerate loud noise.","ex_zh":"我無法忍受很吵的噪音。"},{"w":"toll","pos":"n.","zh":"通行費；傷亡人數","ex":"We paid the toll on the highway.","ex_zh":"我們在高速公路上付了通行費。"},{"w":"tone","pos":"n.","zh":"語氣；音調","ex":"Don't talk to me in that tone.","ex_zh":"不要用那種語氣跟我說話。"},{"w":"torch","pos":"n.","zh":"火把；（英）手電筒","ex":"Bring a torch for the camping trip.","ex_zh":"露營要帶手電筒。"},{"w":"tornado","pos":"n.","zh":"龍捲風","ex":"The tornado destroyed many houses.","ex_zh":"龍捲風摧毀了很多房子。"},{"w":"tournament","pos":"n.","zh":"錦標賽；比賽","ex":"Our team won the tennis tournament.","ex_zh":"我們隊贏了網球錦標賽。"},{"w":"trace","pos":"n./v.","zh":"痕跡；追蹤","ex":"The thief left no trace.","ex_zh":"小偷沒有留下任何痕跡。"},{"w":"trail","pos":"n.","zh":"小徑；步道","ex":"We walked along the mountain trail.","ex_zh":"我們沿著山上的步道走。"},{"w":"transfer","pos":"v./n.","zh":"轉移；轉乘；轉帳","ex":"I need to transfer money to my mom.","ex_zh":"我需要轉帳給我媽。"},{"w":"transform","pos":"v.","zh":"改變；轉變","ex":"The new paint transformed the room.","ex_zh":"新油漆讓房間煥然一新。"},{"w":"transition","pos":"n.","zh":"轉變；過渡","ex":"The transition to a new job is hard.","ex_zh":"換新工作的過渡期很辛苦。"},{"w":"translate","pos":"v.","zh":"翻譯","ex":"Can you translate this into English?","ex_zh":"你可以把這個翻成英文嗎？"},{"w":"translation","pos":"n.","zh":"翻譯；譯文","ex":"This translation is not correct.","ex_zh":"這個翻譯不正確。"},{"w":"transparent","pos":"adj.","zh":"透明的","ex":"The box is made of transparent plastic.","ex_zh":"這個盒子是透明塑膠做的。"},{"w":"treasure","pos":"n./v.","zh":"寶藏；珍惜","ex":"I will treasure this gift.","ex_zh":"我會珍惜這份禮物。"},{"w":"treatment","pos":"n.","zh":"治療；對待","ex":"He is getting treatment for his back.","ex_zh":"他正在治療背痛。"},{"w":"trial","pos":"n.","zh":"試用；審判","ex":"Try the app with a free trial.","ex_zh":"用免費試用來體驗這個應用程式。"},{"w":"tribe","pos":"n.","zh":"部落","ex":"The tribe lives in the mountains.","ex_zh":"這個部落住在山上。"},{"w":"tropical","pos":"adj.","zh":"熱帶的","ex":"I love tropical fruit like mango.","ex_zh":"我很愛芒果這類熱帶水果。"},{"w":"tutor","pos":"n./v.","zh":"家教","ex":"I have a math tutor.","ex_zh":"我有一位數學家教。"},{"w":"twist","pos":"v./n.","zh":"扭轉；扭傷","ex":"I twisted my ankle yesterday.","ex_zh":"我昨天扭到腳踝。"},{"w":"typical","pos":"adj.","zh":"典型的；一般的","ex":"This is a typical Taiwanese breakfast.","ex_zh":"這是典型的台灣早餐。"},{"w":"ultimate","pos":"adj.","zh":"最終的；終極的","ex":"Our ultimate goal is to win.","ex_zh":"我們的最終目標是贏。"},{"w":"unique","pos":"adj.","zh":"獨特的；唯一的","ex":"Everyone is unique.","ex_zh":"每個人都是獨一無二的。"},{"w":"unit","pos":"n.","zh":"單位；單元","ex":"We finished Unit 3 today.","ex_zh":"我們今天上完第三單元。"},{"w":"universe","pos":"n.","zh":"宇宙","ex":"The universe is very big.","ex_zh":"宇宙非常大。"},{"w":"update","pos":"v./n.","zh":"更新","ex":"Please update the app.","ex_zh":"請更新這個應用程式。"}];
const LEVELS = [
  {name:'第 1 級', range:[0,500],   note:'最常用的 500 字：會了這些，日常對話大概能聽懂一半。'},
  {name:'第 2 級', range:[500,1500], note:'第 501～1,500 字：初級（A2），能應付購物、點餐、問路等日常情境。'},
  {name:'第 3 級', range:[1500,3000],note:'第 1,501～3,000 字：中級（B1），一般生活與工作大致夠用。'},
];
const KEY='en3000-known', LKEY='en3000-level';
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...known]))}catch(e){}}
let level=0; try{level=+(localStorage.getItem(LKEY)||0)||0}catch(e){}
let shown=100;

const $=id=>document.getElementById(id);
const tabs=$('tabs'), list=$('list');

function renderTabs(){
  tabs.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const b=document.createElement('button');
    b.className='tab'; b.setAttribute('role','tab'); b.setAttribute('aria-selected',i===level);
    const n=L.range[1]-L.range[0];
    let k=0; for(let j=L.range[0];j<L.range[1];j++) if(DATA[j]&&known.has(DATA[j].w)) k++;
    b.innerHTML=`${L.name}<small>${k}/${n}</small>`;
    b.onclick=()=>{level=i;shown=100;try{localStorage.setItem(LKEY,i)}catch(e){};renderTabs();render();window.scrollTo({top:0})};
    tabs.appendChild(b);
  });
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hl(ex,w){
  const re=new RegExp('\\b('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)','i');
  return esc(ex).replace(re,'<b>$1</b>');
}
function speak(t){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}
}
function current(){
  const q=$('q').value.trim().toLowerCase();
  let idx=[];
  if(q){ DATA.forEach((d,i)=>{ if(d.w.toLowerCase().includes(q)||d.zh.includes(q)) idx.push(i) }) }
  else { const [a,b]=LEVELS[level].range; for(let i=a;i<b&&i<DATA.length;i++) idx.push(i) }
  if($('hideKnown').checked) idx=idx.filter(i=>!known.has(DATA[i].w));
  return {q,idx};
}
function levelOf(i){return i<500?1:i<1500?2:3}
function render(){
  const {q,idx}=current();
  list.classList.toggle('quiz',$('quiz').checked);
  $('note').textContent = q ? `搜尋「${q}」：共 ${idx.length} 個` : LEVELS[level].note;
  list.innerHTML='';
  const frag=document.createDocumentFragment();
  idx.slice(0,shown).forEach(i=>{
    const d=DATA[i], k=known.has(d.w);
    const li=document.createElement('li'); li.className='w'+(k?' known':'');
    li.innerHTML=`<span class="rank">${q?'L'+levelOf(i)+' · ':''}${i+1}</span>
      <div><div class="head"><span class="word">${esc(d.w)}</span><span class="pos">${esc(d.pos)}</span><span class="zh">${esc(d.zh)}</span></div></div>
      <div class="actions"><button class="icon" data-say aria-label="念出 ${esc(d.w)}">🔊</button><button class="icon ${k?'on':''}" data-k aria-label="標記已會">✓</button></div>
      <div class="ex">${hl(d.ex,d.w)} <button class="icon" data-sayex aria-label="念出例句" style="display:inline-grid;width:26px;height:26px;font-size:.8rem;vertical-align:middle">🔊</button><br><span class="exzh">${esc(d.ex_zh)}</span></div>`;
    li.querySelector('[data-say]').onclick=()=>speak(d.w);
    li.querySelector('[data-sayex]').onclick=()=>speak(d.ex);
    li.querySelector('[data-k]').onclick=()=>{ known.has(d.w)?known.delete(d.w):known.add(d.w); save(); renderTabs(); render(); };
    li.querySelectorAll('.zh,.exzh').forEach(el=>el.onclick=()=>li.classList.toggle('shown'));
    frag.appendChild(li);
  });
  list.appendChild(frag);
  $('more').hidden = idx.length<=shown;
  $('empty').hidden = idx.length>0;
  const [a,b]=LEVELS[level].range; let k=0; for(let j=a;j<b;j++) if(DATA[j]&&known.has(DATA[j].w)) k++;
  $('ptext').textContent=`${LEVELS[level].name}已會 ${k} / ${b-a}`;
  $('pfill').style.width=(k/(b-a)*100)+'%';
}
$('q').oninput=()=>{shown=100;render()};
$('hideKnown').onchange=render;
$('quiz').onchange=render;
$('more').onclick=()=>{shown+=100;render()};
renderTabs(); render();
</script>
