<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>代理執行過程設計稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 版面：沿用後台的淺色系（深藍側欄色、白卡、藍色重點），設計稿放在模擬的後台框裡；上方分頁切換 A／B／C／分析頁。後台本身只有淺色，所以這頁刻意只做淺色。 */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunk: #f7f8fa; --line: #dfe2e7; --line-2: #eceff3;
  --ink: #1d2433; --muted: #5f6b7a; --faint: #8a94a3; --navy: #1d2433; --navy-2: #2c3548;
  --accent: #1f5fbf; --accent-soft: #e8f0fb;
  --ok: #17703f; --ok-soft: #e3f4ea; --warn: #8a5a00; --warn-soft: #fdf2d8; --bad: #b3261e; --bad-soft: #fbe9e7;
  --c-model: #2a78d6; --c-sql: #eb6834; --c-profile: #1baf7a; --c-sort: #eda100; --c-reply: #e87ba4; --c-prog: #a3acb9;
  --c-ctx: #5f6b7a; --c-acc: #9cc2ef;
  --note: #6d3fc0; --note-soft: #f1ebfb;
  --f-body: "Inter", -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--f-body); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.3; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }

/* 開頭 */
.intro { display: grid; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.intro h1 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.lead { max-width: 68ch; color: #3a4456; font-size: 15px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; color: var(--muted); }
.fact b { color: var(--ink); font-weight: 600; }

/* 分頁 */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 0; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-top: 8px; }
.tab { border: 1px solid transparent; border-bottom: none; background: none; padding: 9px 14px 10px; border-radius: 8px 8px 0 0; cursor: pointer; color: var(--muted); font-weight: 500; display: grid; gap: 1px; text-align: left; }
.tab small { font-size: 11.5px; font-weight: 400; color: var(--faint); }
.tab:hover { color: var(--ink); background: #eaedf1; }
.tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); margin-bottom: -1px; }
.tab[aria-selected="true"] b { color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; color: var(--muted); }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.plan-head { display: grid; gap: 6px; }
.plan-head h2 { font-size: 20px; }
.plan-head p { max-width: 75ch; color: #3a4456; }

/* 模擬後台框 */
.frame { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: clip; box-shadow: 0 1px 2px rgba(29,36,51,.06), 0 8px 24px rgba(29,36,51,.06); margin-inline: auto; width: 100%; transition: max-width .25s ease; }
.frame.narrow { max-width: 680px; }
.frame-bar { background: var(--navy); color: #c9d0db; padding: 8px 14px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.frame-bar b { color: #fff; font-weight: 600; }
.frame-bar .sep { color: #6c7790; }
.frame-body { padding: 16px; display: grid; gap: 14px; }
.run-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.run-head h3 { font-size: 16px; }
.quote { background: var(--sunk); border-radius: 6px; padding: 8px 12px; }
.pre-step { font-size: 12.5px; color: var(--muted); }
.folded { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; }
.folded-list { display: flex; flex-wrap: wrap; gap: 6px; }
.folded-list span { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--sunk); }
.folded-list span::before { content: "▸ "; color: var(--faint); }

/* 標籤 */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 20px; background: #eceff3; color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok::before { content: "✓"; }
.pill.bad::before { content: "✕"; }
.kdot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; background: var(--k, var(--c-prog)); }
.ktag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.demo { font-size: 11px; font-weight: 600; color: var(--note); background: var(--note-soft); border-radius: 4px; padding: 0 6px; line-height: 18px; }

/* 設計稿註記 */
.note { display: none; border-left: 3px solid var(--note); background: var(--note-soft); color: #3d2a66; border-radius: 0 6px 6px 0; padding: 7px 10px; font-size: 12.5px; }
.note b { color: var(--note); }
.show-notes .note { display: block; }
.item { display: none; font-size: 11px; font-weight: 700; color: var(--note); border: 1px solid #cdbbef; border-radius: 4px; padding: 0 5px; line-height: 17px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.show-notes .item { display: inline-block; }

/* 摘要列 */
.sumbar { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding: 10px 14px; background: var(--sunk); border: 1px solid var(--line-2); border-radius: var(--r); }
.sumbar .stat { display: grid; gap: 0; }
.sumbar .stat span { font-size: 11.5px; color: var(--muted); }
.sumbar .stat b { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.sumbar .stat b small { font-size: 12px; font-weight: 500; color: var(--muted); }

/* 區塊標題 */
.sec-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 650; }
.sec-title .muted { font-weight: 400; font-size: 12.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* 瀑布圖 */
.wf { display: grid; gap: 2px; }
.wf-row { display: grid; grid-template-columns: 168px minmax(0, 1fr); align-items: center; min-height: 26px; border-radius: 4px; }
.wf-row.child .wf-lab { padding-left: 18px; }
.wf-row.child .wf-lab::before { content: "└"; color: var(--faint); margin-right: 4px; }
.wf-row:hover, .wf-row.hl { background: var(--accent-soft); }
.wf-lab { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; display: flex; align-items: center; gap: 6px; }
.wf-track { position: relative; height: 26px; background-image: linear-gradient(to right, var(--line-2) 1px, transparent 1px); background-size: var(--tick) 100%; }
.wf-bar { position: absolute; top: 6px; height: 14px; border: 0; padding: 0; border-radius: 3px; background: var(--k); cursor: pointer; min-width: 3px; }
.wf-bar.err { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--bad); }
.wf-bar:hover, .wf-bar:focus-visible { filter: brightness(1.08); outline: 2px solid var(--ink); outline-offset: 1px; }
.wf-val { position: absolute; top: 4px; font-size: 11.5px; color: var(--muted); white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.wf-axis .wf-track { height: 18px; background: none; }
.wf-tick { position: absolute; top: 0; font-size: 11px; color: var(--faint); transform: translateX(-50%); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wf-tick:last-child { transform: translateX(-100%); }
.wf-tick:first-child { transform: none; }

/* 步驟卡 */
.round { display: grid; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); scroll-margin-top: 90px; }
.round.flash { animation: flash 1.2s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.round-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.round-h h4 { font-size: 14.5px; }
.round-h .meta { font-size: 12.5px; color: var(--muted); }
.calls { display: grid; gap: 10px; border-left: 2px solid var(--line-2); margin-left: 4px; padding-left: 14px; }
.call { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; scroll-margin-top: 90px; }
.call.flash { animation: flash 1.2s ease; }
.call-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 8px 12px; background: var(--sunk); border-bottom: 1px solid var(--line-2); }
.call-h .mono { color: var(--muted); }
.call-h .sum { color: #3a4456; font-size: 13px; flex: 1 1 260px; }
.call-b { padding: 10px 12px; display: grid; gap: 10px; min-width: 0; }
.think { border: 1px solid #d5e4f7; background: #f5f9fe; border-radius: 6px; }
.think summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.think summary .lbl { font-weight: 600; color: #1b4f8f; }
.think[open] summary .prev { display: none; }
.think .body { padding: 0 10px 10px; display: grid; gap: 6px; }
.think .body p { max-width: 72ch; }
.said { margin: 0; border-left: 3px solid var(--c-model); padding: 4px 10px; color: #2b3445; }
.raw { font-size: 12.5px; }
.raw summary { cursor: pointer; color: var(--muted); }
.raw pre { background: var(--sunk); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; max-height: 280px; overflow: auto; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.5; margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; }
.raws { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.raws .raw { flex: 1 1 260px; min-width: 0; }

/* SQL */
.sql { margin: 0; background: #1d2433; color: #dfe5ee; border-radius: 6px; padding: 10px 12px; font-family: var(--f-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
.sql .kw { color: #8fc1ff; font-weight: 600; }
.sql .str { color: #f3c37a; }
.sql .badcol { background: #8f1f1a; color: #fff; border-radius: 3px; padding: 0 3px; }
.dberr { display: flex; gap: 8px; align-items: flex-start; background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.dberr b { white-space: nowrap; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font-weight: 600; background: var(--sunk); color: #3a4456; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: bottom; }
th .mono { display: block; font-weight: 400; color: var(--faint); font-size: 10.5px; }
td { padding: 5px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td.r, th.r { text-align: right; }
td.name { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
tr.flag td { background: #fff6e0; }
td .flagtxt { color: var(--warn); font-weight: 600; }
.more { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 12.5px; }

/* 改需求 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; background: #e6f6ef; color: #0f5c3c; border-radius: 6px; padding: 2px 8px; }
.chip.cut { background: var(--bad-soft); color: var(--bad); }
.why { font-size: 13px; color: #3a4456; }
.why::before { content: "模型的理由："; color: var(--muted); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px 20px; }
.sub-h { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.wrows { display: grid; gap: 5px; }
.wrow { display: grid; grid-template-columns: 52px minmax(60px, 1fr) 104px; gap: 8px; align-items: center; font-size: 12.5px; }
.wt { position: relative; height: 14px; background: var(--sunk); border-radius: 3px; }
.wt .was { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--c-prog); border-radius: 0 2px 2px 0; }
.wt .now { position: absolute; left: 0; top: 0; height: 8px; background: var(--c-profile); border-radius: 0 3px 3px 0; }
.wv { font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--ok); font-style: normal; font-weight: 600; }
.down { color: var(--bad); font-style: normal; font-weight: 600; }
.same { color: var(--faint); font-style: normal; }
.ranks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ranks ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; font-size: 12.5px; }
.ranks li { padding-left: 2px; }
.ranks li.mv { font-weight: 600; }

/* 回覆預覽 */
.bubble { background: #f3f5f8; border: 1px solid var(--line-2); border-radius: 12px 12px 12px 4px; padding: 10px 12px; white-space: pre-line; font-size: 13px; max-height: 260px; overflow: auto; }
.cardrow { display: flex; flex-wrap: wrap; gap: 8px; }
.ucard { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; background: var(--surface); }
.ucard b { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; }

/* 說明書與 token */
.ctxgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px 22px; }
.parts { display: grid; gap: 2px; }
.part summary { display: grid; grid-template-columns: 112px minmax(40px, 1fr) 104px; gap: 8px; align-items: center; font-size: 12.5px; cursor: pointer; padding: 2px 4px; border-radius: 4px; list-style: none; }
.part summary::-webkit-details-marker { display: none; }
.part summary:hover { background: var(--accent-soft); }
.part .pl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.part .pt { height: 10px; background: var(--sunk); border-radius: 2px; position: relative; }
.part .pt i { position: absolute; inset: 0 auto 0 0; background: var(--c-ctx); border-radius: 0 2px 2px 0; }
.part.data .pt i { background: var(--c-acc); }
.part .pv { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.part pre { margin: 4px 0 8px; background: var(--sunk); border-radius: 6px; padding: 8px 10px; font-family: var(--f-mono); font-size: 11.5px; white-space: pre-wrap; max-height: 200px; overflow: auto; }
.tokrows { display: grid; gap: 6px; }
.tokrow { display: grid; grid-template-columns: 64px minmax(80px, 1fr) 66px; gap: 8px; align-items: center; font-size: 12.5px; }
.toktrack { height: 16px; display: flex; gap: 2px; }
.toktrack i { display: block; height: 100%; }
.toktrack i:first-child { border-radius: 3px 0 0 3px; }
.toktrack i:last-child { border-radius: 0 3px 3px 0; }
.tokaxis { display: grid; grid-template-columns: 64px minmax(80px, 1fr) 66px; gap: 8px; font-size: 11px; color: var(--faint); }
.tokaxis div { display: flex; justify-content: space-between; }
.insight { font-size: 13px; background: var(--accent-soft); color: #173f7a; border-radius: 6px; padding: 7px 10px; }

/* B 檢視器 */
.insp { display: grid; grid-template-columns: 300px minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-height: 560px; }
.tree { background: var(--sunk); border-right: 1px solid var(--line); padding: 8px; display: grid; align-content: start; gap: 1px; overflow-y: auto; max-height: 720px; }
.node { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; grid-template-rows: auto 4px; column-gap: 8px; row-gap: 3px; align-items: center; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 13px; }
.node.child { padding-left: 26px; grid-template-columns: 12px minmax(0, 1fr) auto; }
.node:hover { background: #eaedf1; }
.node[aria-selected="true"] { background: var(--surface); border-color: var(--accent); box-shadow: 0 1px 2px rgba(31,95,191,.12); }
.node .nl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .nm { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.node .nb { grid-column: 2 / 4; height: 4px; background: var(--line-2); border-radius: 2px; position: relative; }
.node .nb i { position: absolute; top: 0; height: 4px; background: var(--k); border-radius: 2px; min-width: 2px; }
.node .bad { color: var(--bad); font-weight: 700; }
.tree-sep { font-size: 11px; color: var(--faint); padding: 8px 8px 2px; letter-spacing: .06em; }
.detail { padding: 14px 16px; display: grid; align-content: start; gap: 12px; min-width: 0; }
.detail-h { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.detail-h h4 { font-size: 16px; }
.dtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dtab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; color: var(--muted); font-weight: 500; }
.dtab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.propbar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; gap: 2px; }
.propbar i { display: block; height: 100%; min-width: 2px; }
.kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }

/* C 劇本（第 2 版）：左邊窄順序圖（四條直線＝四個角色），右邊整寬卡片照順序往下排；上方劇情列固定在畫面頂端 */
.sq-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); align-items: center; }
.sq-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.lg-msg { width: 26px; height: 2px; background: var(--muted); position: relative; display: inline-block; }
.lg-msg::after { content: ""; position: absolute; right: -2px; top: -4px; border-style: solid; border-width: 5px 0 5px 7px; border-color: transparent transparent transparent var(--muted); }
.lg-busy { width: 8px; height: 18px; border-radius: 4px; background: var(--c-model); display: inline-block; }
.sq-head { position: sticky; top: var(--tabs-h, 60px); z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 72px 136px minmax(0, 1fr); align-items: center; margin-inline: -16px; padding: 6px 16px; }
.sq-head .tcap { font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; padding-right: 10px; }
.sq-lanes { position: relative; height: 22px; }
.sq-lanes span { position: absolute; top: 2px; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.sq-story { position: relative; display: flex; gap: 4px; align-items: center; overflow-x: auto; white-space: nowrap; scrollbar-width: thin; padding: 3px 2px; font-size: 12.5px; }
.sq-story .st { flex: none; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px 1px 6px; background: var(--surface); cursor: pointer; }
.sq-story .st:hover { border-color: var(--accent); }
.sq-story .st.err { border-color: #e7a59f; background: var(--bad-soft); }
.sq-story .st.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: #173f7a; font-weight: 600; }
.sq-story .ar { color: var(--faint); flex: none; }
.sq { display: grid; }
.sq-row { display: grid; grid-template-columns: 72px 136px minmax(0, 1fr); }

<script>
const DATA = {"run": {"id": "9320a687-59d0-40a5-b937-a0fee3516f40", "turnNo": 5, "input": "3A 大作", "createdAt": "2026-11-11T10:09:16.776016+09:00", "ms": 14412, "preStep": "用戶在追問卡「遊戲類型」選了「3A 大作」，程式已把需求設成「需要獨立顯卡」", "userMessage": "（用戶在畫面上的操作）用戶在追問卡「遊戲類型」選了「3A 大作」，程式已把需求設成「需要獨立顯卡」", "stop": "reply_tool", "replySource": "reply_tool", "totals": {"ms": 14252, "rounds": 4, "toolCalls": 5, "inputTokens": 96191, "outputTokens": 1428}, "timings": [{"ms": 3, "name": "讀設定"}, {"ms": 37, "name": "讀對話紀錄"}, {"ms": 0, "name": "讀用戶操作"}, {"ms": 27, "name": "前置步驟"}, {"ms": 4588, "name": "代理第 1 回合"}, {"ms": 2413, "name": "代理第 2 回合"}, {"ms": 2266, "name": "代理第 3 回合"}, {"ms": 4957, "name": "代理第 4 回合"}, {"ms": 1, "name": "整理卡片"}, {"ms": 119, "name": "局勢"}, {"ms": 8, "name": "存檔"}], "contextChars": 28817, "parts": [{"name": "開場白", "chars": 68, "kind": "rule", "excerpt": "你是「AI 筆電選購助手」，在台灣幫用戶挑筆電。你的唯一目標：了解用戶真正的需求，推薦最適合他的筆電，讓用戶感受到你了解他、理解他。\n\n"}, {"name": "工作方式", "head": "你怎麼工作", "chars": 116, "kind": "rule", "excerpt": "## 你怎麼工作\n每一輪你會收到用戶說的一句話，或程式替用戶在畫面上的操作寫的說明。你自己判斷用戶想做什麼；需要資料就用工具查，工具可以呼叫很多次，查夠了再回答。\n最後一定要呼叫 reply 工具交出回覆和卡片，這一輪才算結束。\n\n"}, {"name": "選工具的規則", "head": "兩條路：先想清楚再選工具", "chars": 267, "kind": "rule", "excerpt": "## 兩條路：先想清楚再選工具\n1. 篩選、排序類（「1 萬以內」「要 OLED」「最輕的幾台」「續航最久的」「推薦一台給我」）：用 update_profile 設定需求與權重，需要依某個規格排時用 sort_pool，交給推薦引擎算。引擎算出的名單就是用戶畫面上的候選池，你推薦的機型要從這份名單挑。\n2. 查事實、統計類（「這台喇叭幾瓦」「各品牌平均價格」「有幾台有指紋辨識」）：用 sql_query 查資料庫。只是想知道一件事時，不要去改用戶的需求。\n分不清時問自己：用戶是想「縮小或重排候選」，還是只想「知道一件事」？\n\n"}, {"name": "推薦引擎說明", "head": "推薦引擎怎麼算", "chars": 640, "kind": "rule", "excerpt": "## 推薦引擎怎麼算\n- 需求分兩種：硬條件（hard: true）會把不符合的機型排除；偏好（hard: false）不排除。偏好會不會自動改權重，看下方「這段對話目前的狀態」的「權重怎麼變」那行。\n- 什麼時候用硬條件：用戶說「一定要」「不能超過」「X 以內」「只要」「不要」這種明確界線才用硬條件。「希望」「最好」「輕一點」「便宜一點」「盡量」是偏好：用 hard: false 的需求記下來，再調高對應的權重（例如「輕一點」→ 調高 portability），不要直接加硬條件把候選刷掉。硬條件刷掉大量機型前，先想想用戶是不是真的不能接受。\n- 七個權重維度，整數、總和 100：performance 性能、display 螢幕、portability 便攜、battery 續航、thermal 散熱、noise 安靜、expandability 擴充。每台機型在每個維度有分數，產品力分＝各維度分數依權重加權。\n- 性能底下有 5 個細項比例，總和 100：cpu_single 單核、cpu_multi 多核、gpu 顯卡、memory 記憶體、storage 儲存。\n- 權重是這個用戶專屬的：依你對他的了解設定，並在 w"}, {"name": "需求寫法", "head": "需求的寫法（update_profile 的 ops）", "chars": 947, "kind": "rule", "excerpt": "## 需求的寫法（update_profile 的 ops）\n新增或修改：{\"op\":\"upsert\",\"req\":{\"id\":\"自己取，英數與底線，同一條需求沿用同一個 id\",\"field\":欄位,\"value\":值,\"label\":\"給用戶看的短標籤\",\"hard\":true 或 false,\"confidence\":0到1,\"evidence\":\"用戶原文片段，沒有就 null\"}}\n刪除：{\"op\":\"delete\",\"id\":\"需求 id\"}\n欄位與值：\n- budget 預算（新台幣）：{\"min\":數字,\"max\":數字}，可只給一邊\n- size 螢幕尺寸：{\"mode\":\"around\"|\"max\"|\"min\"|\"range\",\"inch\":數字,\"to\":數字（range 才給）}\n- weight_max 重量上限：公斤數字\n- brand 品牌：{\"only\":[\"品牌\"],\"no\":[\"品牌\"]}\n- os 作業系統：\"windows\" 或 \"macos\"\n- ram_min 記憶體下限：GB 數字\n- dgpu_required 要不要獨顯：true 或 false\n- refresh_min "}, {"name": "資料庫欄位清單", "head": "資料庫", "chars": 16600, "kind": "data", "excerpt": "## 資料庫\n共 370 台上架筆電，價格是新台幣。sql_query 只能查檢視表 agent_laptops（每台一列，id 是機型 id，name 是機型名稱）。欄位清單（欄名｜中文｜類型｜單位）：\nid｜機型 id｜文字\nname｜機型名稱｜文字\nbrand｜品牌｜類別\nprice｜價格｜數值（越低越好）｜元\ntest_start_date｜測試開始日期｜文字（不可比較）\nreview_date｜評測日期｜文字（不可比較）\nseries｜系列｜類別\nwarranty_months｜保固期｜數值（越高越好）｜月\nbuy_url｜購買連結｜文字（不可比較）\nreview_video_url｜評測影片連結｜文字（不可比較）\ntested_perf_mode｜測試時的性能模式｜類別\nperf_modes｜可選性能模式｜文字（不可比較）\nhumidity_pct｜測試環境濕度｜數值（越高越好）｜%\nroom_temp_c｜測試室溫｜數值（越低越好）｜°C\ndescription｜配置描述｜文字（不可比較）\nshell_a_material｜A 面（螢幕背蓋）材質｜類別\nshell_b_material｜B 面（螢幕邊框）材質｜"}, {"name": "卡片說明", "head": "卡片（放在 reply 的 cards）", "chars": 451, "kind": "rule", "excerpt": "## 卡片（放在 reply 的 cards）\n這一輪可以用的卡片：recommend、compare、followup\n只能用上面列出的種類；下面的寫法說明裡，沒有列在上面的種類這一輪不能用，出了會被程式拿掉。\n- recommend 推薦卡：{\"type\":\"recommend\",\"ids\":[\"機型 id\",...]}，依你要的順序，最多 5 台。\n- compare 對比卡：{\"type\":\"compare\",\"ids\":[\"機型 id\",...]}，2～3 台並排比較。\n- followup 追問卡：{\"type\":\"followup\",\"cardId\":\"題目 id\"}，從下方追問題庫挑一題，一輪最多一張；用戶點了選項，程式會套用並在下一輪告訴你。\n- suggest 建議回覆：{\"type\":\"suggest\",\"items\":[\"用戶可能想接著說的一句話\",...]}，最多 3 句，用用戶的口吻寫完整的話。\n需求卡（這輪新增的需求）和候選數量卡由程式自動附上，你不用出。\n\n"}, {"name": "回覆寫法", "head": "回覆的寫法", "chars": 384, "kind": "rule", "excerpt": "## 回覆的寫法\n- 繁體中文（台灣用語），口語、親切、簡潔。\n- 純文字：畫面不支援粗體、標題、表格與 * # | 這些符號；要分點就用「1.」或換行。\n- 價格、規格、分數只能用工具查到或下方資料裡的數字；查不到就說不知道，不要猜。沒有查過的面向（例如噪音、散熱、做工）不要下評語，要評論先用 sql_query 查。\n- 說「最便宜」「最輕」「續航最久」這類最高級之前，要用 sort_pool 或 sql_query 在整個候選池確認過；只看過其中幾台時，要說「這幾台裡」。比較兩台誰比較強，要對照查到的數字，不要憑印象。\n- 回覆文字裡提到的名次與順序，要和你附的推薦卡順序一致；「第 1 名」「前兩名」指的是候選池（推薦卡）的順序。\n- 推薦時說清楚為什麼適合他、要接受哪些取捨。\n- 資訊不夠時，問一個最關鍵的問題就好（可以用追問卡，也可以直接問）。\n\n"}, {"name": "目前狀態", "head": "這段對話目前的狀態", "chars": 898, "kind": "data", "excerpt": "## 這段對話目前的狀態\n第 5 輪對話\n需求標籤（id｜欄位｜標籤｜硬條件或偏好｜值）：\n- budget｜budget｜預算 1 萬以內｜硬條件｜值 {\"max\":10000}\n- purpose｜purpose｜上課寫報告＋玩遊戲｜偏好｜值 \"上課寫報告、玩遊戲\"\n- carry｜portability｜每天背去學校｜偏好｜值 \"high\"\n- req_card_card_battery_day｜priority｜重視續航｜偏好｜值 \"battery\"\n- req_card_card_game_genre_aaa｜dgpu_required｜需要獨立顯卡｜硬條件｜值 true\n七維權重（AI 設定；理由：要玩遊戲所以性能拉高，但每天背去學校、要撐一整天，便攜和續航還是留著重量）：性能＝30、螢幕＝20、便攜＝20、續航＝20、散熱＝6、安靜＝3、擴充＝1\n權重怎麼變：用途、攜帶頻率、特別重視這些偏好需求本身不會改權重；要影響排名，請在 update_profile 直接給 weights。\n性能細項（AI 設定）：顯卡＝35、記憶體＝12、儲存＝8、多核＝20、單核＝25\n排除的機型：（沒有）\n對比清單：華碩a豆14 "}, {"name": "候選前 10 名", "head": "候選池前幾名", "chars": 948, "kind": "data", "excerpt": "## 候選池前幾名\n符合 127 台、差一點 35 台\n1. 260129A｜機械革命翼龍15 Pro 2026｜NT$6,549｜產品力 63.9\n2. SHDX0007｜ROG 魔霸9 (Strix 9 G16) (2025) 魔霸9 G16 RTX5070｜NT$8,999｜產品力 55.2\n3. SHDX0163｜拯救者 Y7000X (2026) Intel Core Ultra 7 251HX / RTX 5060 8GB / 32GB / 1TB｜NT$9,999｜產品力 54.8\n4. SHDX0162｜拯救者 Y7000X (2026) Intel Core Ultra 7 251HX / RTX 5060 8GB / 16GB / 1TB｜NT$8,499｜產品力 54.6\n5. SHDX0248｜戰神 T10 Pro (2025) Intel Core i7-14700HX / RTX 5070 Ti 12GB / 32GB / 1TB｜NT$7,899｜產品力 54.1\n6. SHDX0046｜華碩天選Air 2026 (TUF Air 2026) (2026) 天選Air 2026 AI9+RTX5"}, {"name": "追問題庫", "head": "追問題庫", "chars": 1198, "kind": "data", "excerpt": "## 追問題庫\ncard_edit_intensity｜剪輯強度｜你剪片大概是哪種強度？｜選項：輕度、中度、重度\ncard_portability｜攜帶頻率｜你多常帶著它出門？｜選項：每天背著走、偶爾帶出門、幾乎都放桌上\ncard_software｜常用軟體｜有固定要用的專業軟體嗎？｜選項：Photoshop、Illustrator、Premiere Pro、都沒有，一般使用為主\ncard_weigh   const why = a.weightReason && !noWhy ? `<p class="why">${esc(a.weightReason)}</p>` : '';
  const cand = `<div><div class="sub-h">候選台數 ${item(3)}</div><p class="small">正式 <b>${n(R.formalBefore)} → ${n(res.formal)}</b> 台（沒變）・邊界 ${n(res.edge)}・排除 ${n(res.out)}</p><div class="chips" style="margin-top:6px">${res.cut.map((x) => `<span class="chip cut">${esc(x.label)} −${n(x.cut)}</span>`).join('')}</div></div>`;
  if (compact) {
    const keys = Object.keys(a.weights).filter((k) => a.weights[k] !== R.weightsBefore[k]).sort((x, y) => Math.abs(a.weights[y] - R.weightsBefore[y]) - Math.abs(a.weights[x] - R.weightsBefore[x]));
    return `${applied}<div class="mini-wt">${keys.slice(0, 4).map((k) => { const d = a.weights[k] - R.weightsBefore[k]; return `<span>${DIM[k]} ${R.weightsBefore[k]}→<b>${a.weights[k]}</b> ${d > 0 ? `<em class="up">▲${d}</em>` : `<em class="down">▼${-d}</em>`}</span>`; }).join('')}<span class="faint">顯卡細項 35→<b>50</b></span></div><p class="small muted">候選仍是 ${n(res.formal)} 台・第 1 名不變・戰神 T10 Pro 從第 5 升到第 2</p>`;
  }
  return `${applied}${why}
    <div class="cols2">
      <div><div class="sub-h"><span>權重</span><span class="legend"><span><i class="sw" style="background:var(--c-prog);height:4px"></i>改之前</span><span><i class="sw" style="background:var(--c-profile);height:8px"></i>改之後</span></span>${item(3)}</div>${wRows(a.weights, R.weightsBefore, DIM, 50)}</div>
      <div><div class="sub-h"><span>性能細項</span></div>${wRows(a.perfSubs, R.perfBefore, SUB, 60)}</div>
    </div>
    <div class="cols2">${cand}<div>${rankView(res)}</div></div>`;
}

/* ---------- 共用畫法：交出回覆 ---------- */
function replyView(c, { clip = false } = {}) {
  const text = c.args.text;
  const cards = (c.args.cards ?? []).map((k) => `<div class="ucard"><b>${k.type === 'recommend' ? '推薦卡' : k.type === 'compare' ? '對比卡' : esc(k.type)}</b>${k.ids.map((id) => esc(short(id))).join('、')}</div>`).join('');
  const body = clip ? `${esc(text.slice(0, 120))}…` : esc(text);
  return `<div class="bubble">${body}</div><div class="cardrow">${cards}</div>`;
}
function toolBody(c, opt = {}) {
  if (c.name === 'sql_query') return sqlView(c, opt);
  if (c.name === 'update_profile') return profileView(c, opt);
  if (c.name === 'reply') return replyView(c, opt);
  return '';
}
function rawView(c) {
  const args = JSON.stringify(c.args, null, 2), res = JSON.stringify(c.result, null, 2);
  return `<div class="raws"><details class="raw"><summary>參數原文（${n(jlen(c.args))} 字）</summary><pre>${esc(args)}</pre></details><details class="raw"><summary>交給模型的結果原文（${n(jlen(c.result))} 字）</summary><pre>${esc(res)}</pre></details></div>`;
}

/* ---------- 共用畫法：模型 ---------- */
function thinkView(rd, open) {
  const t = THINK[rd.n];
  return `<details class="think" ${open ? 'open' : ''}><summary><span class="lbl">模型的思考</span><span class="demo">示意</span>${item(4)}<span class="muted small prev">${esc(t.slice(0, 34))}…</span></summary><div class="body"><p>${esc(t)}</p><p class="small muted">示意文字：現在的系統沒有存思考內容。v1.0.49 起會記下模型真正的思考（每回合最多 2 萬字），還有思考用掉多少 token。</p></div></details>`;
}
const saidView = (rd) => (rd.text ? `<blockquote class="said">${esc(rd.text)}</blockquote>` : '<p class="small muted">這回合沒有說話，直接呼叫工具。</p>');
const sentLine = (rd) => (rd.n === 1
  ? `送出：說明書 ${n(R.contextChars)} 字＋用戶訊息`
  : `送出：上一回合的工具結果 ${n(rd.sentChars)} 字（說明書照樣整份重送）`);

/* ---------- 說明書與 token ---------- */
function partsView() {
  const parts = [...R.parts].sort((a, b) => b.chars - a.chars);
  const total = parts.reduce((a, p) => a + p.chars, 0), max = parts[0].chars;
  return `<div class="parts">${parts.map((p) => `<details class="part ${p.kind}"><summary><span class="pl" title="${esc(p.head ?? p.name)}">${esc(p.name)}</span><span class="pt"><i style="width:${(p.chars / max) * 100}%"></i></span><span class="pv">${n(p.chars)} 字・${pct(p.chars, total)}</span></summary><pre>${esc(p.excerpt)}${p.chars > p.excerpt.length ? '\n…（點開正式版可看全文）' : ''}</pre></details>`).join('')}</div>`;
}
function tokenView() {
  const base = R.rounds[0].inTok;
  const max = 30000;
  const rows = R.rounds.map((rd) => {
    const extra = rd.inTok - base;
    return `<div class="tokrow" data-tip="${esc(`<b>${n(rd.inTok)} token</b>　第 ${rd.n} 回合讀入<br>說明書與用戶訊息 約 ${n(base)}<br>之前回合累積 ${n(extra)}<br>寫出 ${n(rd.outTok)} token`)}"><span>第 ${rd.n} 回合</span><span class="toktrack"><i style="width:${(base / max) * 100}%;background:var(--c-ctx)"></i>${extra > 0 ? `<i style="width:${(extra / max) * 100}%;background:var(--c-acc)"></i>` : ''}</span><span class="num muted">${n(rd.inTok)}</span></div>`;
  }).join('');
  const sum = R.totals.inputTokens, rep = base * R.rounds.length;
  return `<div class="legend"><span><i class="sw" style="background:var(--c-ctx)"></i>說明書＋用戶訊息（每回合重送）</span><span><i class="sw" style="background:var(--c-acc)"></i>之前回合累積的工具結果與回覆</span></div>
    <div class="tokrows">${rows}</div>
    <div class="tokaxis"><span></span><div><span>0</span><span>10K</span><span>20K</span><span>30K</span></div><span></span></div>
    <p class="insight">${R.rounds.length} 回合共讀入 ${n(sum)} token，其中約 ${n(rep)}（${pct(rep, sum)}）是每回合重送的說明書。</p>`;
}
function contextBlock() {
  return `<div class="ctxgrid">
    <div><div class="sec-title">說明書組成 <span class="muted">${n(R.contextChars)} 字，點一段看內容</span>${item(5)}</div><div class="legend" style="margin:4px 0 6px"><span><i class="sw" style="background:var(--c-ctx)"></i>固定規則</span><span><i class="sw" style="background:var(--c-acc)"></i>每輪變動的資料</span></div>${partsView()}</div>
    <div><div class="sec-title">每回合讀入多少 token ${item(5)}</div>${tokenView()}</div>
  </div>`;
}

/* ---------- 共用：外框 ---------- */
function frame(inner, opts = {}) {
  const folded = ['模型抽取結果', '需求檔案的變化', '候選與結果', '前 5 名各維度貢獻', '回覆', '模型呼叫', '權重變化表', '追問決策', '局勢報告', '原始資料'];
  return `<div class="frame ${document.getElementById('opt-narrow').checked ? 'narrow' : ''}">

    <div class="frame-body">
      ${opts.stats ? '' : `<div class="run-head"><h3>第 5 輪</h3><span class="pill ok">推薦</span><span class="muted small">2026/11/11 10:09・14,412 毫秒・方案：代理方案</span></div>

      <p class="pre-step">程式先做的事：${esc(R.preStep)}</p>
      <div class="note"><b>第 1 項：</b>代理方案的輪次，執行過程直接放在用戶原文下面。原本排在前面的 10 個區塊，代理方案大多用不到，改成收起來放在最下面。</div>`}
      ${inner}

    </div>

}
function summaryBar() {
  return `<div class="sumbar">
    <span class="ktag">結束原因 <span class="pill ok">交出回覆</span></span>
    <div class="stat"><span>回合</span><b>${R.totals.rounds}</b></div>
    <div class="stat"><span>工具</span><b>${R.totals.toolCalls} <small>次・錯 1</small></b></div>
    <div class="stat"><span>整輪</span><b>${sec(R.ms)}</b></div>
    <div class="stat"><span>等模型</span><b>${pct(MODEL_MS, R.ms)}</b></div>
    <div class="stat"><span>讀入／寫出 token</span><b>${n(R.totals.inputTokens)} <small>／ ${n(R.totals.outputTokens)}</small></b></div>

}

/* ================= A 時間軸瀑布 ================= */
function waterfall() {
  const tick = (2000 / TOTAL) * 100;
  const ticks = [];
  for (let s = 0; s * 1000 <= TOTAL; s += 2) ticks.push(`<span class="wf-tick" style="left:${((s * 1000) / TOTAL) * 100}%">${s} 秒</span>`);
  const rows = STEPS.map((s) => {
    const left = (s.start / TOTAL) * 100, w = (s.ms / TOTAL) * 100;
    const flip = left + w > 82;
    const val = `<span class="wf-val" style="${flip ? `right:calc(${100 - left}% + 6px)` : `left:calc(${left + w}% + 6px)`}">${sec(s.ms)}${s.c ? `・${esc(toolShort(s.c))}` : ''}</span>`;
    const icon = s.c && s.c.status !== 'ok' ? '<span class="pill bad" style="padding:0 5px">錯</span>' : '';
    return `<div class="wf-row ${s.child ? 'child' : ''}" data-row="${s.key}"><div class="wf-lab">${kdot(s.kind)}<span>${esc(s.label)}</span>${icon}</div><div class="wf-track" style="--tick:${tick}%"><button type="button" class="wf-bar ${s.c && s.c.status !== 'ok' ? 'err' : ''}" style="--k:${KIND[s.kind].color};left:${left}%;width:${w}%" data-goto="${s.key}" data-tip="${esc(stepTip(s))}" aria-label="${esc(`${s.label} ${sec(s.ms)}`)}"></button>${val}</div></div>`;
  }).join('');
  return `<div class="wf"><div class="wf-row wf-axis"><div class="wf-lab"></div><div class="wf-track">${ticks.join('')}</div></div>${rows}</div>`;
}
function roundCardsA() {
  return R.rounds.map((rd) => `
    <section class="round" id="a-m${rd.n}">
      <div class="round-h"><h4>${kdot('model')} 第 ${rd.n} 回合</h4><span class="meta">模型 ${sec(rd.ms)}・讀入 ${n(rd.inTok)}・寫出 ${n(rd.outTok)} token</span><span class="meta faint">${sentLine(rd)}</span></div>
      ${thinkView(rd, false)}
      ${saidView(rd)}
      <div class="calls">${rd.calls.map((c, j) => `
        <article class="call" id="a-c${rd.n}-${j}">
          <div class="call-h"><span class="ktag">${kdot(c.name)}${esc(KIND[c.name].label)}</span><span class="mono">${esc(c.name)}</span>${statusPill(c.status)}<span class="muted small num">${sec(c.ms)}</span><span class="sum">${esc(c.summary)}</span></div>
          <div class="call-b">${toolBody(c)}${rawView(c)}</div>
        </article>`).join('')}</div>
    </section>`).join('');
}
function planA() {
  return `<div class="plan-head"><h2>A　時間軸瀑布</h2><p>最上面一張瀑布圖：每一列是一步，橫條長度就是花的時間。滑過看細節，點一下跳到下面那一步。下面照順序列出每個回合：模型的思考、說的話、每個工具的看懂版。和瀏覽器開發者工具的「網路」分頁很像，適合找「慢在哪、錯在哪」。</p></div>
  ${frame(`
    <div class="sec-title">代理執行過程 ${item(2)}</div>
    ${summaryBar()}
    <div class="legend">${['prog', 'model', 'sql_query', 'update_profile', 'reply'].map((k) => `<span>${kdot(k)}${KIND[k].label}</span>`).join('')}<span class="faint">紅框＝出錯</span></div>
    ${waterfall()}
    <div class="note"><b>第 2 項：</b>一眼看出 14.4 秒幾乎都在等模型（藍條），工具都只有幾十毫秒。第 1 回合的 SQL 有紅框，點它直接跳到那張卡。</div>
    ${contextBlock()}
    <div class="sec-title">每個回合 ${item(3)}${item(4)}</div>
    ${roundCardsA()}
  `)}`;
}

/* ================= B 左右檢視器 ================= */
let bSel = null, bTab = null;
function bNodes() {
  const nodes = [{ key: 'ctx', kind: 'prog', label: '說明書', meta: `${n(R.contextChars)} 字`, sep: '交給模型的資料' }];
  for (const s of STEPS) nodes.push({ ...s, meta: sec(s.ms), sep: s.key === 'prep' ? '執行順序' : undefined });
  return nodes;
}
function bTree(nodes) {
  return nodes.map((s) => {
    const left = s.start != null ? (s.start / TOTAL) * 100 : 0, w = s.ms != null ? (s.ms / TOTAL) * 100 : 0;
    const bad = s.c && s.c.status !== 'ok';
    return `${s.sep ? `<div class="tree-sep">${s.sep}</div>` : ''}<button type="button" class="node ${s.child ? 'child' : ''}" role="option" aria-selected="${s.key === bSel}" data-node="${s.key}" style="--k:${KIND[s.kind].color}">${kdot(s.kind)}<span class="nl">${esc(s.label)}${bad ? ' <span class="bad">✕</span>' : ''}</span><span class="nm">${esc(s.meta)}</span>${s.start != null ? `<span class="nb"><i style="left:${left}%;width:${w}%"></i></span>` : '<span class="nb" style="background:none"></span>'}</button>`;
  }).join('');
}
function bDetail(nodes) {
  const s = nodes.find((x) => x.key === bSel);
  const tabsOf = (list) => `<div class="dtabs" role="tablist">${list.map(([id, label]) => `<button type="button" class="dtab" role="tab" data-dtab="${id}" aria-selected="${id === bTab}">${label}</button>`).join('')}</div>`;
  if (s.key === 'ctx') {
    bTab = bTab && ['parts', 'tokens'].includes(bTab) ? bTab : 'parts';
    return `<div class="detail-h">${kdot('prog')}<h4>說明書</h4><span class="muted small">${n(R.contextChars)} 字・每回合都整份送給模型</span>${item(5)}</div>
      ${tabsOf([['parts', '組成'], ['tokens', '每回合 token']])}
      ${bTab === 'parts' ? partsView() : tokenView()}`;
  }
  if (!s.rd) {
    return `<div class="detail-h">${kdot('prog')}<h4>${esc(s.label)}</h4><span class="muted small">${sec(s.ms)}・程式自己做，不叫模型</span></div>
      <div class="tblwrap"><table><thead><tr><th>步驟</th><th class="r">耗時</th></tr></thead><tbody>${s.laps.map((l) => `<tr><td>${esc(l.name)}</td><td class="r">${n(l.ms)} 毫秒</td></tr>`).join('')}</tbody></table></div>
      ${s.key === 'prep' ? `<p class="small">${esc(R.preStep)}</p>` : '<p class="small muted">整理卡片、算局勢報告、存檔。之後用戶就看到回覆。</p>'}`;
  }
  if (!s.c) {
    const rd = s.rd;
    bTab = bTab && ['think', 'said', 'sent'].includes(bTab) ? bTab : 'think';
    const body = bTab === 'think' ? thinkView(rd, true) : bTab === 'said' ? saidView(rd) + `<p class="small muted">這回合呼叫了 ${rd.calls.length} 個工具：${rd.calls.map((c) => KIND[c.name].label).join('、')}</p>` : `<p class="small">${sentLine(rd)}</p><p class="small muted">讀入 ${n(rd.inTok)} token・寫出 ${n(rd.outTok)} token・耗時 ${sec(rd.ms)}</p>${tokenView()}`;
    return `<div class="detail-h">${kdot('model')}<h4>第 ${rd.n} 回合・模型</h4><span class="muted small num">${sec(rd.ms)}・讀入 ${n(rd.inTok)}・寫出 ${n(rd.outTok)}</span></div>
      ${tabsOf([['think', '思考'], ['said', '說的話'], ['sent', '送出內容']])}${body}`;
  }
  const c = s.c;
  bTab = bTab && ['view', 'args', 'res'].includes(bTab) ? bTab : 'view';
  const body = bTab === 'view' ? toolBody(c, { rows: 20 }) : `<pre class="sql" style="background:var(--sunk);color:var(--ink)">${esc(JSON.stringify(bTab === 'args' ? c.args : c.result, null, 2))}</pre>`;
  return `<div class="detail-h">${kdot(c.name)}<h4>${esc(KIND[c.name].label)}</h4><span class="mono muted">${esc(c.name)}</span>${statusPill(c.status)}<span class="muted small num">第 ${s.rd.n} 回合・${sec(c.ms)}</span></div>
    <p class="small">${esc(c.summary)}</p>
    ${tabsOf([['view', '看懂版'], ['args', `參數原文（${n(jlen(c.args))} 字）`], ['res', `結果原文（${n(jlen(c.result))} 字）`]])}${body}`;
}
function planB() {
  const nodes = bNodes();
  if (!bSel) bSel = STEPS.find((s) => s.c && s.c.status !== 'ok')?.key ?? 'ctx';
  const prop = `<div class="propbar" data-tip="${esc(`<b>${sec(R.ms)}</b>　整輪<br>模型 ${sec(MODEL_MS)}（${pct(MODEL_MS, R.ms)}）<br>工具 ${sec(TOOL_MS)}（${pct(TOOL_MS, R.ms)}）<br>程式 ${sec(PROG_MS)}（${pct(PROG_MS, R.ms)}）`)}"><i style="flex:${MODEL_MS};background:var(--c-model)"></i><i style="flex:${Math.max(TOOL_MS, 60)};background:var(--c-sql)"></i><i style="flex:${Math.max(PROG_MS, 60)};background:var(--c-prog)"></i></div>`;
  return `<div class="plan-head"><h2>B　左右檢視器</h2><p>左邊是步驟清單，每一步下面有一條小時間條；右邊只顯示選中的那一步，用分頁切換「看懂版／參數原文／結果原文」。打開時自動選第一個出錯的步驟。LangSmith、Langfuse 這類專門追蹤 AI 代理的工具多半長這樣，資訊最密。缺點是要比較寬的畫面：放在後台右欄會太擠，正式版會開成整頁寬的檢視器。</p></div>
  ${frame(`
    <div class="sec-title">代理執行過程 ${item(2)}<span class="muted">用 <span class="kbd">↑</span> <span class="kbd">↓</span> 換步驟</span></div>
    ${summaryBar()}
    <div class="legend"><span><i class="sw" style="background:var(--c-model)"></i>模型 ${pct(MODEL_MS, R.ms)}</span><span><i class="sw" style="background:var(--c-sql)"></i>工具 ${pct(TOOL_MS, R.ms)}</span><span><i class="sw" style="background:var(--c-prog)"></i>程式 ${pct(PROG_MS, R.ms)}</span><span class="faint">（工具和程式太短，畫成最小寬度）</span></div>
    ${prop}
    <div class="note"><b>設計稿註記：</b>打開就自動選中「第 1 回合 › 唯讀 SQL ✕」。點左邊任何一步，右邊換內容。</div>
    <div class="insp"><div class="tree" role="listbox" aria-label="執行步驟" tabindex="0">${bTree(nodes)}</div><div class="detail">${bDetail(nodes)}</div></div>
  `)}`;
}

/* ================= C 對話劇本（第 2 版：不擠在一個畫面，照順序往下讀） ================= */
const LANE_X = [17, 51, 85, 119];
const laneOf = (k) => (k === 'user' ? 0 : k === 'prog' ? 1 : k === 'model' ? 2 : 3);
const ACTOR = { user: { label: '用戶', color: 'var(--ink)' }, prog: { label: '程式', color: '#7d8796' }, model: { label: '模型', color: 'var(--c-model)' } };
const actorOf = (k) => ACTOR[k] ?? { label: KIND[k]?.label ?? k, color: KIND[k]?.color ?? 'var(--c-prog)' };
const who = (k) => `<span class="who" style="--k:${actorOf(k).color}">${esc(actorOf(k).label)}</span>`;
// 用戶最後看到的卡片（messages 表的真實資料）
const FINAL = { reqs: [['需要獨立顯卡', true], ['主要玩 3A 大作', false]], count: { from: 127, to: 127, edge: 35 }, recommend: ['SHDX0248', '260129A', 'SHDX0360'], compare: ['SHDX0248', '260129A'] };

function spineOf(e) {
  let h = '';
  if (e.busy) h += `<i class="busy" style="left:${LANE_X[laneOf(e.busy)] - 4}px;--k:${actorOf(e.busy).color}"></i>`;
  if (e.from && e.to) {
    const a = LANE_X[laneOf(e.from)], b = LANE_X[laneOf(e.to)];
    h += `<i class="msg ${b < a ? 'back' : ''}" style="left:${Math.min(a, b)}px;width:${Math.abs(a - b)}px;--k:${actorOf(e.from).color}"></i><i class="dot" style="left:${a - 5}px;--k:${actorOf(e.from).color}"></i>`;
  }

const blk = (label, html) => `<div class="blk"><span class="lbl">${label}</span>${html}</div>`;

/* 每回合在整輪裡的位置 */
function roundSpans() {
  const ms = STEPS.filter((s) => s.kind === 'model').map((s) => s.start);
  const post = STEPS[STEPS.length - 1];
  return R.rounds.map((rd, i) => ({ n: rd.n, start: ms[i], end: i + 1 < ms.length ? ms[i + 1] : post.start }));
}
function dividerRow(rd, spans, chip) {
  const sp = spans.find((x) => x.n === rd.n);
  const prep = STEPS[0].ms, post = STEPS[STEPS.length - 1].ms;
  const bar = `<i style="flex:${Math.max(prep, 1)}"></i>${spans.map((x) => `<i class="${x.n === rd.n ? 'cur' : ''}" style="flex:${x.end - x.start}"></i>`).join('')}<i style="flex:${Math.max(post, 1)}"></i>`;
  const tools = rd.calls.map((c) => `${KIND[c.name].label}${c.status === 'ok' ? ' ✓' : ' ✕'}`).join('、');

function bodyCall(c) {
  if (c.name === 'sql_query') {
    const bad = /column "([^"]+)" does not exist/.exec(c.result?.error ?? '')?.[1];
    const cols = (/SELECT\s+(.*?)\s+FROM/s.exec(c.args.sql)?.[1] ?? '').split(',').map((s) => s.trim()).filter(Boolean);
    return [
      blk('SQL', `<pre class="sql">${fmtSql(c.args.sql, bad)}</pre>`),
      blk(`要查的欄位（${cols.length} 個）`, `<div class="colchips">${cols.map((k) => `<span>${esc(COL[k] ?? k)}<span class="mono">${esc(k)}</span></span>`).join('')}</div>`),

    ].join('');
  }
  if (c.name === 'update_profile') {
    const a = c.args;
    const ops = (a.ops ?? []).map((o) => `<div>${o.op === 'upsert' ? '新增' : esc(o.op)}「${esc(o.req?.label)}」<span class="${o.req?.hard ? 'hard' : 'soft'}">${o.req?.hard ? '硬條件' : '偏好'}</span><span class="small muted">　信心 ${o.req?.confidence}・根據用戶說的「${esc(o.req?.evidence)}」</span></div>`).join('');

  }

}
function bodyResult(c) {
  const res = c.result ?? {};

      const bad = /column "([^"]+)" does not exist/.exec(res.error ?? '')?.[1];
      return `<div class="dberr"><b>資料庫回報</b><span>${esc(res.error)}${bad ? `<br>白話：資料庫沒有「${esc(bad)}」這個欄位，整句 SQL 沒有執行。` : ''}</span></div><p class="small muted">這個錯誤原樣交回給模型，模型在下一回合自己改 SQL 重查。</p>${rawOne('交給模型的結果原文', res)}`;

function planC() {
  const ev = [];
  const prep = STEPS[0], post = STEPS[STEPS.length - 1];
  ev.push({ id: 'c-user', chip: 'c-user', card: 'user', from: 'user', to: 'prog', verb: '按了追問卡', at: 0, body: bodyUser() });
  ev.push({ id: 'c-prep', chip: 'c-prep', card: 'prog', busy: 'prog', from: 'prog', to: 'model', verb: '準備好，交給模型', at: 0, ms: prep.ms, body: bodyPrep() });
  const spans = roundSpans();
  for (const rd of R.rounds) {
    const st = STEPS.find((s) => s.key === `m${rd.n}`);
    ev.push({ divider: rd, chip: `c-m${rd.n}` });
    ev.push({ id: `c-m${rd.n}`, chip: `c-m${rd.n}`, card: 'model', busy: 'model', verb: `思考（第 ${rd.n} 回合）`, at: st.start, ms: rd.ms, body: bodyModel(rd) });
    rd.calls.forEach((c, j) => {
      const s = STEPS.find((x) => x.key === `c${rd.n}-${j}`);
      const chip = `c-r${rd.n}-${j}`;
      if (c.name === 'reply') {
        ev.push({ id: chip, chip, card: 'model', from: 'model', to: 'prog', verb: '交出回覆', at: s.start, body: bodyCall(c) });
        return;
      }
      ev.push({ id: `c-c${rd.n}-${j}`, chip, card: 'call', from: 'model', to: c.name, verb: `呼叫${j > 0 ? '（同一回合第 2 個）' : ''}`, at: s.start, body: bodyCall(c) });
      ev.push({ id: chip, chip, card: 'result', busy: c.name, from: c.name, to: 'model', verb: '回傳結果', status: c.status, err: c.status !== 'ok', at: s.start, ms: c.ms, body: bodyResult(c) });
    });
  }
  ev.push({ id: 'c-post', chip: 'c-post', card: 'prog', busy: 'prog', verb: '收尾', at: post.start, ms: post.ms, body: bodyFinish() });
  ev.push({ id: 'c-deliver', chip: 'c-post', card: 'prog', from: 'prog', to: 'user', verb: '用戶看到的回覆', at: TOTAL, body: bodyDeliver() });

  const chips = [`<span class="st" data-goto-c="c-user">${kdot('prog')}用戶按卡</span>`, `<span class="ar">→</span><span class="st" data-goto-c="c-prep">${kdot('prog')}程式準備</span>`];
  for (const rd of R.rounds) {
    chips.push(`<span class="ar">→</span><span class="st" data-goto-c="c-m${rd.n}">${kdot('model')}想 ${sec(rd.ms)}</span>`);
    rd.calls.forEach((c, j) => chips.push(`<span class="ar">→</span><span class="st ${c.status !== 'ok' ? 'err' : ''}" data-goto-c="c-r${rd.n}-${j}">${kdot(c.name)}${c.name === 'sql_query' ? (c.status === 'ok' ? `SQL ${c.result.rows.length} 列` : 'SQL 失敗') : c.name === 'update_profile' ? '改權重' : '交出回覆'}</span>`));
  }
  chips.push(`<span class="ar">→</span><span class="st" data-goto-c="c-post">${kdot('prog')}用戶看到回覆</span>`);

  const rows = ev.map((e) => (e.divider ? dividerRow(e.divider, spans, e.chip) : sqRow(e))).join('');

  return `<div class="plan-head"><h2>C　對話劇本（第 2 版）</h2><p>不再把東西擠在一個畫面。每一步一張完整的卡片，照發生順序往下排，內容全部展開：模型完整的思考、整張 SQL 結果表、權重前後、名次變化，最後是用戶實際看到的回覆。頁面會很長，這是故意的。往下捲時，上方的劇情列會固定在畫面頂端，標出你讀到哪一步，點一下就能跳過去。</p></div>
  ${frame(`
    <div class="sec-title">代理執行過程 ${item(2)}</div>
    ${summaryBar()}
    <div class="sq-legend"><span class="lg"><b style="color:var(--ink)">讀法</b></span><span class="lg">左邊四條直線是四個角色</span><span class="lg"><i class="lg-msg"></i>誰把東西交給誰</span><span class="lg"><i class="lg-busy"></i>誰正在忙（越長越久）</span><span class="lg">每次工具呼叫拆成兩張卡：給了什麼參數、回了什麼結果</span></div>
    <div class="note"><b>設計稿註記：</b>第 1 版三條泳道各佔 1/3 寬，SQL 和表格被擠進小框，還要再點開。第 2 版卡片用滿整寬、全部展開。原始 JSON 仍然收在每張卡最下面。</div>
    <div class="sq-head"><span class="tcap">時間</span><div class="sq-lanes" aria-hidden="true">${lanes}</div><div class="sq-story" role="navigation" aria-label="劇情列">${chips.join('')}</div></div>
    <div class="sq">${rows}</div>
    <div class="endsum">
      <div class="sec-title">整輪結算</div>
      <div class="legend"><span><i class="sw" style="background:var(--c-model)"></i>等模型 ${sec(MODEL_MS)}（${pct(MODEL_MS, R.ms)}）</span><span><i class="sw" style="background:var(--c-sql)"></i>工具 ${sec(TOOL_MS)}</span><span><i class="sw" style="background:var(--c-prog)"></i>程式 ${sec(PROG_MS)}</span></div>
      <div class="propbar"><i style="flex:${MODEL_MS};background:var(--c-model)"></i><i style="flex:${Math.max(TOOL_MS, 60)};background:var(--c-sql)"></i><i style="flex:${Math.max(PROG_MS, 60)};background:var(--c-prog)"></i></div>
      <div class="sec-title">每回合讀入多少 token ${item(5)}</div>
      ${tokenView()}
    </div>
  `)}`;
}

let spyRaf = 0;

  const line = head.getBoundingClientRect().bottom + 16;

  const sqlBad = errs.filter((c) => c.name === 'sql_query');

  const link = (t, txt) => `<a href="#" data-turn="${t.id}">${esc(txt ?? t.input.slice(0, 16))}・${sec(t.ms)}</a>`;
  const issues = `
    <div class="issue bad"><span class="cnt">${sqlBad.length}</span><h4>SQL 欄位名稱寫錯</h4><p>${sqlBad.map((c) => `<span class="mono">${esc(/column "([^"]+)"/.exec(c.summary)?.[1])}</span>`).join('、')} 都不存在（資料庫還提示 ram_gb 可能是 vram_gb）。說明書的欄位清單有 16,600 字，模型還是會猜欄位名。<b>可以改：</b>常用欄位放最前面、加「欄位名稱只能用清單裡的」。</p><div class="links">${sqlBad.map((c) => link(c.turn)).join('')}</div></div>
    <div class="issue warn"><span class="cnt">${slow.length}</span><h4>只有 2 回合卻特別慢</h4><p>${slow.map((t) => `${sec(t.ms)}（寫出 ${n(t.outTok)} token）`).join('、')}。其他輪通常寫出 700～1,000 token，這兩輪可能想了很久。記錄思考內容以後就能確認。</p><div class="links">${slow.map((t) => link(t)).join('')}</div></div>
    <div class="issue warn"><span class="cnt">${prof.length}</span><h4>改需求被拒絕</h4><p>${prof.map((c) => esc(c.summary)).join('、')}。要看被拒絕的是哪兩條、理由是什麼。</p><div class="links">${prof.map((c) => link(c.turn)).join('')}</div></div>
    <div class="issue bad"><span class="cnt">${modelErr.length}</span><h4>模型連線失敗</h4><p>${modelErr.map((t) => esc(t.roundErr[0].replace(/\s*\(attempted.*$/, ''))).join('')}（等了 10 秒連不上 api.deepseek.com）。用戶收到固定文案。</p><div class="links">${modelErr.map((t) => link(t, `用戶打「${t.input}」`)).join('')}</div></div>
    <div class="issue"><span class="cnt">0</span><h4>「自訂排序」一次都沒用過</h4><p>32 次工具呼叫裡沒有 sort_pool。可能是說明書沒講清楚什麼時候該用，或是用戶還沒問過「最輕的幾台」這類問題。</p></div>`;
  return `<div class="plan-head"><h2>代理分析頁（第 6 項）</h2><p>後台新的一頁，把所有代理方案的輪次放在一起看：時間花在哪、哪個工具常出錯、哪些輪次特別慢。每一筆都能點進去看那一輪的執行過程。下面是目前開發資料庫裡全部 12 輪代理紀錄的<b>真實統計</b>（10 輪打字、2 輪按鈕操作）。</p></div>
  ${frame(`
    <div class="filters">
      <label for="f-date">日期<select id="f-date"><option>最近 30 天</option><option>最近 7 天</option><option>全部</option></select></label>
      <label for="f-prompt">說明書版本<select id="f-prompt"><option>全部版本</option><option>說明書 v2（目前啟用）</option></select></label>
      <label for="f-model">模型<select id="f-model"><option>全部</option><option>deepseek-flash</option></select></label>
      <label class="check" for="f-issue"><input type="checkbox" id="f-issue" ${onlyIssues ? 'checked' : ''}> 只看有問題的輪次</label>
    </div>
    <div class="note"><b>設計稿註記：</b>「說明書版本」要靠 v1.0.49 起每輪記下用了哪一版說明書。這樣改完提示詞，可以直接比較改之前和改之後。</div>
    <div class="kpis">
      <div class="kpi"><span>打字的輪次</span><b>${T.length}</b><em>另有 ${S.silent} 輪按鈕操作（不叫模型）</em></div>
      <div class="kpi"><span>每輪平均</span><b>${(total / T.length / 1000).toFixed(1)} <small>秒</small></b><em>中位數 ${(median / 1000).toFixed(1)} 秒・最慢 ${(slowest / 1000).toFixed(1)} 秒</em></div>
      <div class="kpi"><span>等模型的時間</span><b>${((model / total) * 100).toFixed(1)}%</b><em>工具合計只佔 ${pct(tool, total)}</em></div>
      <div class="kpi"><span>平均回合</span><b>${(T.reduce((a, t) => a + t.rounds, 0) / T.length).toFixed(1)}</b><em>工具共 ${calls.length} 次</em></div>
      <div class="kpi"><span>工具出錯</span><b>${errs.length} <small>／ ${calls.length}</small></b><em>模型連線失敗 ${modelErr.length} 輪</em></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="sec-title">時間花在哪 <span class="muted">每輪一條，滑過看細節</span></div>
        <div class="legend"><span><i class="sw" style="background:var(--c-model)"></i>等模型</span><span><i class="sw t"></i>工具</span><span><i class="sw" style="background:var(--c-prog)"></i>程式</span></div>
        ${axis}${timeRows}
      </div>
      <div class="panel"><div class="sec-title">需要注意的地方 <span class="muted">程式自動整理，點連結看那一輪</span></div><div class="issues">${issues}</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="sec-title">工具使用</div>
        <div class="tblwrap"><table><thead><tr><th>工具</th><th class="r">次數</th><th class="r">成功</th><th class="r">成功率</th></tr></thead><tbody>${tools.map((x) => `<tr><td><span class="ktag" style="font-weight:500">${kdot(x.name)}${KIND[x.name].label}</span> <span class="mono faint">${x.name}</span></td><td class="r">${x.n}</td><td class="r">${x.ok}</td><td class="r">${x.n ? pct(x.ok, x.n) : '<span class="faint">沒用過</span>'}</td></tr>`).join('')}</tbody></table></div>
      </div>
      <div class="panel"><div class="sec-title">結束原因</div>
        <div class="tblwrap"><table><thead><tr><th>原因</th><th class="r">輪數</th><th>白話</th></tr></thead><tbody>
          <tr><td><span class="pill ok">交出回覆</span></td><td class="r">${T.filter((t) => t.stop === 'reply_tool').length}</td><td>模型用 reply 工具正常結束</td></tr>
          <tr><td><span class="pill bad">模型呼叫失敗</span></td><td class="r">${T.filter((t) => t.stop === 'error').length}</td><td>連不上模型，給固定文案</td></tr>
          <tr><td><span class="pill warn">回合數到上限</span></td><td class="r">0</td><td>上限 30 回合</td></tr>
          <tr><td><span class="pill warn">直接回文字</span></td><td class="r">0</td><td>沒用 reply 工具</td></tr>
        </tbody></table></div>
      </div>
    </div>
    <div class="panel"><div class="sec-title">全部輪次 <span class="muted">點一列打開那一輪</span></div>
      <div class="tblwrap"><table><thead><tr><th>時間</th><th>用戶說</th><th class="r">回合</th><th class="r">工具</th><th class="r">整輪</th><th class="r">讀入 token</th><th class="r">寫出</th><th>結束</th></tr></thead><tbody>${tableRows}</tbody></table></div>
    </div>
  `, { noFold: true, stats: true })}`;
}

/* ================= 三案比較 ================= */
function comparePage() {
  return `<div class="box">
    <h2>三案比較</h2>
    <div class="tblwrap"><table class="cmp"><thead><tr><th></th><th>A 時間軸瀑布</th><th>B 左右檢視器</th><th class="rec">C 對話劇本（第 2 版）</th></tr></thead><tbody>
      <tr><td>一句話</td><td>上面一張時間圖，下面照順序讀</td><td>左邊選一步，右邊看那一步</td><td class="rec">用戶、程式、模型、工具四個角色的對話，照順序往下讀</td></tr>
      <tr><td>最擅長</td><td>找「慢在哪、錯在哪」</td><td>一步一步對照參數和結果</td><td class="rec">看懂模型為什麼這樣做、每一步交了什麼給誰</td></tr>
      <tr><td>時間怎麼看</td><td>瀑布圖，最準</td><td>每步一條小時間條</td><td class="rec">每張卡標開始秒數和花多久；每回合有「在整輪裡的位置」條；最後有整輪結算</td></tr>
      <tr><td>放在哪</td><td>每輪說明最上面，右欄放得下</td><td>右欄太擠，要開成整頁寬</td><td class="rec">右欄放得下（卡片用滿整寬），手機寬度時順序圖收起</td></tr>
      <tr><td>缺點</td><td>回合多時頁面很長</td><td>一次只看一步，不好看全貌</td><td class="rec">頁面很長；靠固定在上方的劇情列跳轉</td></tr>
      <tr><td>做起來</td><td>中</td><td>中偏大（多一個整頁檢視器）</td><td class="rec">中</td></tr>
    </tbody></table></div>
    <p class="small muted">「工具看懂版」（SQL 表格、權重前後、名次變化、回覆預覽）、「模型思考」、「說明書組成」、「每回合 token」這些內容三案共用，只是擺的位置不同。也可以混搭，例如 A 的瀑布圖加上 C 的劇情列。</p>
  </div>
  <div class="box">
    <h2>v1.0.49 會開始多記錄的資料</h2>
    <ul class="list">
      <li><b>模型的思考內容</b>：每回合都記，最多 2 萬字，超過的截斷（開關預設開）。</li>
      <li><b>思考用掉的 token</b>，以及<b>快取命中的 token</b>：供應商有回才記，DeepSeek 都會回。可以看出重送的說明書有沒有被快取。</li>
      <li><b>每一步的開始時間</b>：瀑布圖才畫得準。現在只有每步各花多久。</li>
      <li><b>改需求之前的狀態</b>：權重、性能細項、候選台數、前 5 名，才畫得出「從多少改成多少」。</li>
      <li><b>這輪用的說明書版本和各段字數</b>：分析頁可以比較改提示詞前後的差別。</li>
    </ul>
    <p class="small muted">已經存好的 12 輪舊紀錄也能用新畫面看。缺的部分會顯示「舊紀錄沒有這項」，時間軸改用每步花的時間依序推算。</p>
  </div>
  <div class="box">
    <h2>新開關（全部預設開）</h2>
    <div class="tblwrap"><table class="flags"><thead><tr><th>開關</th><th>控制什麼</th></tr></thead><tbody>
      <tr><td>admin.agent_first</td><td>代理方案的輪次把執行過程放最上面，其他區塊收到下面（第 1 項）</td></tr>
      <tr><td>admin.agent_timeline</td><td>時間軸（第 2 項）</td></tr>
      <tr><td>admin.agent_view_sql</td><td>SQL 排版與結果表格（第 3 項）</td></tr>
      <tr><td>admin.agent_view_profile</td><td>改需求：權重前後長條、候選台數（第 3 項）</td></tr>
      <tr><td>admin.agent_view_rank</td><td>改需求：前 5 名名次變化（第 3 項）</td></tr>
      <tr><td>admin.agent_view_reply</td><td>交出回覆：回覆文字與卡片預覽（第 3 項）</td></tr>
      <tr><td>agent.trace_thinking</td><td>記錄模型的思考內容（第 4 項；門檻：每回合最多 2 萬字）</td></tr>
      <tr><td>admin.agent_thinking</td><td>後台顯示模型的思考內容（第 4 項）</td></tr>
      <tr><td>admin.agent_context</td><td>說明書組成與每回合送出的內容（第 5 項）</td></tr>
      <tr><td>admin.agent_tokens</td><td>每回合 token 圖（第 5 項）</td></tr>
      <tr><td>admin.agent_stats</td><td>代理分析頁（第 6 項）</td></tr>
    </tbody></table></div>
    <p class="small muted">開關名稱是暫定的，寫規格時會照專案的命名規則定案。原本的「代理追蹤」區塊保留，關掉新開關就回到現在的樣子。</p>
  </div>
  <div class="box">
    <h2>請你決定</h2>
    <ol class="ask">
      <li>C 第 2 版這樣可以嗎？還有哪裡要調？</li>
      <li>要不要三案都做，在後台用一個設定切換，方便你找用戶比較？這樣工作量大約多一半。</li>
      <li>分析頁的「需要注意的地方」裡有改提示詞的建議，要用固定規則寫，還是之後再交給模型自動整理？</li>
    </ol>
  </div>`;
}

/* ---------- 切換與互動 ---------- */
const view = document.getElementById('view');
let plan = 'c';
function render() {
  UID = 0;
  view.innerHTML = plan === 'a' ? planA() : plan === 'b' ? planB() : plan === 'c' ? planC() : plan === 's' ? statsPage() : comparePage();
  if (plan === 'c') requestAnimationFrame(spy);
}
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
  plan = b.dataset.plan;
  document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
  render();
}));
document.getElementById('opt-notes').addEventListener('change', (e) => document.body.classList.toggle('show-notes', e.target.checked));
document.getElementById('opt-narrow').addEventListener('change', () => render());

function flash(el) {
  if (!el) return;
  el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
view.addEventListener('click', (e) => {
  const t = e.target.closest('[data-goto],[data-node],[data-dtab],[data-showmore],[data-goto-c],[data-turn],tr.clickable');
  if (!t) return;
  if (t.dataset.goto) {
    const k = t.dataset.goto;
    const id = k.startsWith('m') ? `a-${k}` : k.startsWith('c') ? `a-${k}` : null;
    if (id) flash(document.getElementById(id));
    return;
  }
  if (t.dataset.node) { bSel = t.dataset.node; bTab = null; render(); document.querySelector(`[data-node="${bSel}"]`)?.focus(); return; }
  if (t.dataset.dtab) { bTab = t.dataset.dtab; render(); return; }
  if (t.dataset.showmore) { view.querySelectorAll(`[data-more="${t.dataset.showmore}"]`).forEach((r) => { r.hidden = false; }); t.remove(); return; }
  if (t.dataset.gotoC) { flash(document.getElementById(t.dataset.gotoC)); return; }
  if (t.dataset.turn || t.matches('tr.clickable')) {
    e.preventDefault();
    const b = document.getElementById('tab-a'); b.click();
    window.scrollTo({ top: 0 });
  }
});
view.addEventListener('change', (e) => {
  if (e.target.id === 'f-issue') { onlyIssues = e.target.checked; render(); }
});
view.addEventListener('keydown', (e) => {
  if (plan !== 'b' || !['ArrowDown', 'ArrowUp'].includes(e.key) || !e.target.closest('.tree')) return;
  e.preventDefault();
  const keys = bNodes().map((x) => x.key);
  const i = keys.indexOf(bSel);
  bSel = keys[Math.max(0, Math.min(keys.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
  bTab = null; render();
  document.querySelector(`[data-node="${bSel}"]`)?.focus();
});
view.addEventListener('mouseover', (e) => {
  const row = e.target.closest('[data-goto]');
  document.querySelectorAll('.wf-row.hl').forEach((r) => r.classList.remove('hl'));
  if (row) row.closest('.wf-row')?.classList.add('hl');
});

/* 浮動說明（滑鼠與鍵盤都有） */
const tip = document.getElementById('tip');
function showTip(el, x, y) {
  tip.innerHTML = el.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${Math.min(window.innerWidth - w - 8, Math.max(8, x + 12))}px`;
  tip.style.top = `${y + h + 20 > window.innerHeight ? y - h - 12 : y + 16}px`;
}
document.addEventListener('pointermove', (e) => {
  const el = e.target.closest?.('[data-tip]');
  if (!el) { tip.hidden = true; return; }
  showTip(el, e.clientX, e.clientY);
});
document.addEventListener('focusin', (e) => {
  const el = e.target.closest?.('[data-tip]');
  if (!el) { tip.hidden = true; return; }
  const r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom - 8);
});
document.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

render();
})();
</script>
</body>
</html>
