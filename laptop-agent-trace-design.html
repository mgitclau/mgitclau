<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>代理執行過程設計稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 版面：沿用後台的淺色系（深藍側欄色、白卡、藍色重點），設計稿放在模擬的後台框裡；上方分頁切換 A／B／C／分析頁。後台本身只有淺色，所以這頁刻意只做淺色。 */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --sunk: #f7f8fa; --line: #dfe2e7; --line-2: #eceff3;
  --ink: #1d2433; --muted: #5f6b7a; --faint: #8a94a3; --navy: #1d2433; --navy-2: #2c3548;
  --accent: #1f5fbf; --accent-soft: #e8f0fb;
  --ok: #17703f; --ok-soft: #e3f4ea; --warn: #8a5a00; --warn-soft: #fdf2d8; --bad: #b3261e; --bad-soft: #fbe9e7;
  --c-model: #2a78d6; --c-sql: #eb6834; --c-profile: #1baf7a; --c-sort: #eda100; --c-reply: #e87ba4; --c-prog: #a3acb9;
  --c-ctx: #5f6b7a; --c-acc: #9cc2ef;
  --note: #6d3fc0; --note-soft: #f1ebfb;
  --f-body: "Inter", -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 8px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--f-body); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.3; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }

/* 開頭 */
.intro { display: grid; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.intro h1 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.lead { max-width: 68ch; color: #3a4456; font-size: 15px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; color: var(--muted); }
.fact b { color: var(--ink); font-weight: 600; }

/* 分頁 */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 0; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-top: 8px; }
.tab { border: 1px solid transparent; border-bottom: none; background: none; padding: 9px 14px 10px; border-radius: 8px 8px 0 0; cursor: pointer; color: var(--muted); font-weight: 500; display: grid; gap: 1px; text-align: left; }
.tab small { font-size: 11.5px; font-weight: 400; color: var(--faint); }
.tab:hover { color: var(--ink); background: #eaedf1; }
.tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); margin-bottom: -1px; }
.tab[aria-selected="true"] b { color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13px; color: var(--muted); }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.plan-head { display: grid; gap: 6px; }
.plan-head h2 { font-size: 20px; }
.plan-head p { max-width: 75ch; color: #3a4456; }

/* 模擬後台框 */
.frame { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: clip; box-shadow: 0 1px 2px rgba(29,36,51,.06), 0 8px 24px rgba(29,36,51,.06); margin-inline: auto; width: 100%; transition: max-width .25s ease; }
.frame.narrow { max-width: 680px; }
.frame-bar { background: var(--navy); color: #c9d0db; padding: 8px 14px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.frame-bar b { color: #fff; font-weight: 600; }
.frame-bar .sep { color: #6c7790; }
.frame-body { padding: 16px; display: grid; gap: 14px; }
.run-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.run-head h3 { font-size: 16px; }
.quote { background: var(--sunk); border-radius: 6px; padding: 8px 12px; }
.pre-step { font-size: 12.5px; color: var(--muted); }
.folded { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; }
.folded-list { display: flex; flex-wrap: wrap; gap: 6px; }
.folded-list span { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--sunk); }
.folded-list span::before { content: "▸ "; color: var(--faint); }

/* 標籤 */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 20px; background: #eceff3; color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok::before { content: "✓"; }
.pill.bad::before { content: "✕"; }
.kdot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; background: var(--k, var(--c-prog)); }
.ktag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.demo { font-size: 11px; font-weight: 600; color: var(--note); background: var(--note-soft); border-radius: 4px; padding: 0 6px; line-height: 18px; }

/* 設計稿註記 */
.note { display: none; border-left: 3px solid var(--note); background: var(--note-soft); color: #3d2a66; border-radius: 0 6px 6px 0; padding: 7px 10px; font-size: 12.5px; }
.note b { color: var(--note); }
.show-notes .note { display: block; }
.item { display: none; font-size: 11px; font-weight: 700; color: var(--note); border: 1px solid #cdbbef; border-radius: 4px; padding: 0 5px; line-height: 17px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.show-notes .item { display: inline-block; }

/* 摘要列 */
.sumbar { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; padding: 10px 14px; background: var(--sunk); border: 1px solid var(--line-2); border-radius: var(--r); }
.sumbar .stat { display: grid; gap: 0; }
.sumbar .stat span { font-size: 11.5px; color: var(--muted); }
.sumbar .stat b { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.sumbar .stat b small { font-size: 12px; font-weight: 500; color: var(--muted); }

/* 區塊標題 */
.sec-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 650; }
.sec-title .muted { font-weight: 400; font-size: 12.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* 瀑布圖 */
.wf { display: grid; gap: 2px; }
.wf-row { display: grid; grid-template-columns: 168px minmax(0, 1fr); align-items: center; min-height: 26px; border-radius: 4px; }
.wf-row.child .wf-lab { padding-left: 18px; }
.wf-row.child .wf-lab::before { content: "└"; color: var(--faint); margin-right: 4px; }
.wf-row:hover, .wf-row.hl { background: var(--accent-soft); }
.wf-lab { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; display: flex; align-items: center; gap: 6px; }
.wf-track { position: relative; height: 26px; background-image: linear-gradient(to right, var(--line-2) 1px, transparent 1px); background-size: var(--tick) 100%; }
.wf-bar { position: absolute; top: 6px; height: 14px; border: 0; padding: 0; border-radius: 3px; background: var(--k); cursor: pointer; min-width: 3px; }
.wf-bar.err { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--bad); }
.wf-bar:hover, .wf-bar:focus-visible { filter: brightness(1.08); outline: 2px solid var(--ink); outline-offset: 1px; }
.wf-val { position: absolute; top: 4px; font-size: 11.5px; color: var(--muted); white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.wf-axis .wf-track { height: 18px; background: none; }
.wf-tick { position: absolute; top: 0; font-size: 11px; color: var(--faint); transform: translateX(-50%); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wf-tick:last-child { transform: translateX(-100%); }
.wf-tick:first-child { transform: none; }

/* 步驟卡 */
.round { display: grid; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); scroll-margin-top: 90px; }
.round.flash { animation: flash 1.2s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.round-h { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.round-h h4 { font-size: 14.5px; }
.round-h .meta { font-size: 12.5px; color: var(--muted); }
.calls { display: grid; gap: 10px; border-left: 2px solid var(--line-2); margin-left: 4px; padding-left: 14px; }
.call { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; scroll-margin-top: 90px; }
.call.flash { animation: flash 1.2s ease; }
.call-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 8px 12px; background: var(--sunk); border-bottom: 1px solid var(--line-2); }
.call-h .mono { color: var(--muted); }
.call-h .sum { color: #3a4456; font-size: 13px; flex: 1 1 260px; }
.call-b { padding: 10px 12px; display: grid; gap: 10px; min-width: 0; }
.think { border: 1px solid #d5e4f7; background: #f5f9fe; border-radius: 6px; }
.think summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.think summary .lbl { font-weight: 600; color: #1b4f8f; }
.think[open] summary .prev { display: none; }
.think .body { padding: 0 10px 10px; display: grid; gap: 6px; }
.think .body p { max-width: 72ch; }
.said { margin: 0; border-left: 3px solid var(--c-model); padding: 4px 10px; color: #2b3445; }
.raw { font-size: 12.5px; }
.raw summary { cursor: pointer; color: var(--muted); }
.raw pre { background: var(--sunk); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; max-height: 280px; overflow: auto; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.5; margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; }
.raws { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.raws .raw { flex: 1 1 260px; min-width: 0; }

/* SQL */
.sql { margin: 0; background: #1d2433; color: #dfe5ee; border-radius: 6px; padding: 10px 12px; font-family: var(--f-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
.sql .kw { color: #8fc1ff; font-weight: 600; }
.sql .str { color: #f3c37a; }
.sql .badcol { background: #8f1f1a; color: #fff; border-radius: 3px; padding: 0 3px; }
.dberr { display: flex; gap: 8px; align-items: flex-start; background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.dberr b { white-space: nowrap; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font-weight: 600; background: var(--sunk); color: #3a4456; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: bottom; }
th .mono { display: block; font-weight: 400; color: var(--faint); font-size: 10.5px; }
td { padding: 5px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td.r, th.r { text-align: right; }
td.name { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
tr.flag td { background: #fff6e0; }
td .flagtxt { color: var(--warn); font-weight: 600; }
.more { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 12.5px; }

/* 改需求 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; background: #e6f6ef; color: #0f5c3c; border-radius: 6px; padding: 2px 8px; }
.chip.cut { background: var(--bad-soft); color: var(--bad); }
.why { font-size: 13px; color: #3a4456; }
.why::before { content: "模型的理由："; color: var(--muted); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px 20px; }
.sub-h { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.wrows { display: grid; gap: 5px; }
.wrow { display: grid; grid-template-columns: 52px minmax(60px, 1fr) 104px; gap: 8px; align-items: center; font-size: 12.5px; }
.wt { position: relative; height: 14px; background: var(--sunk); border-radius: 3px; }
.wt .was { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--c-prog); border-radius: 0 2px 2px 0; }
.wt .now { position: absolute; left: 0; top: 0; height: 8px; background: var(--c-profile); border-radius: 0 3px 3px 0; }
.wv { font-variant-numeric: tabular-nums; white-space: nowrap; }
.up { color: var(--ok); font-style: normal; font-weight: 600; }
.down { color: var(--bad); font-style: normal; font-weight: 600; }
.same { color: var(--faint); font-style: normal; }
.ranks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ranks ol { margin: 0; padding-left: 20px; display: grid; gap: 3px; font-size: 12.5px; }
.ranks li { padding-left: 2px; }
.ranks li.mv { font-weight: 600; }

/* 回覆預覽 */
.bubble { background: #f3f5f8; border: 1px solid var(--line-2); border-radius: 12px 12px 12px 4px; padding: 10px 12px; white-space: pre-line; font-size: 13px; max-height: 260px; overflow: auto; }
.cardrow { display: flex; flex-wrap: wrap; gap: 8px; }
.ucard { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; background: var(--surface); }
.ucard b { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; }

/* 說明書與 token */
.ctxgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px 22px; }
.parts { display: grid; gap: 2px; }
.part summary { display: grid; grid-template-columns: 112px minmax(40px, 1fr) 104px; gap: 8px; align-items: center; font-size: 12.5px; cursor: pointer; padding: 2px 4px; border-radius: 4px; list-style: none; }
.part summary::-webkit-details-marker { display: none; }
.part summary:hover { background: var(--accent-soft); }
.part .pl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.part .pt { height: 10px; background: var(--sunk); border-radius: 2px; position: relative; }
.part .pt i { position: absolute; inset: 0 auto 0 0; background: var(--c-ctx); border-radius: 0 2px 2px 0; }
.part.data .pt i { background: var(--c-acc); }
.part .pv { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.part pre { margin: 4px 0 8px; background: var(--sunk); border-radius: 6px; padding: 8px 10px; font-family: var(--f-mono); font-size: 11.5px; white-space: pre-wrap; max-height: 200px; overflow: auto; }
.tokrows { display: grid; gap: 6px; }
.tokrow { display: grid; grid-template-columns: 64px minmax(80px, 1fr) 66px; gap: 8px; align-items: center; font-size: 12.5px; }
.toktrack { height: 16px; display: flex; gap: 2px; }
.toktrack i { display: block; height: 100%; }
.toktrack i:first-child { border-radius: 3px 0 0 3px; }
.toktrack i:last-child { border-radius: 0 3px 3px 0; }
.tokaxis { display: grid; grid-template-columns: 64px minmax(80px, 1fr) 66px; gap: 8px; font-size: 11px; color: var(--faint); }
.tokaxis div { display: flex; justify-content: space-between; }
.insight { font-size: 13px; background: var(--accent-soft); color: #173f7a; border-radius: 6px; padding: 7px 10px; }

/* B 檢視器 */
.insp { display: grid; grid-template-columns: 300px minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-height: 560px; }
.tree { background: var(--sunk); border-right: 1px solid var(--line); padding: 8px; display: grid; align-content: start; gap: 1px; overflow-y: auto; max-height: 720px; }
.node { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; grid-template-rows: auto 4px; column-gap: 8px; row-gap: 3px; align-items: center; width: 100%; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 13px; }
.node.child { padding-left: 26px; grid-template-columns: 12px minmax(0, 1fr) auto; }
.node:hover { background: #eaedf1; }
.node[aria-selected="true"] { background: var(--surface); border-color: var(--accent); box-shadow: 0 1px 2px rgba(31,95,191,.12); }
.node .nl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .nm { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.node .nb { grid-column: 2 / 4; height: 4px; background: var(--line-2); border-radius: 2px; position: relative; }
.node .nb i { position: absolute; top: 0; height: 4px; background: var(--k); border-radius: 2px; min-width: 2px; }
.node .bad { color: var(--bad); font-weight: 700; }
.tree-sep { font-size: 11px; color: var(--faint); padding: 8px 8px 2px; letter-spacing: .06em; }
.detail { padding: 14px 16px; display: grid; align-content: start; gap: 12px; min-width: 0; }
.detail-h { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.detail-h h4 { font-size: 16px; }
.dtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dtab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; color: var(--muted); font-weight: 500; }
.dtab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.propbar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; gap: 2px; }
.propbar i { display: block; height: 100%; min-width: 2px; }
.kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }

/* C 劇本（第 2 版）：左邊窄順序圖（四條直線＝四個角色），右邊整寬卡片照順序往下排；上方劇情列固定在畫面頂端 */
.sq-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); align-items: center; }
.sq-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.lg-msg { width: 26px; height: 2px; background: var(--muted); position: relative; display: inline-block; }
.lg-msg::after { content: ""; position: absolute; right: -2px; top: -4px; border-style: solid; border-width: 5px 0 5px 7px; border-color: transparent transparent transparent var(--muted); }
.lg-busy { width: 8px; height: 18px; border-radius: 4px; background: var(--c-model); display: inline-block; }
.sq-head { position: sticky; top: var(--tabs-h, 60px); z-index: 4; background: var(--surface); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 72px 136px minmax(0, 1fr); align-items: center; margin-inline: -16px; padding: 6px 16px; }
.sq-head .tcap { font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; padding-right: 10px; }
.sq-lanes { position: relative; height: 22px; }
.sq-lanes span { position: absolute; top: 2px; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.sq-story { position: relative; display: flex; gap: 4px; align-items: center; overflow-x: auto; white-space: nowrap; scrollbar-width: thin; padding: 3px 2px; font-size: 12.5px; }
.sq-story .st { flex: none; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px 1px 6px; background: var(--surface); cursor: pointer; }
.sq-story .st:hover { border-color: var(--accent); }
.sq-story .st.err { border-color: #e7a59f; background: var(--bad-soft); }
.sq-story .st.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: #173f7a; font-weight: 600; }
.sq-story .ar { color: var(--faint); flex: none; }
.sq { display: grid; }
.sq-row { display: grid; grid-template-columns: 72px 136px minmax(0, 1fr); }

const DATA = {"run": {"id": "9320a687-59d0-40a5-b937-a0fee3516f40", "turnNo": 5, "input": "3A 大作", "createdAt": "2026-11-11T10:09:16.776016+09:00", "ms": 14412, "preStep": "用戶在追問卡「遊戲類型」選了「3A 大作」，程式已把需求設成「需要獨立顯卡」", "userMessage": "（用戶在畫面上的操作）用戶在追問卡「遊戲類型」選了「3A 大作」，程式已把需求設成「需要獨立顯卡」", "stop": "reply_tool", "replySource": "reply_tool", "totals": {"ms": 14252, "rounds": 4, "toolCalls": 5, "inputTokens": 96191, "outputTokens": 1428}, "timings": [{"ms": 3, "name": "讀設定"}, {"ms": 37, "name": "讀對話紀錄"}, {"ms": 0, "name": "讀用戶操作"}, {"ms": 27, "name": "前置步驟"}, {"ms": 4588, "name": "代理第 1 回合"}, {"ms": 2413, "name": "代理第 2 回合"}, {"ms": 2266, "name": "代理第 3 回合"}, {"ms": 4957, "name": "代理第 4 回合"}, {"ms": 1, "name": "整理卡片"}, {"ms": 119, "name": "局勢"}, {"ms": 8, "name": "存檔"}], "contextChars": 28817, "parts": [{"name": "開場白", "chars": 68, "kind": "rule", "excerpt": "你是「AI 筆電選購助手」，在台灣幫用戶挑筆電。你的唯一目標：了解用戶真正的需求，推薦最適合他的筆電，讓用戶感受到你了解他、理解他。\n\n"}, {"name": "工作方式", "head": "你怎麼工作", "chars": 116, "kind": "rule", "excerpt": "## 你怎麼工作\n每一輪你會收到用戶說的一句話，或程式替用戶在畫面上的操作寫的說明。你自己判斷用戶想做什麼；需要資料就用工具查，工具可以呼叫很多次，查夠了再回答。\n最後一定要呼叫 reply 工具交出回覆和卡片，這一輪才算結束。\n\n"}, {"name": "選工具的規則", "head": "兩條路：先想清楚再選工具", "chars": 267, "kind": "rule", "excerpt": "## 兩條路：先想清楚再選工具\n1. 篩選、排序類（「1 萬以內」「要 OLED」「最輕的幾台」「續航最久的」「推薦一台給我」）：用 update_profile 設定需求與權重，需要依某個規格排時用 sort_pool，交給推薦引擎算。引擎算出的名單就是用戶畫面上的候選池，你推薦的機型要從這份名單挑。\n2. 查事實、統計類（「這台喇叭幾瓦」「各品牌平均價格」「有幾台有指紋辨識」）：用 sql_query 查資料庫。只是想知道一件事時，不要去改用戶的需求。\n分不清時問自己：用戶是想「縮小或重排候選」，還是只想「知道一件事」？\n\n"}, {"name": "推薦引擎說明", "head": "推薦引擎怎麼算", "chars": 640, "kind": "rule", "excerpt": "## 推薦引擎怎麼算\n- 需求分兩種：硬條件（hard: true）會把不符合的機型排除；偏好（hard: false）不排除。偏好會不會自動改權重，看下方「這段對話目前的狀態」的「權重怎麼變」那行。\n- 什麼時候用硬條件：用戶說「一定要」「不能超過」「X 以內」「只要」「不要」這種明確界線才用硬條件。「希望」「最好」「輕一點」「便宜一點」「盡量」是偏好：用 hard: false 的需求記下來，再調高對應的權重（例如「輕一點」→ 調高 portability），不要直接加硬條件把候選刷掉。硬條件刷掉大量機型前，先想想用戶是不是真的不能接受。\n- 七個權重維度，整數、總和 100：performance 性能、display 螢幕、portability 便攜、battery 續航、thermal 散熱、noise 安靜、expandability 擴充。每台機型在每個維度有分數，產品力分＝各維度分數依權重加權。\n- 性能底下有 5 個細項比例，總和 100：cpu_single 單核、cpu_multi 多核、gpu 顯卡、memory 記憶體、storage 儲存。\n- 權重是這個用戶專屬的：依你對他的了解設定，並在 w"}, {"name": "需求寫法", "head": "需求的寫法（update_profile 的 ops）", "chars": 947, "kind": "rule", "excerpt": "## 需求的寫法（update_profile 的 ops）\n新增或修改：{\"op\":\"upsert\",\"req\":{\"id\":\"自己取，英數與底線，同一條需求沿用同一個 id\",\"field\":欄位,\"value\":值,\"label\":\"給用戶看的短標籤\",\"hard\":true 或 false,\"confidence\":0到1,\"evidence\":\"用戶原文片段，沒有就 null\"}}\n刪除：{\"op\":\"delete\",\"id\":\"需求 id\"}\n欄位與值：\n- budget 預算（新台幣）：{\"min\":數字,\"max\":數字}，可只給一邊\n- size 螢幕尺寸：{\"mode\":\"around\"|\"max\"|\"min\"|\"range\",\"inch\":數字,\"to\":數字（range 才給）}\n- weight_max 重量上限：公斤數字\n- brand 品牌：{\"only\":[\"品牌\"],\"no\":[\"品牌\"]}\n- os 作業系統：\"windows\" 或 \"macos\"\n- ram_min 記憶體下限：GB 數字\n- dgpu_required 要不要獨顯：true 或 false\n- refresh_min "}, {"name": "資料庫欄位清單", "head": "資料庫", "chars": 16600, "kind": "data", "excerpt": "## 資料庫\n共 370 台上架筆電，價格是新台幣。sql_query 只能查檢視表 agent_laptops（每台一列，id 是機型 id，name 是機型名稱）。欄位清單（欄名｜中文｜類型｜單位）：\nid｜機型 id｜文字\nname｜機型名稱｜文字\nbrand｜品牌｜類別\nprice｜價格｜數值（越低越好）｜元\ntest_start_date｜測試開始日期｜文字（不可比較）\nreview_date｜評測日期｜文字（不可比較）\nseries｜系列｜類別\nwarranty_months｜保固期｜數值（越高越好）｜月\nbuy_url｜購買連結｜文字（不可比較）\nreview_video_url｜評測影片連結｜文字（不可比較）\ntested_perf_mode｜測試時的性能模式｜類別\nperf_modes｜可選性能模式｜文字（不可比較）\nhumidity_pct｜測試環境濕度｜數值（越高越好）｜%\nroom_temp_c｜測試室溫｜數值（越低越好）｜°C\ndescription｜配置描述｜文字（不可比較）\nshell_a_material｜A 面（螢幕背蓋）材質｜類別\nshell_b_material｜B 面（螢幕邊框）材質｜"}, {"name": "卡片說明", "head": "卡片（放在 reply 的 cards）", "chars": 451, "kind": "rule", "excerpt": "## 卡片（放在 reply 的 cards）\n這一輪可以用的卡片：recommend、compare、followup\n只能用上面列出的種類；下面的寫法說明裡，沒有列在上面的種類這一輪不能用，出了會被程式拿掉。\n- recommend 推薦卡：{\"type\":\"recommend\",\"ids\":[\"機型 id\",...]}，依你要的順序，最多 5 台。\n- compare 對比卡：{\"type\":\"compare\",\"ids\":[\"機型 id\",...]}，2～3 台並排比較。\n- followup 追問卡：{\"type\":\"followup\",\"cardId\":\"題目 id\"}，從下方追問題庫挑一題，一輪最多一張；用戶點了選項，程式會套用並在下一輪告訴你。\n- suggest 建議回覆：{\"type\":\"suggest\",\"items\":[\"用戶可能想接著說的一句話\",...]}，最多 3 句，用用戶的口吻寫完整的話。\n需求卡（這輪新增的需求）和候選數量卡由程式自動附上，你不用出。\n\n"}, {"name": "回覆寫法", "head": "回覆的寫法", "chars": 384, "kind": "rule", "excerpt": "## 回覆的寫法\n- 繁體中文（台灣用語），口語、親切、簡潔。\n- 純文字：畫面不支援粗體、標題、表格與 * # | 這些符號；要分點就用「1.」或換行。\n- 價格、規格、分數只能用工具查到或下方資料裡的數字；查不到就說不知道，不要猜。沒有查過的面向（例如噪音、散熱、做工）不要下評語，要評論先用 sql_query 查。\n- 說「最便宜」「最輕」「續航最久」這類最高級之前，要用 sort_pool 或 sql_query 在整個候選池確認過；只看過其中幾台時，要說「這幾台裡」。比較兩台誰比較強，要對照查到的數字，不要憑印象。\n- 回覆文字裡提到的名次與順序，要和你附的推薦卡順序一致；「第 1 名」「前兩名」指的是候選池（推薦卡）的順序。\n- 推薦時說清楚為什麼適合他、要接受哪些取捨。\n- 資訊不夠時，問一個最關鍵的問題就好（可以用追問卡，也可以直接問）。\n\n"}, {"name": "目前狀態", "head": "這段對話目前的狀態", "chars": 898, "kind": "data", "excerpt": "## 這段對話目前的狀態\n第 5 輪對話\n需求標籤（id｜欄位｜標籤｜硬條件或偏好｜值）：\n- budget｜budget｜預算 1 萬以內｜硬條件｜值 {\"max\":10000}\n- purpose｜purpose｜上課寫報告＋玩遊戲｜偏好｜值 \"上課寫報告、玩遊戲\"\n- carry｜portability｜每天背去學校｜偏好｜值 \"high\"\n- req_card_card_battery_day｜priority｜重視續航｜偏好｜值 \"battery\"\n- req_card_card_game_genre_aaa｜dgpu_required｜需要獨立顯卡｜硬條件｜值 true\n七維權重（AI 設定；理由：要玩遊戲所以性能拉高，但每天背去學校、要撐一整天，便攜和續航還是留著重量）：性能＝30、螢幕＝20、便攜＝20、續航＝20、散熱＝6、安靜＝3、擴充＝1\n權重怎麼變：用途、攜帶頻率、特別重視這些偏好需求本身不會改權重；要影響排名，請在 update_profile 直接給 weights。\n性能細項（AI 設定）：顯卡＝35、記憶體＝12、儲存＝8、多核＝20、單核＝25\n排除的機型：（沒有）\n對比清單：華碩a豆14 "}, {"name": "候選前 10 名", "head": "候選池前幾名", "chars": 948, "kind": "data", "excerpt": "## 候選池前幾名\n符合 127 台、差一點 35 台\n1. 260129A｜機械革命翼龍15 Pro 2026｜NT$6,549｜產品力 63.9\n2. SHDX0007｜ROG 魔霸9 (Strix 9 G16) (2025) 魔霸9 G16 RTX5070｜NT$8,999｜產品力 55.2\n3. SHDX0163｜拯救者 Y7000X (2026) Intel Core Ultra 7 251HX / RTX 5060 8GB / 32GB / 1TB｜NT$9,999｜產品力 54.8\n4. SHDX0162｜拯救者 Y7000X (2026) Intel Core Ultra 7 251HX / RTX 5060 8GB / 16GB / 1TB｜NT$8,499｜產品力 54.6\n5. SHDX0248｜戰神 T10 Pro (2025) Intel Core i7-14700HX / RTX 5070 Ti 12GB / 32GB / 1TB｜NT$7,899｜產品力 54.1\n6. SHDX0046｜華碩天選Air 2026 (TUF Air 2026) (2026) 天選Air 2026 AI9+RTX5"}, {"name": "追問題庫", "head": "追問題庫", "chars": 1198, "kind": "data", "excerpt": "## 追問題庫\ncard_edit_intensity｜剪輯強度｜你剪片大概是哪種強度？｜選項：輕度、中度、重度\ncard_portability｜攜帶頻率｜你多常帶著它出門？｜選項：每天背著走、偶爾帶出門、幾乎都放桌上\ncard_software｜常用軟體｜有固定要用的專業軟體嗎？｜選項：Photoshop、Illustrator、Premiere Pro、都沒有，一般使用為主\ncard_weigh "inTok":null,"outTok":null,"text":"","error":"模型連線失敗：fetch failed：Connect Timeout Error (attempted address: api.deepseek.com:443, timeout: 10000ms)","truncated":false,"sent":null,"out":null,"calls":[]}],"before":{"weights":{"noise":4,"battery":12,"display":18,"thermal":10,"performance":42,"portability":12,"expandability":2},"weightsFrom":"上一輪","perf":{"gpu":50,"memory":10,"storage":7,"cpu_multi":18,"cpu_single":15},"top":["260329A","SHDX0252","260129A","GJS0002","SHDX0250"],"formal":200},"cards":[{"to":200,"out":131,"edge":39,"from":200,"type":"count"}],"dropped":[],"formal":200,"edge":39,"out":131}],"texts":{"3920ec7060":"你是「AI 筆電選購助手」，在台灣幫用戶挑筆電。你的唯一目標：了解用戶真正的需求，推薦最適合他的筆電，讓用戶感受到你了解他、理解他。\n\n","c56bb0ea95":"## 你怎麼工作\n每一輪你會收到用戶說的一句話，或程式替用戶在畫面上的操作寫的說明。你自己判斷用戶想做什麼；需要資料就用工具查，工具可以呼叫很多次，查夠了再回答。\n最後一定要呼叫 reply 工具交出回覆和卡片，這一輪才算結束。\n\n","766d70a989":"## 兩條路：先想清楚再選工具\n1. 篩選、排序類（「1 萬以內」「要 OLED」「最輕的幾台」「續航最久的」「推薦一台給我」）：用 update_profile 設定需求與權重，需要依某個規格排時用 sort_pool，交給推薦引擎算。引擎算出的名單就是用戶畫面上的候選池，你推薦的機型要從這份名單挑。\n2. 查事實、統計類（「這台喇叭幾瓦」「各品牌平均價格」「有幾台有指紋辨識」）：用 sql_query 查資料庫。只是想知道一件事時，不要去改用戶的需求。\n分不清時問自己：用戶是想「縮小或重排候選」，還是只想「知道一件事」？\n\n","b93ab5e7b5":"## 推薦引擎怎麼算\n- 需求分兩種：硬條件（hard: true）會把不符合的機型排除；偏好（hard: false）不排除。偏好會不會自動改權重，看下方「這段對話目前的狀態」的「權重怎麼變」那行。\n- 什麼時候用硬條件：用戶說「一定要」「不能超過」「X 以內」「只要」「不要」這種明確界線才用硬條件。「希望」「最好」「輕一點」「便宜一點」「盡量」是偏好：用 hard: false 的需求記下來，再調高對應的權重（例如「輕一點」→ 調高 portability），不要直接加硬條件把候選刷掉。硬條件刷掉大量機型前，先想想用戶是不是真的不能接受。\n- 七個權重維度，整數、總和 100：performance 性能、display 螢幕、portability 便攜、battery 續航、thermal 散熱、noise 安靜、expandability 擴充。每台機型在每個維度有分數，產品力分＝各維度分數依權重加權。\n- 性能底下有 5 個細項比例，總和 100：cpu_single 單核、cpu_multi 多核、gpu 顯卡、memory 記憶體、storage 儲存。\n- 權重是這個用戶專屬的：依你對他的了解設定，並在 weightReason 用一句話說為什麼。\n- 狀態裡標「用戶手動調過權重」時，除非用戶這句話明確要求，不要改權重。\n- 用戶畫面上看得到：需求標籤、權重面板、候選池（含排序選單）、對比清單、收藏。你改的需求、權重、排序，用戶都會看到。\n\n","e873bc1bc4":"## 需求的寫法（update_profile 的 ops）\n新增或修改：{\"op\":\"upsert\",\"req\":{\"id\":\"自己取，英數與底線，同一條需求沿用同一個 id\",\"field\":欄位,\"value\":值,\"label\":\"給用戶看的短標籤\",\"hard\":true 或 false,\"confidence\":0到1,\"evidence\":\"用戶原文片段，沒有就 null\"}}\n刪除：{\"op\":\"delete\",\"id\":\"需求 id\"}\n欄位與值：\n- budget 預算（新台幣）：{\"min\":數字,\"max\":數字}，可只給一邊\n- size 螢幕尺寸：{\"mode\":\"around\"|\"max\"|\"min\"|\"range\",\"inch\":數字,\"to\":數字（range 才給）}\n- weight_max 重量上限：公斤數字\n- brand 品牌：{\"only\":[\"品牌\"],\"no\":[\"品牌\"]}\n- os 作業系統：\"windows\" 或 \"macos\"\n- ram_min 記憶體下限：GB 數字\n- dgpu_required 要不要獨顯：true 或 false\n- refresh_min 螢幕更新率下限：Hz 數字\n- purpose 用途：短文字，例如 辦公學習、設計、剪輯、遊戲、程式開發\n- portability 攜帶頻率：\"low\"|\"mid\"|\"high\"\n- software 軟體：{\"name\":\"軟體庫裡的名稱\",\"usage\":\"用途名稱\"}\n- priority 特別重視：七個維度之一的英文 key\n- other 其他：短文字，只當紀錄，不影響排序\n- spec 任意欄位條件：{\"column\":\"欄名（見下方欄位清單）\",\"op\":\"gte\"|\"lte\"|\"eq\"|\"neq\"|\"in\"|\"notin\"|\"around\",\"value\":數字、文字或文字陣列}\n  例：要 OLED → {\"column\":\"panel_type\",\"op\":\"in\",\"value\":[\"OLED\"]}；喇叭至少 4 顆 → {\"column\":\"speaker_count\",\"op\":\"gte\",\"value\":4}\n\n","c2b5172d97":"## 資料庫\n共 370 台上架筆電，價格是新台幣。sql_query 只能查檢視表 agent_laptops（每台一列，id 是機型 id，name 是機型名稱）。欄位清單（欄名｜中文｜類型｜單位）：\nid｜機型 id｜文字\nname｜機型名稱｜文字\nbrand｜品牌｜類別\nprice｜價格｜數值（越低越好）｜元\ntest_start_date｜測試開始日期｜文字（不可比較）\nreview_date｜評測日期｜文字（不可比較）\nseries｜系列｜類別\nwarranty_months｜保固期｜數值（越高越好）｜月\nbuy_url｜購買連結｜文字（不可比較）\nreview_video_url｜評測影片連結｜文字（不可比較）\ntested_perf_mode｜測試時的性能模式｜類別\nperf_modes｜可選性能模式｜文字（不可比較）\nhumidity_pct｜測試環境濕度｜數值（越高越好）｜%\nroom_temp_c｜測試室溫｜數值（越低越好）｜°C\ndescription｜配置描述｜文字（不可比較）\nshell_a_material｜A 面（螢幕背蓋）材質｜類別\nshell_b_material｜B 面（螢幕邊框）材質｜類別\nshell_c_material｜C 面（鍵盤面）材質｜類別\nshell_d_material｜D 面（底蓋）材質｜類別\nphoto_a｜照片 A｜文字（不可比較）\nphoto_b｜照片 B｜文字（不可比較）\nphoto_c｜照片 C｜文字（不可比較）\nphoto_d｜照片 D｜文字（不可比較）\nphoto_angle45｜45 度照片｜文字（不可比較）\nscreen_finish｜螢幕表面（霧面／鏡面）｜類別\nreflectivity｜螢幕反射程度｜文字（不可比較）\narrow_key_size｜方向鍵大小｜文字（不可比較）\narrow_key_layout｜方向鍵配置｜類別\nkeycap_material｜鍵帽材質｜類別\nkeyboard_backlight｜鍵盤背光｜類別\nkeyboard_layout｜鍵盤配置｜類別\ntouchpad_material｜觸控板材質｜類別\ntouchpad_height_mm｜觸控板高度｜數值（越高越好）｜mm\ntouchpad_width_mm｜觸控板寬度｜數值（越高越好）｜mm\ntouch_support｜觸控螢幕｜有／無\nwidth_mm｜機身寬度｜數值（越低越好）｜mm\ndepth_mm｜機身 有列在上面的種類這一輪不能用，出了會被程式拿掉。\n- recommend 推薦卡：{\"type\":\"recommend\",\"ids\":[\"機型 id\",...]}，依你要的順序，最多 5 台。\n- compare 對比卡：{\"type\":\"compare\",\"ids\":[\"機型 id\",...]}，2～3 台並排比較。\n- followup 追問卡：{\"type\":\"followup\",\"cardId\":\"題目 id\"}，從下方追問題庫挑一題，一輪最多一張；用戶點了選項，程式會套用並在下一輪告訴你。\n- suggest 建議回覆：{\"type\":\"suggest\",\"items\":[\"用戶可能想接著說的一句話\",...]}，最多 3 句，用用戶的口吻寫完整的話。\n需求卡（這輪新增的需求）和候選數量卡由程式自動附上，你不用出。\n\n","9507014ca4":"## 回覆的寫法\n- 繁體中文（台灣用語），口語、親切、簡潔。\n- 純文字：畫面不支援粗體、標題、表格與 * # | 這些符號；要分點就用「1.」或換行。\n- 價格、規格、分數只能用工具查到或下方資料裡的數字；查不到就說不知道，不要猜。沒有查過的面向（例如噪音、散熱、做工）不要下評語，要評論先用 sql_query 查。\n- 說「最便宜」「最輕」「續航最久」這類最高級之前，要用 sort_pool 或 sql_query 在整個候選池確認過；只看過其中幾台時，要說「這幾台裡」。比較兩台誰比較強，要對照查到的數字，不要憑印象。\n- 回覆文字裡提到的名次與順序，要和你附的推薦卡順序一致；「第 1 名」「前兩名」指的是候選池（推薦卡）的順序。\n- 推薦時說清楚為什麼適合他、要接受哪些取捨。\n- 資訊不夠時，問一個最關鍵的問題就好（可以用追問卡，也可以直接問）。\n\n","8acef90787":"## 這段對話目前的狀態\n第 1 輪對話\n需求標籤（id｜欄位｜標籤｜硬條件或偏好｜值）：\n（還沒有）\n七維權重（預設或規則（目前是預設權重））：性能＝33、螢幕＝21、便攜＝14、續航＝12、散熱＝10、安靜＝6、擴充＝4\n權重怎麼變：用途、攜帶頻率、特別重視這些偏好需求本身不會改權重；要影響排名，請在 update_profile 直接給 weights。\n性能細項（預設或規則）：單核＝20、多核＝25、顯卡＝35、記憶體＝10、儲存＝10\n排除的機型：（沒有）\n對比清單：（沒有）\n收藏：Dell Pro 14 Premium (PA14250) (2025) Intel Core Ultra 7 268V / Intel Arc 140V 集成顯卡 / 32GB / 1TB（SHDX0355）、泰坦18 Ultra 2026 (Titan 18 HX) (2026) Intel Core Ultra 9 290HX Plus / RTX 5090 24GB (175W) / 96GB / 2TB（SHDX0254）、聯想 小新 Pro 16 GT AI 元啟版 2026 388H（GJS0001）\n目前排序：產品力\n\n","834592dc22":"## 候選池前幾名\n符合 370 台、差一點 0 台\n1. GJS0001｜聯想 小新 Pro 16 GT AI 元啟版 2026 388H｜NT$12,899｜產品力 80.1\n2. BIBA0002｜聯想小新Pro 16 GT AI元啟版｜NT$12,899｜產品力 79.2\n3. BIBA0005｜華碩a豆14 Air 2026｜NT$5,900｜產品力 75.0\n4. SHDX0136｜拯救者 Y9000P 至尊版 (2026) Intel Core Ultra 9 290HX Plus / RTX 5090 24GB (175W) / 64GB / 2TB｜NT$39,792｜產品力 74.5\n5. SHDX0254｜泰坦18 Ultra 2026 (Titan 18 HX) (2026) Intel Core Ultra 9 290HX Plus / RTX 5090 24GB (175W) / 96GB / 2TB｜NT$47,999｜產品力 74.4\n6. SHDX0052｜ProArt 創13 2026 (2026) 創13 2026 Max+395/128G｜NT$28,999｜產品力 74.2\n7. SHDX0051｜ProArt 創13 2026 (2026) 創13 2026 Max+395/64G｜NT$13,499｜產品力 73.8\n8. SHDX0135｜拯救者 Y90  5 輪 系統：了解，是 3A 大作，那顯卡就要認真挑了。我把權重改成性能優先（顯卡佔性能的一半），重新排了一次，1 萬以內有獨顯的有 127 台。\n\n這幾台裡我推這三台：\n1. 戰神 T10 Pro（7899 元）：RTX 5070 Ti 12GB、140W，顯卡跑分 16208 是這批裡最高的，1080p 跑電馭叛客 2077 平均 89.5 幀、魔物獵人 106.5 幀，3A 大作順跑沒問題。16 吋 300Hz、32GB／1TB，續航 11 小時。代價是 2.43 公斤、外出總重 3.05 公斤，每天背會比較重。\n2. 機械革命翼龍15 Pro 2026（6549 元）：RTX 5060 8GB、115W，跑分 12298，2077 約 69 幀、魔物獵人 100 幀，3A 開中高畫質可以順玩。15 吋 300Hz、32GB／1TB，續航 13 小時是這批最久，機身 2 公斤、外出總重 2.77 公斤，是這幾台裡最好背的。想省錢又要顧重量，這台最划算。\n3. 曙光16 2025款（9999 元）：RTX 5070 8GB、跑分 13120，2077 約 71 幀，16 吋 240Hz、32GB／1TB，續航 11 小時。效能比第 2 台強一階，但價格頂到預算上限、重量 2.43 公斤。\n\n簡單說：遊戲效能優先就第 1 台，那顆 5070 Ti 12GB 在 1 萬內幾乎沒對手；想兼顧每天背的重量和續航就第 2 台；想要 5070 又不想超過 1 萬就第 3 台。\n\n提醒一下，加了獨顯之後重量都在 2 公斤以上，跟之前那台 0.99 公斤的 a豆14 Air 是兩條完全不同的路。你每天背去學校的距離大概多遠？如果走很久，我會建議往第 2 台看。（附：推薦卡 戰神 T10 Pro (2025) Intel Core i7-14700HX / RTX 5070 Ti 12GB / 32GB / 1TB、機械革命翼龍15 Pro 2026、曙光16 2025款 (2025) Intel Core i9-14900HX / RTX 5070 8GB / 32GB / 1TB；對比表 戰神 T10 Pro (2025) Intel Core i7-14700HX / RTX 5070 Ti 12GB / 32GB / 1TB、機械革命翼龍15 Pro 2026）\n第 6 輪 用戶：这个机械革命和这个拯救者 Y9000P 定制版哪个更好呀？\n第 6 輪 系統：這兩台取向差很多，我幫你對照實際數字：\n\n1. 拯救者 Y9000P 定製版（12,999 元）：RTX 5070 8GB、175W，顯卡跑分 17513，比翼龍的 12298 高約四成；CPU 多核 29804 也贏。16 吋 240Hz、32GB／1TB，續航 15.2 小時。代價是外出總重 3.14 公斤、雙烤噪音 56dB、鍵盤最高溫 52 度，是兩台裡比較吵也比較熱的。\n2. 機械革命翼龍15 Pro 2026（6,549 元）：RTX 5060 8GB、115W，跑分 12298，3A 開中高畫質順玩沒問題。15 吋 300Hz、32GB／1TB，續航 13 小時，機身 2 公斤、外出總重 2.77 公斤，雙烤噪音 50dB、鍵盤最高溫 45.3 度，比 Y9000P 安靜也涼一些。\n\n簡單說：純看遊戲效能，Y9000P 明顯強一階，而且只貴 6,450 元，效能／價格其實不差；但每天背去學校的話，翼龍輕 0.37 公斤、安靜 6dB、鍵盤涼 7 度，價格還不到一半，對你「上課寫報告＋3A」的用法更均衡。\n\n我的建議：如果 3A 大作是重心、願意背 3 公斤出門，選 Y9000P；如果每天都要背、遊戲只是課餘玩，翼龍就夠了，省下的錢還能留著買螢幕或周邊。\n\n你比較在意「遊戲幀數再高一點」還是「背包輕一點」？（附：對比表 拯救者Y9000P定製版、機械革命翼龍15 Pro 2026；推薦卡 機械革命翼龍15 Pro 2026、拯救者Y9000P定製版）","74ca682547":"## 這段對話目前的狀態\n第 8 輪對話\n需求標籤（id｜欄位｜標籤｜硬條件或偏好｜值）：\n- req_filter_budget｜budget｜預算 NT$ 6,500–18,000｜硬條件｜值 {\"max\":18000,\"min\":6500}\n- purpose｜purpose｜上課寫報告＋玩遊戲｜偏好｜值 \"上課寫報告、玩遊戲\"\n- carry｜portability｜每天背去學校｜偏好｜值 \"high\"\n- req_card_card_battery_day｜priority｜重視續航｜偏好｜值 \"battery 0364 是五台最低。價格比 T11 Pro 貴 2,600 元，效能差距很小。\n\n7. 暗影騎士·擎7S Ultra 9 275HX 版（16,599 元）：跟第 6 台同一台機器、同價，差在 CPU 換成 Ultra 9，多核 34351 高不少，跑分 19515、2077 約 96 幀。要跑多工、剪片、算圖的話，這台的 CPU 比第 6 台划算。\n\n8. 曙光16 Ultra 2025 款（14,999 元）：RTX 5080 16GB、跑分 19828，跟第 6 台幾乎同級，2077 約 100.9 幀，還直接給你 2TB SSD（其他都是 1TB）。價格比暗影騎士便宜 1,600 元。缺點一樣：2.43 公斤、58dB、鍵盤 49.5 度。\n\n簡單說：要效能／價格最划算，第 5 台 T11 Pro（13,999 就有 5080）和第 8 台曙光16 Ultra（14,999 有 5080 加 2TB）最值得看；要最安靜、最輕、最不燙手就第 4 台榮耀，但得接受它效能是這五台最弱又最貴。這幾台機身都在 2 公斤以上，每天背去學校會比翼龍外出總重 2.77 公斤更吃力。\n\n要我把第 5 台跟第 8 台拉出來，跟你手上的 Y9000P、翼龍一起比嗎？（附：推薦卡 榮耀 MagicBook Pro 16 Ultra 9 285H、戰神 T11 Pro (2026) Intel Core i9-14900HX / RTX 5080 16GB / 32GB / 1TB、暗影騎士·擎7S (2025) Intel Core Ultra 7 255HX / RTX 5080 16GB / 32GB / 1TB、暗影騎士·擎7S (2025) Intel Core Ultra 9 275HX / RTX 5080 16GB / 32GB / 1TB、曙光16 Ultra 2025款 (2025) Intel Core Ultra 9 275HX / RTX 5080 16GB / 32GB / 2TB）","87e3e44ee3":"## 這段對話目前的狀態\n第 9 輪對話\n需求標籤（id｜欄位｜標籤｜硬條件或偏好｜值）：\n- req_filter_budget｜budget｜預算 NT$ 6,500–18,000｜硬條件｜值 {\"max\":18000,\"min\":6500}\n- purpose｜purpose｜上課寫報告＋玩遊戲｜偏好｜值 \"上課寫報告、玩遊戲\"\n- carry｜portability｜每天背去學校｜偏好｜值 \"high\"\n- req_card_card_battery_day｜priority｜重視續航｜偏好｜值 \"battery\"\n- req_card_card_game_genre_aaa｜dgpu_required｜需要獨立顯卡｜硬條件｜值 true\n- game_genre_aaa｜other｜主要玩 3A 大作｜偏好｜值 \"主要玩 3A 大作\"\n七維權重（AI 設定；理由：要跑 3A 大作，性能（尤其顯卡）優先，但每天背去學校仍留一點便攜和續航）：性能＝42、螢幕＝18、便攜＝12、續航＝12、散熱＝10、安靜＝4、擴充＝2\n權重怎麼變：用途、攜帶頻率、特別重視這些偏好需求本身不會改權重；要影響排名，請在 update_profile 直接給 weights。\n性能細項（AI 設定）：顯卡＝50、記憶體＝10、儲存＝7、多核＝18、單核＝15\n排除的機型：（沒有）\n對比清單：榮耀 MagicBook Pro 16 Ultra 9 285H（GJS0002）、戰神 T11 Pro (2026) Intel Core i9-14900HX / RTX 5080 16GB / 32GB / 1TB（SHDX0250）、暗影騎士·擎7S (2025) Intel Core Ultra 7 255HX / RTX 5080 16GB / 32GB / 1TB（SHDX0225）\n收藏：Dell Pro 14 Premium (PA14250) (2025) Intel Core Ultra 7 268V / Intel Arc 140V 集成顯卡 / 32GB / 1TB（SHDX0355）、泰坦18 Ultra 2026 (Titan 18 HX) (2026) Intel Core Ultra 9 290HX Plus / RTX 5090 24GB (175W) / 96GB / 2TB（SHDX0254）、聯想 小新 Pro 16 GT AI 元啟版 2026 388H（GJS0001）\n目前排序：產品力\n\n","dac7bcd681":"## 先前的對話\n第 1 輪 用戶：預算 4 萬，平常上課寫報告，每天要背去學校\n第 1 輪 系統：了解，4 萬以內、每天背去學校、主要上課寫報告。我把權重調成便攜和續航優先，性能只要夠用就好，候選池裡符合的有 365 台。\n\n這幾台裡我最推前兩台：\n1. 聯想 小新 Pro 16 GT AI 元啟版 2026（GJS0001）：1.72 公斤、續航 27.5 小時，是這批裡續航最長的，16 吋 OLED 120Hz 螢幕寫報告、看資料很舒服，32GB／1TB，約 1.29 萬。缺點是 16 吋加變壓器外出總重 2 公斤，每天背會有點負擔。\n2. 華碩 a豆14 Air 2026（BIBA0005）：只有 0.99 公斤、外出總重 1.6 公斤，續航 16.5 小時，14 吋 OLED 120Hz，同樣 32GB／1TB，約 5900 元。要輕巧好背的話這台最適合，價格也最省。\n3. 聯想小新Pro 16 GT AI元啟版（BIBA0002）：規格跟第 1 台幾乎一樣，1.78 公斤、續航 27.5 小時，約 1.29 萬，想要大螢幕又在意續航可以看這台。\n\n如果你每天通勤距離長、很在意背包重量，我會選第 2 台；如果報告常要同時開很多視窗、想一次買到位，第 1 台的大螢幕和續航更划算。\n\n想再幫你縮小範圍的話，你平常會帶筆電去圖書館或咖啡廳長時間不插電嗎？（附：推薦卡 聯想 小新 Pro 16 GT AI 元啟版 2026 388H、華碩a豆14 Air 2026、聯想小新Pro 16 GT AI元啟版；追問卡）\n第 2 輪 用戶：盡量撐一整天\n第 2 輪 系統：好，既然希望不插電撐一整天，我把續航的權重拉到跟便攜一樣重，重新排了一次。這批裡續航最長的就是聯想那兩台，實測 27.5 小時，撐一整天完全沒問題。\n\n1. 聯想 小新 Pro 16 GT AI 元啟版 2026（GJS0001）：1.72 公斤、外出總重 2 公斤，續航 27.5 小時，16 吋 OLED、32GB／1TB，約 1.29 萬。續航和螢幕都最強，代價是每天背 2 公斤。\n2. 聯想小新Pro 16 GT AI元啟版（BIBA0002）：規格幾乎一樣，1.78 公斤、續航 27.5 小時，約 1.29 萬，跟第 1 台差在重量多一點。\n3. 華碩a豆14 Air 2026（BIBA0005）：只有 0.99 公斤、外出總重 1.6 公斤，續航 16.5 小時，14 吋 OLED、32GB／1TB，約 5900 元。最輕最好背，撐一整天課也夠用，價格最省。\n\n簡單說：想「續航絕對夠、螢幕大」選第 1 台；想「背包輕、預算省」選第 3 台，續航 16.5 小時對上課寫報告其實也很充裕。\n\n你每天背去學校的距離大概多遠？如果走很久或要爬樓梯，我會更偏向第 3 台。（附：推薦卡 聯想 小新 Pro 16 GT AI 元啟版 2026 388H、聯想小新Pro 16 GT AI元啟版、華碩a豆14 Air 2026；對比表 聯想 小新 Pro 16 GT AI 元啟版 2026 388H、華碩a豆14 Air 2026）\n第 3 輪 用戶：預算1萬以內\n第 3 輪 系統：好，預算收到 1 萬以內，符合的有 197 台，選擇還是很多。原本那兩台聯想（1.29 萬）就超預算了，我幫你換成這批裡最適合每天背去學校的：\n\n1. 華碩a豆14 Air 2026（BIBA0005）：5900 元，0.99 公斤、外出總重 1.6 公斤，是這批裡最輕的；續航 16.5 小時，也是這幾台裡最久的。14 吋 OLED 120Hz、32GB／1TB，上課寫報告完全夠用，撐一整天課沒問題。這台我最推。\n2. 華碩無畏Pro14 2026 銳龍版（SHDX0063）：5779 元，1.38 公斤、外出總重 1.6 公斤，14 吋 OLED 120Hz、32GB／1TB。價格更低，但續航 10 小時，比第 1 台少一截。\n3. 華碩 靈耀16 Air 2026（GJS0003）：6999 元，16 吋 OLED 大螢幕，1.5 公斤、外出總重 2 公斤，續航 12.5 小時。想要大螢幕看報告、同時開很多視窗可以選它，代價是背包重一點。\n\n簡單說：想最輕、續航最久就第 1 台；想省錢、能接受續航短一點就第 2 台；要大螢幕就第 3 台。\n\n你每天背去學校大概多遠？如果走很久，我會毫不猶豫選第 1 台。（附：推薦卡 華碩a豆14 Air 2026、華碩無畏Pro14 2026 銳龍版 (Vivobook Pro 14 2026) (2026) 無畏Pro14 2026 銳龍 AI9/32+1T、華碩 靈耀16 Air 2026 AI 9 H 465；對比表 華碩a豆14 Air 2026、華碩無畏Pro14 2026 銳龍版 (Vivobook Pro 14 2026) (2026) 無畏Pro14 2026 銳龍 AI9/32+1T）\n第 4 輪 用戶：經常玩遊戲需要獨顯可以嗎？\n第 4 輪 系統：可以，1 萬以內有獨顯的遊戲筆電其實不少，符合的有 127 台。不過要先跟你說清楚取捨：加了獨顯之後，重量幾乎都在 2 公斤以上，續航也從原本的 16 小時掉到 6～13 小時，跟之前那台 0.99 公斤的 a豆14 Air 是完全不同路線。\n\n這幾台裡我推這三台：\n1. 機械革命翼龍15 Pro 2026（6549 元）：這批裡最便宜的獨顯機，RTX 5060 8GB（115W）、32GB／1TB，15 吋 300Hz 螢幕，續航 13 小時是這幾台裡最久的，機身 2 公斤、外出總重 2.77 公斤。想省錢又要能打遊戲，這台最划算。\n2. 戰神 T10 Pro（7899 元）：RTX 5070 Ti 12GB（140W），顯卡跑分 16208 是這幾台裡最高的，16 吋 300Hz、32GB／1TB，續航 11 小時。想要遊戲效能明顯強一階就選它，代價是 2.43 公斤、外出總重 3.05 公斤，每天背會比較吃力。\n3. 華碩天選Air 2026（9199 元）：14 吋、2.15 公斤、外出總重 2.77 公斤，是這幾台裡最好背的獨顯機，RTX 5060 8GB、32GB／1TB、165Hz。缺點是續航只有 6.67 小時，不插電大概撐不到一整天課。\n\n簡單說：預算優先、要續航就第 1 台；遊戲效能優先就第 2 台；想兼顧每天背的重量就第 3 台。\n\n你玩的遊戲大概是哪一類？如果是 3A 大作我會建議往第 2 台看，如果是輕度網遊或競技射擊，第 1 台就很夠了。（附：推薦卡 機械革命翼龍15 Pro 2026、戰神 T10 Pro (2025) Intel Core i7-14700HX / RTX 5070 Ti 12GB / 32GB / 1TB、華碩天選Air 2026 (TUF Air 2026) (2026) 天選Air 2026 AI9+RTX5060/32GB 日蝕灰；追問卡）\n第 5 輪 用戶：3A 大作\n第 5 輪 系統：了解，是 3A 大作，那顯卡就要認真挑了。我把權重改成性能優先（顯卡佔性能的一半），重新排了一次，1 萬以內有獨顯的有 127 台。\n\n這幾台裡我推這三台：\n1. 戰神 T10 Pro（7899 元）：RTX 5070 Ti 12GB、140W，顯卡跑分 16208 是這批裡最高的，1080p 跑電馭叛客 2077 平均 89.5 幀、魔物獵人 106.5 幀，3A 大作順跑沒問題。16 吋 300Hz、32GB／1TB，續航 11 小時。代價是 2.43 公斤、外出總重 3.05 公斤，每天背會比較重。\n2. 機械革命翼龍15 Pro 2026（6549 元）：RTX 5060 8GB、115W，跑分 12298，2077 約 69 幀、魔物獵人 100 幀，3A 開中高畫質可以順玩。15 吋 300Hz、32GB／1TB，續航 13 小時是這批最久，機身 2 公斤、外出總重 2.77 公斤，是這幾台裡最好背的。想省錢又要顧重量，這台最划算。\n3. 曙光16 2025款（9999 元）：RTX 5070 8GB、跑分 13120，2077 約 71 幀，16 吋 240Hz、32GB／1TB，續航 11 小時。效能比第 2 台強一階，但價格頂到預算上限、重量 2.43 公斤。\n\n簡單說：遊戲效能優先就第 1 台，那顆 5070 Ti 12GB 在 1 萬內幾乎沒對手；想兼顧每天背的重量和續航就第 2 台；想要 5070 又不想超過 1 萬就第 3 台。\n\n提醒一下，加了獨顯之後重量都在 2 公斤以上，跟之前那台 0.99 公斤的 a豆14 Air 是兩條完全不同的路。你每天背去學校的距離大概多遠？如果走很久，我會建議往第 2 台看。（附：推薦卡 戰神 T10 Pro (2025) Intel Core i7-14700HX / RTX 5070 Ti 12GB / 32GB / 1TB、機械革命翼龍15 Pro 2026、曙光16 2025款 (2025) Intel Core i9-14900HX / RTX 5070 8GB / 32GB / 1TB；對比表 戰神 T10 Pro (2025) Intel Core i7-14700HX / RTX 5070 Ti 12GB / 32GB / 1TB、機械革命翼龍15 Pro 2026）\n第 6 輪 用戶：这个机械革命和这个拯救者 Y9000P 定制版哪个更好呀？\n第 6 輪 系統：這兩台取向差很多，我幫你對照實際數字：\n\n1. 拯救者 Y9000P 定製版（12,999 元）：RTX 5070 8GB、175W，顯卡跑分 17513，比翼龍的 12298 高約四成；CPU 多核 29804 也贏。16 吋 240Hz、32GB／1TB，續航 15.2 小時。代價是外出總重 3.14 公斤、雙烤噪音 56dB、鍵盤最高溫 52 度，是兩台裡比較吵也比較熱的。\n2. 機械革命翼龍15 Pro 2026（6,549 元）：RTX 5060 8GB、115W，跑分 12298，3A 開中高畫質順玩沒問題。15 吋 300Hz、32GB／1TB，續航 13 小時，機身 2 公斤、外出總重 2.77 公斤，雙烤噪音 50dB、鍵盤最高溫 45.3 度，比 Y9000P 安靜也涼一些。\n\n簡單說：純看遊戲效能，Y9000P 明顯強一階，而且只貴 6,450 元，效能／價格其實不差；但每天背去學校的話，翼龍輕 0.37 公斤、安靜 6dB、鍵盤涼 7 度，價格還不到一半，對你「上課寫報告＋3A」的用法更均衡。\n\n我的建議：如果 3A 大作是重心、願意背 3 公斤出門，選 Y9000P；如果每天都要背、遊戲只是課餘玩，翼龍就夠了，省下的錢還能留著買螢幕或周邊。\n\n你比較在意「遊戲幀數再高一點」還是「背包輕一點」？（附：對比表 拯救者Y9000P定製版、機械革命翼龍15 Pro 2026；推薦卡 機械革命翼龍15 Pro 2026、拯救者Y9000P定製版）\n第 7 輪 用戶：呃，除了前3，把第四到第八名的都给我看看吗？\n第 7 輪 系統：看完了，第 4 到第 8 名都在這裡（候選池照產品力排）。先講結論：這五台裡有四台是 RTX 5080 16GB，性能其實都比第 1 名的 Y9000P 更強，只是重量和噪音也跟著上去。\n\n4. 榮耀 MagicBook Pro 16（16,997 元）：RTX 5070 8GB、115W，跑分 12917，是這五台裡最弱的；但機身 1.86 公斤是這幾台最輕，雙烤噪音 53.2dB、鍵盤最高溫 46.9 度也都是五台裡最溫和的。16 吋 165Hz IPS、32GB／1TB、續航 11 小時。缺點是價格最高、效能卻最低。\n\n5. 戰神 T11 Pro 2026（13,999 元）：這是第 4 到第 8 名裡的驚喜。RTX 5080 16GB、165W，跑分 19416，1080p 跑 2077 平均 102 幀、魔物獵人 119.5 幀，比 Y9000P 的 89.5／106.5 幀明顯更高，價格只多 1,000 元。i9-14900HX 多核 35961 是五台最高。代價是 2.43 公斤、外出總重 3.35 公斤，噪音 58dB、鍵盤 49.5 度。\n\n6. 暗影騎士·擎7S Ultra 7 255HX 版（16,599 元）：RTX 5080 16GB、跑分 19821，是五台裡顯卡分數最高的，2077 約 99.8 幀。多核 30364 是五台最低。價格比 T11 Pro 貴 2,600 元，效能差距很小。\n\n7. 暗影騎士·擎7S Ultra 9 275HX 版（16,599 元）：跟第 6 台同一台機器、同價，差在 CPU 換成 Ultra 9，多核 34351 高不少，跑分 19515、2077 約 96 幀。要跑多工、剪片、算圖的話，這台的 CPU 比第 6 台划算。\n\n8. 曙光16 Ultra 2025 款（14,999 元）：RTX 5080 16GB、跑分 19828，跟第 6 台幾乎同級，2077 約 100.9 幀，還直接給你 2TB SSD（其他都是 1TB）。價格比暗影騎士便宜 1,600 元。缺點一樣：2.43 公斤、58dB、鍵盤 49.5 度。\n\n簡單說：要效能／價格最划算，第 5 台 T11 Pro（13,999 就有 5080）和第 8 台曙光16 Ultra（14,999 有 5080 加 2TB）最值得看；要最安靜、最輕、最不燙手就第 4 台榮耀，但得接受它效能是這五台最弱又最貴。這幾台機身都在 2 公斤以上，每天背去學校會比翼龍外出總重 2.77 公斤更吃力。\n\n要我把第 5 台跟第 8 台拉出來，跟你手上的 Y9000P、翼龍一起比嗎？（附：推薦卡 榮耀 MagicBook Pro 16 Ultra 9 285H、戰神 T11 Pro (2026) Intel Core i9-14900HX / RTX 5080 16GB / 32GB / 1TB、暗影騎士·擎7S (2025) Intel Core Ultra 7 255HX / RTX 5080 16GB / 32GB / 1TB、暗影騎士·擎7S (2025) Intel Core Ultra 9 275HX / RTX 5080 16GB / 32GB / 1TB、曙光16 Ultra 2025款 (2025) Intel Core Ultra 9 275HX / RTX 5080 16GB / 32GB / 2TB）\n第 8 輪 用戶：第456加入對比可以嗎？\n第 8 輪 系統：可以。對比卡一次最多並排 3 台，所以我把第 4、5、6 名這三台放成一組給你看（你原本清單裡的 Y9000P 和翼龍還在，要換掉或另外比都可以跟我說）。\n\n1. 第 4 名 榮耀 MagicBook Pro 16（16,997 元）：RTX 5070 8GB、115W，顯卡跑分 12917，是這三台裡最低的；CPU 多核 21649 也最低。但機身 1.86 公斤最輕、外出總重 3.05 公斤，雙烤噪音 53.2dB、鍵盤最高溫 46.9 度，都是三台裡最溫和的。16 吋 165Hz IPS、32GB／1TB、續航 11 小時。它的評測 2077 有 100.3 幀，跟另兩台差不多，但整體跑分差一階，價格又最貴，等於你多花錢買輕和安靜。\n\n2. 第 5 名 戰神 T11 Pro 2026（13,999 元）：這台是三台裡最划算的。RTX 5080 16GB、165W，顯卡跑分 19416，2077 平均 102 幀、魔物獵人 119.5 幀；i9-14900HX 多核 35961 是三台最高。16 吋 240Hz IPS、32GB／1TB、續航 11 小時。代價是 2.43 公斤、外出總重 3.35 公斤，噪音 58dB、鍵盤 49.5 度，是三台裡最吵最燙的。\n\n3. 第 6 名 暗影騎士·擎7S Ultra 7 255HX 版（16,599 元）：RTX 5080 16GB、165W，顯卡跑分 19821 是三台最高，但只贏 T11 Pro 約 2%，遊戲幀數反而略低（2077 99.8 幀、魔物 121.6 幀）。CPU 多核 30364 是三台最低。噪音 57.3dB、鍵盤 48.5 度。價格比 T11 Pro 貴 2,600 元，換來的效能差距很小。\n\n簡單說：要效能／價格就第 5 台 T11 Pro，1.4 萬就有 5080、多核還最高；要最輕最安靜、可以接受顯卡弱一階就第 4 台榮耀；第 6 台的定位有點尷尬，同價位不如直接看 Ultra 9 275HX 版（多核 34351、跑分 19515，同價 16,599），要跑多工比第 6 台划算。\n\n另外提醒，這三台機身都 2.43 公斤以上（榮耀 1.86 公斤但外出總重也 3.05 公斤），跟你之前看的翼龍外出 2.77 公斤比，每天背去學校會更吃力。（附：對比表 榮耀 MagicBook Pro 16 Ultra 9 285H、戰神 T11 Pro (2026) Intel Core i9-14900HX / RTX 5080 16GB / 32GB / 1TB、暗影騎士·擎7S (2025) Intel Core Ultra 7 255HX / RTX 5080 16GB / 32GB / 1TB；推薦卡 戰神 T11 Pro (2026) Intel Core i9-14900HX / RTX 5080 16GB / 32GB / 1TB、榮耀 MagicBook Pro 16 Ultra 9 285H、暗影騎士·擎7S (2025) Intel Core Ultra 9 275HX / RTX 5080 16GB / 32GB / 1TB）","36ad5f7903":"## 用戶最近在畫面上的操作\n- 11/11 19:28 展開側欄\n- 11/11 19:28 開始新對話\n\n"},"names":{"260129A":"機械革命翼龍15 Pro 2026","260329A":"拯救者Y9000P定製版","BIBA0002":"聯想小新Pro 16 GT AI元啟版","BIBA0005":"華碩a豆14 Air 2026","GJS0001":"聯想 小新 Pro 16 GT AI 元啟版 2026 388H","GJS0002":"榮耀 MagicBook Pro 16 Ultra 9 285H","GJS0003":"華碩 靈耀16 Air 2026 AI 9 H 465","SHDX0007":"ROG 魔霸9 (Strix 9 G16) (2025) 魔霸9 G16 RTX5070","SHDX0045":"華碩天選Air 2026 (TUF Air 2026) (2026) 天 function buildSteps() {
  const laps = R.timings;
  const first = laps.findIndex((l) => l.name.startsWith('代理第'));
  const last = laps.length - 1 - [...laps].reverse().findIndex((l) => l.name.startsWith('代理第'));
  const pre = laps.slice(0, first), post = laps.slice(last + 1);
  const steps = [];
  let t = pre.reduce((a, l) => a + l.ms, 0);
  steps.push({ key: 'prep', kind: 'prog', label: '準備', start: 0, ms: t, laps: pre });
  for (const rd of R.rounds) {
    const lap = laps.find((l) => l.name === `代理第 ${rd.n} 回合`)?.ms ?? rd.ms;
    steps.push({ key: `m${rd.n}`, kind: 'model', label: `第 ${rd.n} 回合・模型`, start: t, ms: rd.ms, rd });
    let u = t + rd.ms;
    rd.calls.forEach((c, j) => { steps.push({ key: `c${rd.n}-${j}`, kind: c.name, label: KIND[c.name]?.label ?? c.name, start: u, ms: c.ms, rd, c, child: true }); u += c.ms; });

  steps.push({ key: 'post', kind: 'prog', label: '收尾', start: t, ms: post.reduce((a, l) => a + l.ms, 0), laps: post });

  cols.sort((a, b) => rank(a) - rank(b));
  const body = rows.map((r, i) => `<tr class="${r.discrete_gpu_model === '無' ? 'flag' : ''}" ${i >= limit ? `data-more="${uid}" hidden` : ''}>${cols.map((k) => cell(k, r[k])).join('')}</tr>`).join('');
  const head = cols.map((k) => `<th class="${typeof rows[0][k] === 'number' ? 'r' : ''}">${esc(COL[k] ?? k)}<span class="mono">${esc(k)}</span></th>`).join('');
  const more = rows.length > limit ? `<button class="more" type="button" data-showmore="${uid}">顯示全部 ${rows.length} 列（目前 ${limit} 列）</button>` : '';
  return `<div class="tblwrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${more}`;
}
let UID = 0;
function sqlView(c, { rows = 5 } = {}) {
  const res = c.result ?? {};
  const bad = /column "([^"]+)" does not exist/.exec(res.error ?? '')?.[1];
  let out = `<pre class="sql">${fmtSql(c.args.sql, bad)}</pre>`;
  if (!res.ok) {
    out += `<div class="dberr"><b>資料庫回報</b><span>${esc(res.error)}${bad ? `<br>白話：資料庫沒有「${esc(bad)}」這個欄位。` : ''}</span></div>`;
    out += `<div class="note"><b>設計稿註記：</b>錯的欄位名稱直接在 SQL 裡標紅。分析頁會把這類錯誤集中起來，看得出是不是說明書的欄位清單寫得不夠清楚。</div>`;
  } else {
    out += `<div class="sub-h"><span>查到 ${n(res.rows.length)} 列</span><span class="faint">資料庫耗時 ${n(res.ms)} 毫秒</span>${item(3)}</div>`;
    out += rowsTable(res.rows, rows, `t${UID++}`);
    if (res.rows.some((r) => r.discrete_gpu_model === '無')) {
      out += `<div class="note"><b>設計稿註記（真實發現）：</b>第 1 列「獨顯型號＝無」也被查出來了，因為 SQL 只排除了含「內」的值。現在要點開 11,692 字的 JSON 才看得到；變成表格後，黃底那列一眼就看出問題。</div>`;
    }
  }
  return out;
}

/* ---------- 共用畫法：改需求與權重 ---------- */
function wRows(after, before, labels, max) {
  const keys = Object.keys(after).sort((a, b) => after[b] - after[a]);
  return `<div class="wrows">${keys.map((k) => {
    const a = after[k], b = before?.[k];
    const d = b == null ? 0 : a - b;
    const delta = b == null ? '' : d > 0 ? `<em class="up">▲${d}</em>` : d < 0 ? `<em class="down">▼${-d}</em>` : '<em class="same">—</em>';
    return `<div class="wrow"><span>${esc(labels[k] ?? k)}</span><span class="wt" title="改之前 ${b ?? '—'}，改之後 ${a}">${b != null ? `<i class="was" style="width:${(b / max) * 100}%"></i>` : ''}<i class="now" style="width:${(a / max) * 100}%"></i></span><span class="wv">${b ?? '—'} → <b>${a}</b> ${delta}</span></div>`;
  }).join('')}</div>`;
}
function rankView(res) {
  const before = R.topBefore;
  const after = res.top.slice(0, 5).map((t) => t.id);
  const was = new Map(before.map((id, i) => [id, i + 1]));
  const li = after.map((id, i) => {
    const w = was.get(id);
    const mv = w == null ? '<em class="up">新進</em>' : w > i + 1 ? `<em class="up">▲${w - (i + 1)}</em>` : w < i + 1 ? `<em class="down">▼${i + 1 - w}</em>` : '<em class="same">—</em>';
    return `<li class="${w !== i + 1 ? 'mv' : ''}">${esc(short(id))} ${mv}</li>`;
  }).join('');
  return `<div class="ranks"><div><div class="sub-h">改之前前 5 名</div><ol>${before.map((id) => `<li>${esc(short(id))}</li>`).join('')}</ol></div><div><div class="sub-h">改之後前 5 名</div><ol>${li}</ol></div></div>`;
}
function profileView(c, { compact = false, noWhy = false } = {}) {
  const res = c.result, a = c.args;
  const applied = `<div class="chips">${(res.applied ?? []).map((x) => `<span class="chip">${esc(x.replace(/：.*$/, ''))}</span>`).join('')}${(res.rejected ?? []).map((x) => `<span class="chip cut">被拒絕：${esc(x.why ?? '')}</span>`).join('')}</div>`;
  const why = a.weightReason && !noWhy ? `<p class="why">${esc(a.weightReason)}</p>` : '';
  const cand = `<div><div class="sub-h">候選台數 ${item(3)}</div><p class="small">正式 <b>${n(R.formalBefore)} → ${n(res.formal)}</b> 台（沒變）・邊界 ${n(res.edge)}・排除 ${n(res.out)}</p><div class="chips" style="margin-top:6px">${res.cut.map((x) => `<span class="chip cut">${esc(x.label)} −${n(x.cut)}</span>`).join('')}</div></div>`;
  if (compact) {
    const keys = Object.keys(a.weights).filter((k) => a.weights[k] !== R.weightsBefore[k]).sort((x, y) => Math.abs(a.weights[y] - R.weightsBefore[y]) - Math.abs(a.weights[x] - R.weightsBefore[x]));
    return `${applied}<div class="mini-wt">${keys.slice(0, 4).map((k) => { const d = a.weights[k] - R.weightsBefore[k]; return `<span>${DIM[k]} ${R.weightsBefore[k]}→<b>${a.weights[k]}</b> ${d > 0 ? `<em class="up">▲${d}</em>` : `<em class="down">▼${-d}</em>`}</span>`; }).join('')}<span class="faint">顯卡細項 35→<b>50</b></span></div><p class="small muted">候選仍是 ${n(res.formal)} 台・第 1 名不變・戰神 T10 Pro 從第 5 升到第 2</p>`;
  }
  return `${applied}${why}
    <div class="cols2">
      <div><div class="sub-h"><span>權重</span><span class="legend"><span><i class="sw" style="background:var(--c-prog);height:4px"></i>改之前</span><span><i class="sw" style="background:var(--c-profile);height:8px"></i>改之後</span></span>${item(3)}</div>${wRows(a.weights, R.weightsBefore, DIM, 50)}</div>
      <div><div class="sub-h"><span>性能細項</span></div>${wRows(a.perfSubs, R.perfBefore, SUB, 60)}</div>
    </div>
    <div class="cols2">${cand}<div>${rankView(res)}</div></div>`;
}

/* ---------- 共用畫法：交出回覆 ---------- */
function replyView(c, { clip = false } = {}) {
  const text = c.args.text;
  const cards = (c.args.cards ?? []).map((k) => `<div class="ucard"><b>${k.type === 'recommend' ? '推薦卡' : k.type === 'compare' ? '對比卡' : esc(k.type)}</b>${k.ids.map((id) => esc(short(id))).join('、')}</div>`).join('');
  const body = clip ? `${esc(text.slice(0, 120))}…` : esc(text);
  return `<div class="bubble">${body}</div><div class="cardrow">${cards}</div>`;
}
function toolBody(c, opt = {}) {
  if (c.name === 'sql_query') return sqlView(c, opt);
  if (c.name === 'update_profile') return profileView(c, opt);
  if (c.name === 'reply') return replyView(c, opt);
  return '';
}
function rawView(c) {
  const args = JSON.stringify(c.args, null, 2), res = JSON.stringify(c.result, null, 2);
  return `<div class="raws"><details class="raw"><summary>參數原文（${n(jlen(c.args))} 字）</summary><pre>${esc(args)}</pre></details><details class="raw"><summary>交給模型的結果原文（${n(jlen(c.result))} 字）</summary><pre>${esc(res)}</pre></details></div>`;
}

/* ---------- 共用畫法：模型 ---------- */
function thinkView(rd, open) {
  const t = THINK[rd.n];
  return `<details class="think" ${open ? 'open' : ''}><summary><span class="lbl">模型的思考</span><span class="demo">示意</span>${item(4)}<span class="muted small prev">${esc(t.slice(0, 34))}…</span></summary><div class="body"><p>${esc(t)}</p><p class="small muted">示意文字：現在的系統沒有存思考內容。v1.0.49 起會記下模型真正的思考（每回合最多 2 萬字），還有思考用掉多少 token。</p></div></details>`;
}
const saidView = (rd) => (rd.text ? `<blockquote class="said">${esc(rd.text)}</blockquote>` : '<p class="small muted">這回合沒有說話，直接呼叫工具。</p>');
const sentLine = (rd) => (rd.n === 1
  ? `送出：說明書 ${n(R.contextChars)} 字＋用戶訊息`
  : `送出：上一回合的工具結果 ${n(rd.sentChars)} 字（說明書照樣整份重送）`);

/* ---------- 說明書與 token ---------- */
function partsView() {
  const parts = [...R.parts].sort((a, b) => b.chars - a.chars);
  const total = parts.reduce((a, p) => a + p.chars, 0), max = parts[0].chars;
  return `<div class="parts">${parts.map((p) => `<details class="part ${p.kind}"><summary><span class="pl" title="${esc(p.head ?? p.name)}">${esc(p.name)}</span><span class="pt"><i style="width:${(p.chars / max) * 100}%"></i></span><span class="pv">${n(p.chars)} 字・${pct(p.chars, total)}</span></summary><pre>${esc(p.excerpt)}${p.chars > p.excerpt.length ? '\n…（點開正式版可看全文）' : ''}</pre></details>`).join('')}</div>`;
}
function tokenView() {
  const base = R.rounds[0].inTok;
  const max = 30000;
  const rows = R.rounds.map((rd) => {
    const extra = rd.inTok - base;
    return `<div class="tokrow" data-tip="${esc(`<b>${n(rd.inTok)} token</b>　第 ${rd.n} 回合讀入<br>說明書與用戶訊息 約 ${n(base)}<br>之前回合累積 ${n(extra)}<br>寫出 ${n(rd.outTok)} token`)}"><span>第 ${rd.n} 回合</span><span class="toktrack"><i style="width:${(base / max) * 100}%;background:var(--c-ctx)"></i>${extra > 0 ? `<i style="width:${(extra / max) * 100}%;background:var(--c-acc)"></i>` : ''}</span><span class="num muted">${n(rd.inTok)}</span></div>`;
  }).join('');
  const sum = R.totals.inputTokens, rep = base * R.rounds.length;
  return `<div class="legend"><span><i class="sw" style="background:var(--c-ctx)"></i>說明書＋用戶訊息（每回合重送）</span><span><i class="sw" style="background:var(--c-acc)"></i>之前回合累積的工具結果與回覆</span></div>
    <div class="tokrows">${rows}</div>
    <div class="tokaxis"><span></span><div><span>0</span><span>10K</span><span>20K</span><span>30K</span></div><span></span></div>
    <p class="insight">${R.rounds.length} 回合共讀入 ${n(sum)} token，其中約 ${n(rep)}（${pct(rep, sum)}）是每回合重送的說明書。</p>`;
}
function contextBlock() {
  return `<div class="ctxgrid">
    <div><div class="sec-title">說明書組成 <span class="muted">${n(R.contextChars)} 字，點一段看內容</span>${item(5)}</div><div class="legend" style="margin:4px 0 6px"><span><i class="sw" style="background:var(--c-ctx)"></i>固定規則</span><span><i class="sw" style="background:var(--c-acc)"></i>每輪變動的資料</span></div>${partsView()}</div>
    <div><div class="sec-title">每回合讀入多少 token ${item(5)}</div>${tokenView()}</div>
  </div>`;
}

/* ---------- 共用：外框 ---------- */
function frame(inner, opts = {}) {
  const folded = ['模型抽取結果', '需求檔案的變化', '候選與結果', '前 5 名各維度貢獻', '回覆', '模型呼叫', '權重變化表', '追問決策', '局勢報告', '原始資料'];
  return `<div class="frame ${document.getElementById('opt-narrow').checked ? 'narrow' : ''}">
    ${opts.stats ? '<div class="frame-bar"><b>後台</b><span class="sep">›</span>對話檢視<span class="sep">›</span><b>代理分析</b></div>' : '<div class="frame-bar"><b>後台</b><span class="sep">›</span>對話紀錄<span class="sep">›</span>預算 4 萬，平常上課寫報告…<span class="sep">›</span><b>第 5 輪</b></div>'}
    <div class="frame-body">
      ${opts.stats ? '' : `<div class="run-head"><h3>第 5 輪</h3><span class="pill ok">推薦</span><span class="muted small">2026/11/11 10:09・14,412 毫秒・方案：代理方案</span></div>

      <div class="note"><b>第 1 項：</b>代理方案的輪次，執行過程直接放在用戶原文下面。原本排在前面的 10 個區塊，代理方案大多用不到，改成收起來放在最下面。</div>`}
      ${inner}

function summaryBar() {
  return `<div class="sumbar">

    <div class="stat"><span>回合</span><b>${R.totals.rounds}</b></div>
    <div class="stat"><span>工具</span><b>${R.totals.toolCalls} <small>次・錯 1</small></b></div>
    <div class="stat"><span>整輪</span><b>${sec(R.ms)}</b></div>
    <div class="stat"><span>等模型</span><b>${pct(MODEL_MS, R.ms)}</b></div>
    <div class="stat"><span>讀入／寫出 token</span><b>${n(R.totals.inputTokens)} <small>／ ${n(R.totals.outputTokens)}</small></b></div>

}

/* ================= A 時間軸瀑布 ================= */
function waterfall() {
  const tick = (2000 / TOTAL) * 100;
  const ticks = [];
  for (let s = 0; s * 1000 <= TOTAL; s += 2) ticks.push(`<span class="wf-tick" style="left:${((s * 1000) / TOTAL) * 100}%">${s} 秒</span>`);
  const rows = STEPS.map((s) => {
    const left = (s.start / TOTAL) * 100, w = (s.ms / TOTAL) * 100;
    const flip = left + w > 82;
    const val = `<span class="wf-val" style="${flip ? `right:calc(${100 - left}% + 6px)` : `left:calc(${left + w}% + 6px)`}">${sec(s.ms)}${s.c ? `・${esc(toolShort(s.c))}` : ''}</span>`;
    const icon = s.c && s.c.status !== 'ok' ? '<span class="pill bad" style="padding:0 5px">錯</span>' : '';
    return `<div class="wf-row ${s.child ? 'child' : ''}" data-row="${s.key}"><div class="wf-lab">${kdot(s.kind)}<span>${esc(s.label)}</span>${icon}</div><div class="wf-track" style="--tick:${tick}%"><button type="button" class="wf-bar ${s.c && s.c.status !== 'ok' ? 'err' : ''}" style="--k:${KIND[s.kind].color};left:${left}%;width:${w}%" data-goto="${s.key}" data-tip="${esc(stepTip(s))}" aria-label="${esc(`${s.label} ${sec(s.ms)}`)}"></button>${val}</div></div>`;
  }).join('');
  return `<div class="wf"><div class="wf-row wf-axis"><div class="wf-lab"></div><div class="wf-track">${ticks.join('')}</div></div>${rows}</div>`;
}
function roundCardsA() {
  return R.rounds.map((rd) => `
    <section class="round" id="a-m${rd.n}">
      <div class="round-h"><h4>${kdot('model')} 第 ${rd.n} 回合</h4><span class="meta">模型 ${sec(rd.ms)}・讀入 ${n(rd.inTok)}・寫出 ${n(rd.outTok)} token</span><span class="meta faint">${sentLine(rd)}</span></div>
      ${thinkView(rd, false)}
      ${saidView(rd)}
      <div class="calls">${rd.calls.map((c, j) => `
        <article class="call" id="a-c${rd.n}-${j}">
          <div class="call-h"><span class="ktag">${kdot(c.name)}${esc(KIND[c.name].label)}</span><span class="mono">${esc(c.name)}</span>${statusPill(c.status)}<span class="muted small num">${sec(c.ms)}</span><span class="sum">${esc(c.summary)}</span></div>
          <div class="call-b">${toolBody(c)}${rawView(c)}</div>
        </article>`).join('')}</div>
    </section>`).join('');
}
function planA() {
  return `<div class="plan-head"><h2>A　時間軸瀑布</h2><p>最上面一張瀑布圖：每一列是一步，橫條長度就是花的時間。滑過看細節，點一下跳到下面那一步。下面照順序列出每個回合：模型的思考、說的話、每個工具的看懂版。和瀏覽器開發者工具的「網路」分頁很像，適合找「慢在哪、錯在哪」。</p></div>
  ${frame(`
    <div class="sec-title">代理執行過程 ${item(2)}</div>
    ${summaryBar()}

    ${waterfall()}
    <div class="note"><b>第 2 項：</b>一眼看出 14.4 秒幾乎都在等模型（藍條），工具都只有幾十毫秒。第 1 回合的 SQL 有紅框，點它直接跳到那張卡。</div>

/* ================= B 左右檢視器 ================= */
let bSel = null, bTab = null;
function bNodes() {
  const nodes = [{ key: 'ctx', kind: 'prog', label: '說明書', meta: `${n(R.contextChars)} 字`, sep: '交給模型的資料' }];
  for (const s of STEPS) nodes.push({ ...s, meta: sec(s.ms), sep: s.key === 'prep' ? '執行順序' : undefined });
  return nodes;
}
function bTree(nodes) {
  return nodes.map((s) => {
    const left = s.start != null ? (s.start / TOTAL) * 100 : 0, w = s.ms != null ? (s.ms / TOTAL) * 100 : 0;
    const bad = s.c && s.c.status !== 'ok';
    return `${s.sep ? `<div class="tree-sep">${s.sep}</div>` : ''}<button type="button" class="node ${s.child ? 'child' : ''}" role="option" aria-selected="${s.key === bSel}" data-node="${s.key}" style="--k:${KIND[s.kind].color}">${kdot(s.kind)}<span class="nl">${esc(s.label)}${bad ? ' <span class="bad">✕</span>' : ''}</span><span class="nm">${esc(s.meta)}</span>${s.start != null ? `<span class="nb"><i style="left:${left}%;width:${w}%"></i></span>` : '<span class="nb" style="background:none"></span>'}</button>`;
  }).join('');
}
function bDetail(nodes) {
  const s = nodes.find((x) => x.key === bSel);
  const tabsOf = (list) => `<div class="dtabs" role="tablist">${list.map(([id, label]) => `<button type="button" class="dtab" role="tab" data-dtab="${id}" aria-selected="${id === bTab}">${label}</button>`).join('')}</div>`;
  if (s.key === 'ctx') {
    bTab = bTab && ['parts', 'tokens'].includes(bTab) ? bTab : 'parts';
    return `<div class="detail-h">${kdot('prog')}<h4>說明書</h4><span class="muted small">${n(R.contextChars)} 字・每回合都整份送給模型</span>${item(5)}</div>
      ${tabsOf([['parts', '組成'], ['tokens', '每回合 token']])}
      ${bTab === 'parts' ? partsView() : tokenView()}`;
  }
  if (!s.rd) {
    return `<div class="detail-h">${kdot('prog')}<h4>${esc(s.label)}</h4><span class="muted small">${sec(s.ms)}・程式自己做，不叫模型</span></div>
      <div class="tblwrap"><table><thead><tr><th>步驟</th><th class="r">耗時</th></tr></thead><tbody>${s.laps.map((l) => `<tr><td>${esc(l.name)}</td><td class="r">${n(l.ms)} 毫秒</td></tr>`).join('')}</tbody></table></div>
      ${s.key === 'prep' ? `<p class="small">${esc(R.preStep)}</p>` : '<p class="small muted">整理卡片、算局勢報告、存檔。之後用戶就看到回覆。</p>'}`;
  }
  if (!s.c) {
    const rd = s.rd;
    bTab = bTab && ['think', 'said', 'sent'].includes(bTab) ? bTab : 'think';
    const body = bTab === 'think' ? thinkView(rd, true) : bTab === 'said' ? saidView(rd) + `<p class="small muted">這回合呼叫了 ${rd.calls.length} 個工具：${rd.calls.map((c) => KIND[c.name].label).join('、')}</p>` : `<p class="small">${sentLine(rd)}</p><p class="small muted">讀入 ${n(rd.inTok)} token・寫出 ${n(rd.outTok)} token・耗時 ${sec(rd.ms)}</p>${tokenView()}`;
    return `<div class="detail-h">${kdot('model')}<h4>第 ${rd.n} 回合・模型</h4><span class="muted small num">${sec(rd.ms)}・讀入 ${n(rd.inTok)}・寫出 ${n(rd.outTok)}</span></div>
      ${tabsOf([['think', '思考'], ['said', '說的話'], ['sent', '送出內容']])}${body}`;
  }
  const c = s.c;
  bTab = bTab && ['view', 'args', 'res'].includes(bTab) ? bTab : 'view';
  const body = bTab === 'view' ? toolBody(c, { rows: 20 }) : `<pre class="sql" style="background:var(--sunk);color:var(--ink)">${esc(JSON.stringify(bTab === 'args' ? c.args : c.result, null, 2))}</pre>`;
  return `<div class="detail-h">${kdot(c.name)}<h4>${esc(KIND[c.name].label)}</h4><span class="mono muted">${esc(c.name)}</span>${statusPill(c.status)}<span class="muted small num">第 ${s.rd.n} 回合・${sec(c.ms)}</span></div>
    <p class="small">${esc(c.summary)}</p>
    ${tabsOf([['view', '看懂版'], ['args', `參數原文（${n(jlen(c.args))} 字）`], ['res', `結果原文（${n(jlen(c.result))} 字）`]])}${body}`;
}

const CARD_LABEL = { requirements: '需求卡', count: '候選數量卡', recommend: '推薦卡', compare: '對比卡', followup: '追問卡', suggest: '建議回覆', relax: '放寬建議', skip_note: '跳過說明', ask_preference: '偏好比較卡' };

/* 一輪的時間步驟 */
function stepsOf(t) {
  const laps = t.timings ?? [];
  const isRound = (l) => l.name.startsWith('代理第');
  const first = laps.findIndex(isRound);
  const last = first < 0 ? -1 : laps.length - 1 - [...laps].reverse().findIndex(isRound);
  const pre = first < 0 ? laps : laps.slice(0, first), post = first < 0 ? [] : laps.slice(last + 1);
  const steps = [];
  let cur = pre.reduce((a, l) => a + l.ms, 0);
  steps.push({ key: 'prep', kind: 'prog', start: 0, ms: cur, laps: pre });
  for (const rd of t.rounds) {
    const lap = laps.find((l) => l.name === `代理第 ${rd.n} 回合`)?.ms ?? rd.ms + rd.calls.reduce((a, c) => a + c.ms, 0);
    steps.push({ key: `m${rd.n}`, kind: 'model', start: cur, ms: rd.ms, rd });
    let u = cur + rd.ms;
    rd.calls.forEach((c, j) => { steps.push({ key: `c${rd.n}-${j}`, kind: c.name, start: u, ms: c.ms, rd, c }); u += c.ms; });
    cur += lap;
  }
  steps.push({ key: 'post', kind: 'prog', start: cur, ms: post.reduce((a, l) => a + l.ms, 0), laps: post });
  return { steps, total: Math.max(t.ms, ...steps.map((s) => s.start + s.ms)) };
}

/* 自動找問題（程式規則） */
const suspicious = (c) => (/discrete_gpu_model/.test(c.args?.sql ?? '') && Array.isArray(c.result?.rows) ? c.result.rows.filter((r) => r.discrete_gpu_model === '無') : []);
function issuesOf(t) {
  const out = [];
  for (const rd of t.rounds) {
    if (rd.error) out.push({ ev: `c-m${rd.n}`, sev: 'bad', title: '模型呼叫失敗', detail: rd.error.replace(/\s*\(attempted.*$/, '') });
    if (rd.ms > 10000 && !rd.error) out.push({ ev: `c-m${rd.n}`, sev: 'warn', title: `模型這回合想了 ${sec(rd.ms)}`, detail: `其他回合多半 2～5 秒；這回合寫出 ${n(rd.outTok)} token。記錄思考內容後就能看出它在想什麼。` });
    if (rd.truncated) out.push({ ev: `c-m${rd.n}`, sev: 'bad', title: '模型輸出被截斷', detail: '輸出超過上限，後面的內容沒收到。' });
    rd.calls.forEach((c, j) => {
      const res = c.result ?? {};
      const evRes = `c-r${rd.n}-${j}`, evCall = c.name === 'reply' ? evRes : `c-c${rd.n}-${j}`;
      if (/自動修正/.test(c.summary)) out.push({ ev: evCall, sev: 'info', title: '參數 JSON 結尾多了括號，程式自動修正', detail: '這輪照常跑完。DeepSeek 長參數常犯這個小錯。' });
      if (c.name === 'sql_query') {
        if (c.status !== 'ok') {
          const bad = colErr(res.error), hint = /Perhaps you meant to reference the column "(?:\w+\.)?(\w+)"/.exec(res.error ?? '')?.[1];
          out.push({ ev: evRes, sev: 'bad', title: bad ? `SQL 欄位「${bad}」不存在` : 'SQL 查詢失敗', detail: `${hint ? `資料庫提示可能是「${hint}」。` : ''}模型要在下一回合自己改 SQL 重查。` });
        } else if (Array.isArray(res.rows)) {
          const sus = suspicious(c);
          if (sus.length) out.push({ ev: evRes, sev: 'warn', title: `想排除沒有獨顯的機型，結果卻有 ${sus.length} 列獨顯型號是「無」`, detail: 'SQL 只排除了含「內」的值，表格裡黃底的就是。' });
          if (!res.rows.length) out.push({ ev: evRes, sev: 'warn', title: 'SQL 查到 0 列', detail: '' });
          if (res.truncated) out.push({ ev: evRes, sev: 'info', title: 'SQL 結果超過上限，已截斷', detail: '' });
        }
      }
      if (c.name === 'update_profile' && (res.rejected ?? []).length) {
        out.push({ ev: evRes, sev: 'warn', title: `改需求被拒絕 ${res.rejected.length} 條`, detail: [...new Set(res.rejected.map((x) => x.why))].join('；') });
      }
    });
  }
  if (t.replySource === 'fallback') out.push({ ev: 'c-post', sev: 'bad', title: '用戶收到程式的固定文案', detail: '模型沒有交出回覆，程式改用固定的一句話。' });
  if ((t.dropped ?? []).length) out.push({ ev: 'c-post', sev: 'warn', title: `有 ${t.dropped.length} 張卡片被程式拿掉`, detail: t.dropped.join('；') });
  return out;
}

function tokenT(t) {

/* 改需求：用「這次呼叫之前」的狀態比較 */

function bodyCallT(c) {

    const ops = (a.ops ?? []).map((o) => {
      const valid = o.op === 'upsert' || o.op === 'delete';
      const label = o.req?.label ?? o.label ?? o.id ?? '';
      const verb = o.op === 'upsert' ? '新增或修改' : o.op === 'delete' ? '刪除' : esc(o.op);
      const tag = o.req ? `<span class="${o.req.hard ? 'hard' : 'soft'}">${o.req.hard ? '硬條件' : '偏好'}</span>` : '';

function cardViewT(k) {

function planC() {
  const t = curTurn();

  ev.push({ id: 'c-prep', chip: 'c-prep', card: 'prog', busy: 'prog', from: 'prog', to: 'model', verb: '準備好，交給模型', at: 0, ms: prep.ms, body: bodyPrepT(t, prep) });

  // 問題照出現順序排

  const iss = issuesOf(t).sort((a, b) => (order.get(a.ev) ?? 0) - (order.get(b.ev) ?? 0));
  const chipSev = (ids) => { const xs = iss.filter((x) => ids.includes(x.ev)); return xs.some((x) => x.sev === 'bad') ? 'err' : xs.some((x) => x.sev === 'warn') ? 'warn' : ''; };

  const chips = [`<span class="st" data-goto-c="c-user">${kdot('prog')}用戶${t.preStep ? '按按鈕' : '打字'}</span>`, `<span class="ar">→</span><span class="st" data-goto-c="c-prep">${kdot('prog')}程式準備</span>`];
  for (const rd of t.rounds) {

      const lab = c.name === 'sql_query' ? (c.status === 'ok' ? `SQL ${c.result?.rows?.length ?? 0} 列` : 'SQL 失敗') : c.name === 'update_profile' ? (c.status === 'ok' ? '改需求' : '改需求 ✕') : c.name === 'reply' ? '交出回覆' : (KIND[c.name]?.label ?? c.name);

    <div class="sq">${rows}</div>
    <div class="endsum">
      <div class="sec-title">整輪結算</div>
      <div class="legend"><span><i class="sw" style="background:var(--c-model)"></i>等模型 ${sec(modelMs)}（${pct(modelMs, t.ms)}）</span><span><i class="sw" style="background:var(--c-sql)"></i>工具 ${sec(toolMs)}</span><span><i class="sw" style="background:var(--c-prog)"></i>程式 ${sec(progMs)}</span></div>

}

/* 劇情列跟著捲動 */

  const model = T.reduce((a, t) => a + t.modelMs, 0), tool = T.reduce((a, t) => a + t.toolMs, 0);

function flash(el) {
  if (!el) return;
  el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');

view.addEventListener('click', (e) => {
  const t = e.target.closest('[data-goto],[data-node],[data-dtab],[data-showmore],[data-goto-c],[data-turn],[data-turnstep],[data-issue],[data-inav],[data-ai]');
  if (!t) return;
  if (t.dataset.goto) {
    const k = t.dataset.goto;
    const id = k.startsWith('m') ? `a-${k}` : k.startsWith('c') ? `a-${k}` : null;
    if (id) flash(document.getElementById(id));
    return;
  }
  if (t.dataset.node) { bSel = t.dataset.node; bTab = null; render(); document.querySelector(`[data-node="${bSel}"]`)?.focus(); return; }
  if (t.dataset.dtab) { bTab = t.dataset.dtab; render(); return; }
  if (t.dataset.showmore) { view.querySelectorAll(`[data-more="${t.dataset.showmore}"]`).forEach((r) => { r.hidden = false; }); t.remove(); return; }
  if (t.dataset.gotoC) { flash(document.getElementById(t.dataset.gotoC)); return; }
  if (t.dataset.turnstep) { const i = T2.findIndex((x) => x.id === cTurnId) + Number(t.dataset.turnstep); if (T2[i]) openTurn(T2[i].id); return; }
  if (t.dataset.issue) { gotoIssue(Number(t.dataset.issue)); return; }
  if (t.dataset.inav) { gotoIssue(cIssue < 0 && Number(t.dataset.inav) > 0 ? 0 : cIssue + Number(t.dataset.inav)); return; }
  if (t.dataset.ai !== undefined) { aiOpen = !aiOpen; render(); return; }
  if (t.dataset.turn) { e.preventDefault(); openTurn(t.dataset.turn, !!t.dataset.jump); }
});
view.addEventListener('change', (e) => {
  if (e.target.id === 'f-issue') { onlyIssues = e.target.checked; render(); }
  if (e.target.id === 'c-turn') openTurn(e.target.value);
});
view.addEventListener('keydown', (e) => {
  if (plan !== 'b' || !['ArrowDown', 'ArrowUp'].includes(e.key) || !e.target.closest('.tree')) return;
  e.preventDefault();
  const keys = bNodes().map((x) => x.key);
  const i = keys.indexOf(bSel);
  bSel = keys[Math.max(0, Math.min(keys.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
  bTab = null; render();
  document.querySelector(`[data-node="${bSel}"]`)?.focus();
});
view.addEventListener('mouseover', (e) => {
  const row = e.target.closest('[data-goto]');
  document.querySelectorAll('.wf-row.hl').forEach((r) => r.classList.remove('hl'));
  if (row) row.closest('.wf-row')?.classList.add('hl');
});

/* 浮動說明（滑鼠與鍵盤都有） */
const tip = document.getElementById('tip');
function showTip(el, x, y) {
  tip.innerHTML = el.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${Math.min(window.innerWidth - w - 8, Math.max(8, x + 12))}px`;
  tip.style.top = `${y + h + 20 > window.innerHeight ? y - h - 12 : y + 16}px`;
}
document.addEventListener('pointermove', (e) => {
  const el = e.target.closest?.('[data-tip]');
  if (!el) { tip.hidden = true; return; }
  showTip(el, e.clientX, e.clientY);
});
document.addEventListener('focusin', (e) => {
  const el = e.target.closest?.('[data-tip]');
  if (!el) { tip.hidden = true; return; }
  const r = el.getBoundingClientRect(); showTip(el, r.left, r.bottom - 8);
});
document.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

render();
})();
</script>
</body>
