<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 筆電選購助手 · 用戶端 Demo</title>
<style>
:root{--bg:#eef1ee;--panel:#fff;--ink:#17201c;--muted:#66726c;--line:#dfe5e1;--soft:#f4f6f4;--brand:#17725a;--brand-soft:#e3f1ec;--side:#14211c;--side-ink:#e8efeb;--side-muted:#8fa299;--warn:#a65f00;--warn-soft:#fdf1dc;--bad:#b3362b;--bad-soft:#fbe9e7;--r:12px;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
h1,h2,h3,h4,p{margin:0}
small{color:var(--muted);font-size:12.5px}
.app{display:grid;grid-template-columns:236px minmax(320px,400px) minmax(0,1fr);height:100vh;height:100dvh}
.app.mini{grid-template-columns:56px minmax(320px,400px) minmax(0,1fr)}
.rail{display:none;flex-direction:column;align-items:center;gap:6px}
.app.mini .side{padding:12px 8px;overflow:hidden}.app.mini .full{display:none}.app.mini .rail{display:flex}
.rail button{width:40px;height:40px;border-radius:9px;font-size:18px;color:var(--side-ink)}.rail button:hover,.fold:hover{background:#ffffff1c}
.logo-row{display:flex;align-items:flex-start;gap:6px}.logo-row .logo{flex:1;min-width:0}
.fold{flex:0 0 32px;height:32px;border-radius:8px;font-size:16px;color:var(--side-ink);border:1px solid #ffffff33}
.res-top{display:flex;align-items:center;gap:10px;width:100%}.res-top .count{flex:1;min-width:0}
.wbtn{flex:none;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand);border-radius:9px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.wbtn.on{background:var(--brand);color:#fff}
.tabs .wbtn{display:none}
.heavy{background:#fdecd8;color:#9a5b00}
.edit-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}.edit-row input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.old-ask{color:var(--muted);font-size:13px}
.tag .fix{color:var(--brand);font-size:12.5px;margin-left:2px}
/* 側欄 */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:16px 12px;overflow:auto;min-width:0}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px 14px}
.logo b{display:block;font-size:15px}.logo small{color:var(--side-muted)}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font:700 12px/1 sans-serif;color:#fff;flex:none}
.sbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;color:var(--side-ink);font-size:14px}
.sbtn:hover{background:#ffffff14}
.sbtn.new{background:#ffffff1c;font-weight:600;margin-bottom:12px}
.sbtn em{margin-left:auto;font-style:normal;font-size:12px;background:var(--brand);color:#fff;border-radius:99px;padding:0 7px}
.sbtn small{color:var(--side-muted);display:block}
.stitle{color:var(--side-muted);font-size:12px;padding:12px 10px 4px}
.side-end{margin-top:auto;padding-top:12px}
/* 對話 */
.chat{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}
.chat-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat-head b{display:block}
.player{display:none;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand);font-size:13px;padding:7px 16px}
.player.on{display:flex}.player button{margin-left:auto;font-weight:600;text-decoration:underline}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.welcome h2{font-size:22px;line-height:1.3}.welcome p{color:var(--muted);margin:6px 0 14px}
.eg{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:14px}
.eg:hover{border-color:var(--brand)}
.base{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.base h4{font-size:14px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:13.5px;background:#fff}
.chip:hover{border-color:var(--brand)}.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.m{max-width:92%}.m.u{align-self:flex-end;background:var(--brand);color:#fff;border-radius:14px 14px 3px 14px;padding:8px 12px}
.m.a{align-self:stretch;max-width:100%}
.m.a>p{margin-bottom:6px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;background:var(--soft);font-size:14px}
.card h4{font-size:14px;margin-bottom:5px}
.card.warn{background:var(--warn-soft);border-color:#eed9b0}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.fb{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--muted);font-size:13px}
.lnk{color:var(--brand);text-decoration:underline;font-size:13px}
.input{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.input textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;height:42px;min-width:0}
.btn{background:var(--brand);color:#fff;border-radius:9px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
/* 結果 */
.res{display:flex;flex-direction:column;min-height:0;min-width:0}
.res-head{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.count{margin-right:auto;min-width:0}.count b{font-size:21px;color:var(--brand);margin:0 3px}
.search{border:1px solid var(--line);border-radius:9px;padding:6px 10px;width:190px;max-width:100%;background:#fff}
select{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff;max-width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{padding:6px 10px;font-size:13.5px;background:#fff}.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.res-body{flex:1;overflow:auto;padding:14px 16px 90px}
.brief{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.brief h3{font-size:15px;margin-bottom:7px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brief h3 span{margin-left:auto;display:flex;gap:10px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--brand-soft);border:1px solid transparent;border-radius:8px;padding:3px 8px;font-size:13.5px;max-width:100%}
.tag.soft{background:#fff;border:1px dashed #b5c2bb}
.tag small{font-size:11.5px}.tag button{color:var(--muted);font-size:14px;line-height:1;padding:0 2px}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}
.trail{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:13px}
.trail b{color:var(--brand)}.trail s{text-decoration:none;color:var(--bad)}
.sec{font-size:15px;font-weight:700;margin:16px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec small{font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.lp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lp.hero{border:2px solid var(--brand);grid-column:1/-1}
.lp.off{opacity:.62}
.lp h4{font-size:15px;line-height:1.35;overflow-wrap:anywhere;text-align:left}
.lp h4 button{font-weight:700;text-align:left}.lp h4 button:hover{color:var(--brand)}
.rank{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;font-size:12px;padding:0 6px;margin-bottom:3px}
.rank.alt{background:#4f6058}
.sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{background:var(--soft);border-radius:6px;padding:1px 7px;font-size:12.5px}
.price{font-size:17px;font-weight:700}
.score{font-size:13px;color:var(--brand);font-weight:600;margin-left:8px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.acts{margin-top:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:4px}
.mini{border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:13px;background:#fff}
.mini.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.mini.q{border-color:transparent;color:var(--muted)}
.why{font-size:13.5px;margin:0;padding-left:17px}.why li{margin:1px 0}
.bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:3px 12px;font-size:12px}
.bar{display:grid;grid-template-columns:30px 1fr 24px;gap:5px;align-items:center}
.bar i{height:5px;border-radius:9px;background:var(--line);overflow:hidden;display:block}.bar i u{display:block;height:100%;background:var(--brand)}
.vs{font-size:13px;color:var(--muted)}
.judge{background:var(--soft);border-radius:9px;padding:9px 10px;font-size:13px}
.judge table,.tbl{width:100%;border-collapse:collapse}
.judge td,.judge th{padding:2px 4px;text-align:left}.judge th{color:var(--muted);font-weight:500}
.ok{color:var(--brand);font-weight:600}.no{color:var(--bad);font-weight:600}.near{color:var(--warn);font-weight:600}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border:0}
.li>button{text-align:left;font-weight:600;overflow-wrap:anywhere}
.group{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden}
.group summary{padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600}
.group div{padding:6px 12px;border-top:1px solid var(--line);font-size:13.5px;display:flex;justify-content:space-between;gap:10px}
.group div button{text-align:left;overflow-wrap:anywhere}
.tray{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:var(--side);color:#fff;border-radius:12px;padding:8px 10px;display:none;align-items:center;gap:8px;z-index:5;box-shadow:0 8px 24px #0003}
.tray.on{display:flex}.tray .items{display:flex;gap:5px;flex:1;min-width:0;overflow:hidden}
.tray .it{background:#ffffff22;border-radius:7px;padding:2px 7px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.tray .it button{color:#fff;margin-left:4px}
.res{position:relative}
/* 抽屜 */
.mask{position:fixed;inset:0;background:#0005;z-index:9;display:none}.mask.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:10;transform:translateX(102%);visibility:hidden;transition:transform .18s;display:flex;flex-direction:column}
.sheet.on{transform:none;visibility:visible}.sheet.wide{width:min(860px,100%)}
.sheet-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sheet-h h3{font-size:17px;overflow-wrap:anywhere}.sheet-h button{margin-left:auto;font-size:22px;line-height:1;padding:0 4px}
.sheet-b{flex:1;overflow:auto;padding:14px 16px}
.sheet-f{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet-f .btn:last-child{margin-left:auto}
.w{margin-bottom:12px}.w label{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.w input{width:100%;accent-color:var(--brand)}
.w small{display:block}
.fg{margin-bottom:14px}.fg h4{font-size:14px;margin-bottom:6px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set small{display:block}
.tw{overflow-x:auto}.tbl{min-width:520px;font-size:13.5px}.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th:first-child,.tbl td:first-child{color:var(--muted);white-space:nowrap}
.best{color:var(--brand);font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--side);color:#fff;padding:7px 14px;border-radius:9px;font-size:14px;z-index:20;display:none;max-width:90%}
.toast.on{display:block}
.tabs{display:none}
@media (max-width:1023px){
 .app,.app.mini{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 .tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
 .tabs button{flex:1;padding:10px 4px;font-size:14px}.tabs button.on{color:var(--brand);font-weight:700;box-shadow:inset 0 -2px var(--brand)}
 .tabs .menu{flex:0 0 44px;font-size:18px}
 .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:8;transform:translateX(-102%);visibility:hidden;transition:transform .18s}
 .side.open{transform:none;visibility:visible}
 .app.mini .side{padding:16px 12px;overflow:auto}.app.mini .full{display:block}.app.mini .rail{display:none}
 .tabs .wbtn{display:block;flex:none;margin-right:8px;padding:5px 9px;font-size:13px;box-shadow:none}.res-top .wbtn{display:none}
 .chat,.res{display:none;border:0}.app[data-tab=chat] .chat,.app[data-tab=res] .res{display:flex}
 .search{width:100%;order:9}
}
</style>
</head>
<body>
<div class="app" id="app" data-tab="chat">
  <div class="tabs"><button class="menu" data-a="menu" aria-label="開啟選單">☰</button><button data-a="tab" data-v="chat" id="t-chat" class="on">對話</button><button data-a="tab" data-v="res" id="t-res">機型</button><button class="wbtn" data-a="weights" id="w-m">⚖ 權重</button></div>
  <aside class="side" id="side"></aside>
  <main class="chat">
    <div class="chat-head"><div><b>選購對話</b><small>直接說需求，說錯了隨時改</small></div></div>
    <div class="player" id="player"><span id="playerT">示範播放中</span><button data-a="stop">停止</button></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="input"><textarea id="txt" placeholder="例如：預算 5 萬，剪片，每天背去上課" aria-label="輸入你的需求"></textarea><button class="btn" id="send" data-a="send">送出</button></div>
  </main>
  <section class="res">
    <div class="res-head">
      <div class="res-top"><div class="count" id="count"></div><button class="wbtn" data-a="weights" id="w-d">⚖ 權重</button></div>
      <input class="search" id="q" type="search" placeholder="搜尋品牌、型號、處理器、顯卡" aria-label="搜尋機型">
      <select id="sort" aria-label="排序"><option value="fit">按合適程度</option><option value="asc">價格低到高</option><option value="desc">價格高到低</option><option value="kg">重量輕到重</option></select>
      <button class="mini" data-a="filters" style="padding:6px 10px">篩選</button>
      <div class="seg"><button data-a="layout" data-v="card" id="l-card">卡片</button><button data-a="layout" data-v="list" id="l-list">清單</button></div>
    </div>
    <div class="res-body" id="body"></div>
    <div class="tray" id="tray"></div>
  </section>
</div>
<div class="mask" id="mask" data-a="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

function rebalance(w,k,val){const o=DK.filter(x=>x!==k),v=Math.max(1,Math.min(94,Math.trunc(val))),rest=o.reduce((a,x)=>a+w[x],0)||1,r={...w};o.forEach(x=>{r[x]=Math.max(1,Math.round((100-v)*w[x]/rest))});r[k]=v;let d=100-DK.reduce((a,x)=>a+r[x],0);for(let i=0;d&&i<200;i++){const x=o[i%o.length];if(d>0){r[x]++;d--}else if(r[x]>1){r[x]--;d++}}return r}
function events(){const e=[];for(const r of S.reqs){if(r.field==="purpose"&&RULES.purpose[r.value])e.push(["a:"+r.value,"用途："+r.value,RULES.purpose[r.value]]);if(r.field==="portability")e.push(["b:"+r.value,r.label,RULES.portability[r.value]]);if(r.field==="priority")e.push(["c:"+r.value,"你說重視"+DL[r.value],{[r.value]:6}]);if(r.field==="software"&&SW[r.value])e.push(["d:"+r.value,"軟體："+r.value,SW[r.value].d])}return e.sort((a,b)=>a[0]<b[0]?-1:1)}
function combine(d){const raw=DK.map(k=>Math.max(1,BASE[k]+(d[k]||0))),sum=raw.reduce((a,b)=>a+b,0),low=DK.map(k=>(d[k]||0)>0?BASE[k]:1),sc=raw.map((v,i)=>Math.max(low[i],v*100/sum)),ex=sc.reduce((a,b)=>a+b,0)-100,room=sc.reduce((a,v,i)=>a+v-low[i],0),fair=sc.map((v,i)=>room>0?v-ex*(v-low[i])/room:v),ints=fair.map(v=>Math.floor(v+1e-9)),ord=fair.map((v,i)=>({i,r:v-ints[i]})).sort((a,b)=>b.r-a.r||a.i-b.i);let n=100-ints.reduce((a,b)=>a+b,0);for(let j=0;n>0;n--,j++)ints[ord[j%7].i]++;return Object.fromEntries(DK.map((k,i)=>[k,ints[i]]))}
function weights(){const d={},why=Object.fromEntries(DK.map(k=>[k,[]]));for(const[,label,e]of events())for(const[k,v]of Object.entries(e)){d[k]=(d[k]||0)+v;why[k].push(label)}const w=combine(d);return{w:S.manual||w,sys:w,why}}
const carry=()=>S.reqs.some(r=>r.field==="portability"&&r.value==="high");
const heavyCut=l=>carry()&&l.kg>2?Math.min(20,Math.round((l.kg-2)*200)/10):0;
const power=(l,w)=>{let n=0,d=0;for(const k of DK){const s=l.dims[k];if(s==null)continue;n+=s*w[k];d+=w[k]}return d?Math.max(0,Math.round((n/d-heavyCut(l))*10)/10):0};

/* ---------- 條件 ---------- */
function check(l,r){ // 回傳 ok / near / no / null（不適用）與說明
 const v=r.value;switch(r.field){
 case"budget":{if(v.max){const t=Math.max(v.max*.08,2000);if(l.price>v.max+t)return["no","超出預算"];if(l.price>v.max)return["near","略超預算"]}if(v.min){if(l.price<v.min-Math.max(v.min*.08,2000))return["no","低於預算下限"];if(l.price<v.min)return["near","略低於預算下限"]}return["ok","在預算內"]}
 case"size":{if(l.size==null)return null;const g=Math.abs(l.size-v);return g>1.2?["no",`尺寸不符（${l.size} 吋）`]:g>.5?["near",`尺寸接近（${l.size} 吋）`]:["ok",`${l.size} 吋`]}
 case"weight_max":{if(l.kg==null)return null;return l.kg>v+.15?["no",`太重（${l.kg} 公斤）`]:l.kg>v?["near",`略超重量（${l.kg} 公斤）`]:["ok",`${l.kg} 公斤`]}
 case"dgpu":return l.gpu?["ok","有獨立顯卡"]:["no","沒有獨立顯卡"];
 case"brand":return v.no?(l.brand.includes(v.no)?["no","品牌已排除"]:["ok","品牌符合"]):(l.brand.includes(v.only)?["ok","品牌符合"]:["no",`不是${v.only}`]);
 case"ram":return(l.ram||0)>=v?["ok",`${l.ram} GB 記憶體`]:["no",`記憶體只有 ${l.ram} GB`];
 case"software":{const s=SW[v];if(!s)return null;if((l.ram||0)<(s.ram||0))return["no",`記憶體低於 ${v} 最低需求`];if(s.vram&&(!l.gpu||(l.vram||0)<s.vram))return["no",`顯示記憶體低於 ${v} 最低需求`];return["ok",`符合 ${v} 最低需求`]}
 }return null}
const isHard=r=>r.hard||(r.field==="software"&&SW[r.value]);
function classify(l,reqs){const res=[];let st=1;for(const r of reqs){if(!isHard(r))continue;const c=check(l,r);if(!c)continue;if(c[0]==="no"){st=0;res.push({r,t:c[1]})}else if(c[0]==="near"&&st){st=.5;res.push({r,t:c[1]})}}return{st,res:st===0?res.filter(x=>check(l,x.r)[0]==="no"):res}}
function model(){
 const{w}=weights(),rows=L.map(l=>{if(S.excluded.includes(l.id))return{l,p:power(l,w),st:0,res:[{t:"你說不考慮這台"}]};const c=classify(l,S.reqs);return{l,p:power(l,w),st:c.st,res:c.res}});
 const fit=rows.filter(r=>r.st===1),near=rows.filter(r=>r.st===.5),out=rows.filter(r=>r.st===0);
 fit.sort((a,b)=>b.p-a.p||a.l.price-b.l.price);if(S.hold){const pos=new Map(S.hold.map((id,i)=>[id,i]));fit.sort((a,b)=>(pos.get(a.l.id)??1e9)-(pos.get(b.l.id)??1e9))}near.sort((a,b)=>b.p-a.p);out.sort((a,b)=>b.p-a.p);
 const pool=[...fit,...near],avg={};for(const k of DK){const v=pool.map(r=>r.l.dims[k]).filter(x=>x!=null);avg[k]=v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
 return{w,fit,near,out,avg}}
function pros(row,m){const r=DK.filter(k=>row.l.dims[k]!=null).map(k=>({k,gap:row.l.dims[k]-m.avg[k],imp:(row.l.dims[k]-m.avg[k])*m.w[k]})).sort((a,b)=>b.imp-a.imp);const t=x=>`${DL[x.k]} ${row.l.dims[x.k]} 分，${x.gap>=0?"高於":"低於"}符合條件機型的平均 ${Math.round(m.avg[x.k])} 分（這項佔你的考量 ${m.w[x.k]}%）`;return{pro:r.filter(x=>x.gap>.5).slice(0,3).map(t),con:r.filter(x=>x.gap<-.5).reverse().slice(0,2).map(t)}}
function funnel(){let pool=L.filter(l=>!S.excluded.includes(l.id));const steps=[];for(const r of S.reqs.filter(isHard)){const next=pool.filter(l=>{const c=check(l,r);return!c||c[0]!=="no"});steps.push({r,cut:pool.length-next.length,left:next.length});pool=next}return steps}
/* 衝突：拿掉哪一項能救回機型；也列出每項單獨能滿足幾台 */
function conflict(){const hard=S.reqs.filter(isHard);const fix=hard.map(r=>{const rest=S.reqs.filter(x=>x!==r),n=L.filter(l=>classify(l,rest).st===1).length;return{r,n}}).filter(x=>x.n).sort((a,b)=>b.n-a.n);const solo=hard.map(r=>({r,n:L.filter(l=>{const c=check(l,r);return!c||c[0]!=="no"}).length}));return{fix,solo}}

/* ---------- 聽懂 ---------- */
const add=(field,value,label,o={})=>({id:field+":"+JSON.stringify(value),field,value,label,hard:!!o.hard,src:o.src||"你說的",ev:o.ev||null});
function parse(t){const a=[],unk=[],s=t.replace(/(\d),(\d{3})/g,"$1$2");
 let m=s.match(/(\d+(?:\.\d+)?)\s*萬(?:\s*(\d)(?![\d.]|\s*(?:吋|寸|公斤|kg|g)))?/i),n=null;if(m)n=Math.round((+m[1]+(m[2]?+m[2]/10:0))*1e4);else if(m=s.match(/(?:預算|價格)\D{0,4}(\d{4,6})|(\d{4,6})\s*(?:元|塊|以內|以下|左右)/))n=+(m[1]||m[2]);
 if(!n&&/^\s*\d{4,6}\s*$/.test(s)&&S.expect==="budget")n=+s.trim();
 if(n){const up=/以上|起跳/.test(s);a.push(add("budget",up?{min:n}:{max:n},`預算 ${twd(n)} ${up?"以上":"以內"}`,{hard:true,ev:m?m[0]:s}))}
 for(const[p,re]of[["辦公學習",/上課|報告|文書|辦公|學生|新生/],["設計",/設計|修圖|繪圖/],["剪輯",/剪片|剪輯|剪.{0,6}影片|Premiere/i],["遊戲",/遊戲|電動|3A/i],["程式開發",/程式|coding/i]])if(re.test(s)&&!new RegExp("不.{0,2}("+re.source+")","i").test(s))a.push(add("purpose",p,"用途："+p));
 if(/每天|通勤|背著|背去|帶去|不要太重|輕薄/.test(s))a.push(add("portability","high","常帶著走（超過 2 公斤會降分）",{src:"我假設的"}));else if(/偶爾帶/.test(s))a.push(add("portability","mid","偶爾帶出門"));else if(/放桌上/.test(s))a.push(add("portability","low","幾乎放桌上"));
 if(m=s.match(/(\d(?:\.\d+)?)\s*(?:公斤|kg)/i))a.push(add("weight_max",+m[1],`${m[1]} 公斤以內`,{hard:true,ev:m[0]}));
 if(m=s.match(/(1[2-8](?:\.\d)?)\s*吋/))a.push(add("size",+m[1],`${m[1]} 吋左右`,{hard:true,ev:m[0]}));
 if(/獨顯|獨立顯卡/.test(s)&&!/不(要|用|需要).{0,2}獨/.test(s))a.push(add("dgpu",true,"要獨立顯卡",{hard:true}));
 if(m=s.match(/(\d{2})\s*G(?:B)?\s*(?:以上|記憶體)/i))a.push(add("ram",+m[1],`記憶體 ${m[1]} GB 以上`,{hard:true}));
 if(/premiere|\bpr\b/i.test(s))a.push(add("software","Premiere Pro","軟體：Premiere Pro"));
 if(/photoshop|\bps\b/i.test(s))a.push(add("software","Photoshop","軟體：Photoshop"));
 for(const[k,re]of[["battery",/續航/],["display",/螢幕/],["noise",/安靜/]])if(re.test(s))a.push(add("priority",k,"重視"+DL[k]));
 for(const[u,re]of[["CLO3D",/clo\s?3d/i],["Blender",/blender/i],["AutoCAD",/autocad/i]])if(re.test(s)){unk.push(u);a.push(add("other",u,`${u}（尚無資料）`))}
 for(const b of BRANDS){if(new RegExp("(不要|不考慮)"+b).test(s))a.push(add("brand",{no:b},"不要"+b,{hard:true}));else if(new RegExp("(只要|只看)"+b).test(s))a.push(add("brand",{only:b},"只看"+b,{hard:true}))}
 return{adds:a,unk,compare:/幫我比較|比一比|對比/.test(s)}}
function upsert(r){const single=!["purpose","software","priority","other"].includes(r.field);S.reqs=S.reqs.filter(x=>single?x.field!==r.field:x.id!==r.id);S.reqs.push(r)}
const Q=[["purpose","這台筆電主要拿來做什麼？","用途決定性能和螢幕哪個比較重要。",[["辦公學習","purpose","辦公學習","用途：辦公學習"],["設計","purpose","設計","用途：設計"],["剪輯","purpose","剪輯","用途：剪輯"],["遊戲","purpose","遊戲","用途：遊戲"]]],
["budget","預算大概多少？","預算會直接決定候選範圍。",[["3 萬以下","budget",{max:30000},"預算 NT$ 30,000 以內",1],["3–4.5 萬","budget",{min:30000,max:45000},"預算 NT$ 30,000–45,000",1],["4.5–7 萬","budget",{min:45000,max:70000},"預算 NT$ 45,000–70,000",1],["7 萬以上","budget",{min:70000},"預算 NT$ 70,000 以上",1]]],
["portability","你多常帶著它出門？","常帶出門的話，重量和續航會更重要。",[["每天背著走","portability","high","常帶著走（超過 2 公斤會降分）"],["偶爾帶出門","portability","mid","偶爾帶出門"],["幾乎放桌上","portability","low","幾乎放桌上"]]]];
function reply(text,unk=[],cmp=false,adds=[]){const m=model();const heard={k:"req",heard:adds.map(r=>({label:r.label,soft:!isHard(r)}))};
 if(!S.reqs.length){say("跟我說說預算和主要用途，或點上面的選項開始。");return}
 if(!m.fit.length){const c=conflict();say(`這幾個條件放在一起，目前沒有機型同時做得到。${m.near.length?`有 ${m.near.length} 台只差一點。`:""}你可以選一項放寬：`,[{k:"conflict",...c}]);return}
 if(cmp&&S.compare.length<2){S.compare=m.fit.slice(0,3).map(r=>r.l.id);openCompare();}
 let note=unk.length?`${unk.join("、")} 我目前還沒有對應的資料，先不當作條件。`:"";
 const miss=Q.filter(q=>!S.reqs.some(r=>r.field===q[0])&&!S.asked.includes(q[0]));
 if(miss.length&&S.nAsk<2&&!cmp){const q=miss[0];S.asked.push(q[0]);S.nAsk++;S.expect=q[0];say(`目前有 ${m.fit.length} 台符合。${note}${q[1]}`,[heard,{k:"ask",q:q[0],quote:text}]);return}
 S.expect=null;const t=m.fit[0];say(`符合你需求的有 ${m.fit.length} 台，我最推薦 ${t.l.name}（${twd(t.l.price)}）。${pros(t,m).pro[0]?pros(t,m).pro[0]+"。":""}${note}`,[heard,{k:"fb",done:null}])}
function say(t,cards=[]){S.msgs.push({r:"a",t,cards,id:++seq})}
function userSay(t){if(!S.reqs.length&&S.title==="新對話")S.title=t.slice(0,18);S.msgs.push({r:"u",t,id:++seq});const p=parse(t);p.adds.forEach(upsert);S.hold=null;reply(t,p.unk,p.compare,p.adds);render()}

/* ---------- 畫面 ---------- */
const bars=l=>`<div class="bars">${DIMS.map(([k,n])=>`<div class="bar"><span>${n}</span><i><u style="width:${l.dims[k]??0}%"></u></i><span>${l.dims[k]??"—"}</span></div>`).join("")}</div>`;
const pills=l=>(heavyCut(l)?`<span class="pill heavy">偏重 ${l.kg} 公斤</span>`:"")+[l.batt?`續航 ${l.batt} 小時`:"",`${esc(l.panel||"")} ${l.hz||""}Hz`.trim(),l.res?esc(l.res):"",l.ram?`${l.ram} GB`:""].filter(Boolean).map(x=>`<span class="pill">${x}</span>`).join("");
const spec=l=>esc([l.cpu,l.gpu||"內建顯示卡"].filter(Boolean).join(" · "))+`<br>${l.size??"—"} 吋 · ${l.kg??"—"} 公斤`;
const actions=l=>{const f=favs.includes(l.id),c=S.compare.includes(l.id),x=S.excluded.includes(l.id);return`<div class="acts"><button class="mini ${c?"on":""}" data-a="cmp" data-id="${l.id}">${c?"已加入對比":"＋對比"}</button><button class="mini ${f?"on":""}" data-a="fav" data-id="${l.id}" aria-label="收藏 ${esc(l.name)}">${f?"★ 已收藏":"☆ 收藏"}</button><button class="mini q" data-a="ex" data-id="${l.id}">${x?"重新考慮":"不考慮這台"}</button></div>`};
function judge(row,m){const hard=S.reqs.filter(isHard);const total=DK.filter(k=>row.l.dims[k]!=null);const sumW=total.reduce((a,k)=>a+m.w[k],0);return`<details class="judge"><summary class="lnk">我怎麼判斷</summary>
 <p style="margin:6px 0 3px"><b>通過的條件</b></p>${hard.length?hard.map(r=>{const c=check(row.l,r);return c?`<div><span class="${c[0]==="ok"?"ok":c[0]==="near"?"near":"no"}">${c[0]==="ok"?"✓":c[0]==="near"?"△":"✕"}</span> ${esc(r.label)}：${esc(c[1])}</div>`:""}).join(""):"<div>你還沒有設定一定要符合的條件</div>"}
 <p style="margin:8px 0 3px"><b>分數怎麼算</b></p><table><tr><th>項目</th><th>分數</th><th>佔比</th><th>貢獻</th></tr>${total.map(k=>`<tr><td>${DL[k]}</td><td>${row.l.dims[k]}</td><td>${m.w[k]}%</td><td>${(row.l.dims[k]*m.w[k]/sumW).toFixed(1)}</td></tr>`).join("")}${heavyCut(row.l)?`<tr><td>每天背・偏重</td><td></td><td></td><td class="near">−${heavyCut(row.l)}</td></tr>`:""}<tr><td><b>產品力</b></td><td></td><td></td><td><b>${row.p}</b></td></tr></table></details>`}
function vs(row,top){const d=row.l.price-top.l.price,b=DK.map(k=>[k,(row.l.dims[k]??0)-(top.l.dims[k]??0)]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).filter(x=>x[1]).slice(0,2);return`<div class="vs">和第一名比：${d<0?"便宜 "+twd(-d):d>0?"貴 "+twd(d):"價格相同"}${b.map(([k,v])=>`、${DL[k]}${v>0?"高":"低"} ${Math.abs(v)} 分`).join("")}</div>`}
function card(row,m,o={}){const l=row.l,w=row.st&&(S.reqs.length>0)?pros(row,m):{pro:[],con:[]};return`<article class="lp ${o.hero?"hero":""} ${S.excluded.includes(l.id)?"off":""}" data-card="${l.id}">${o.badge?`<div><span class="rank ${o.hero?"":"alt"}">${o.badge}</span></div>`:""}<h4><button data-a="detail" data-id="${l.id}">${esc(l.name)}</button></h4><div class="sub">${spec(l)}</div><div class="pills">${pills(l)}</div><div class="row"><span class="price">${twd(l.price)}</span><span class="score">產品力 ${row.p}</span></div>${o.hero?bars(l):""}${w.pro.length&&(o.hero||o.alt)?`<ul class="why">${w.pro.map(x=>`<li>${esc(x)}</li>`).join("")}${o.hero?w.con.map(x=>`<li style="color:var(--muted)">要接受：${esc(x)}</li>`).join(""):""}</ul>`:""}${o.top?vs(row,o.top):""}${S.reqs.length?judge(row,m):""}${row.res?.length&&row.st===.5?`<div class="near" style="font-size:13px">${esc(row.res.map(x=>x.t).join("、"))}</div>`:""}${actions(l)}</article>`}
function li(row){const l=row.l;return`<div class="li"><button data-a="detail" data-id="${l.id}">${esc(l.name)}</button><span class="price" style="font-size:15px">${twd(l.price)}</span><small>${l.size??"—"} 吋 · ${l.kg??"—"} 公斤 · 產品力 ${row.p}</small><span>${actions(l).replace('class="acts"','class="row"')}</span></div>`}
const many=(rows,m,o={})=>layout==="list"?`<div class="list">${rows.map(r=>li(r)).join("")}</div>`:`<div class="grid">${rows.map(r=>card(r,m,o)).join("")}</div>`;
function brief(m){const{why}=weights();const steps=funnel();return`<div class="brief"><h3>你的需求<span><button class="lnk" data-a="filters">篩選</button></span></h3><div class="tags">${S.reqs.map(r=>`<span class="tag ${r.hard||r.field==="software"?"":"soft"}" title="${esc(r.ev?"你說：「"+r.ev+"」":r.src)}">${esc(r.label)} <small>${esc(r.src)}</small>${EDIT.includes(r.field)?`<button class="fix" data-a="edit" data-id="${esc(r.id)}" aria-label="修改 ${esc(r.label)}">修改</button>`:""}<button data-a="rm" data-id="${esc(r.id)}" aria-label="刪除 ${esc(r.label)}">×</button></span>`).join("")}</div>${S.reqs.some(r=>!isHard(r))?`<p class="note">虛線是偏好，只影響排序，不會把機型篩掉。</p>`:""}${steps.length?`<div class="trail" data-t="funnel"><span>全部 <b>${L.length}</b> 台</span>${S.excluded.length?`<span>→ 你不考慮 <s>−${S.excluded.length}</s></span>`:""}${steps.map(s=>`<span>→ ${esc(s.r.label)} <s>−${s.cut}</s></span>`).join("")}<span>→ 符合 <b>${m.fit.length}</b> 台${m.near.length?`＋差一點 <b>${m.near.length}</b> 台`:""}</span></div>`:""}</div>`}
const EDIT=["budget","size","weight_max","ram","purpose","portability"];
function outGroups(m){const g={};for(const r of m.out.filter(r=>!S.excluded.includes(r.l.id))){const k=r.res[0]?.t.replace(/（.*/,"")||"其他";(g[k]=g[k]||[]).push(r)}return Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>`<details class="group"><summary>${esc(k)} · ${v.length} 台</summary>${v.map(r=>`<div><button data-a="detail" data-id="${r.l.id}">${esc(r.l.name)}</button><small>${twd(r.l.price)} · ${esc(r.res.map(x=>x.t).join("、"))}</small></div>`).join("")}</details>`).join("")}

 else{const fit=sorted(m.fit).filter(hit);n=fit.length;$("count").innerHTML=`<span>符合你需求的</span><b data-t="fit">${n}</b><small>台 · 示範 ${L.length} 台中</small>`;h=brief(m);
  if(fit.length){const top=fit[0];if(sort==="fit"&&!q){h+=`<div class="sec">最適合你的</div><div class="grid">${card(top,m,{hero:1,badge:"第 1 名"})}</div>`;const alt=fit.slice(1,3);if(alt.length)h+=`<div class="sec">兩個備選</div><div class="grid">${alt.map((r,i)=>card(r,m,{alt:1,badge:"備選 "+(i+1),top})).join("")}</div>`;const rest=fit.slice(3);if(rest.length)h+=`<div class="sec">其他也符合的<small>${rest.length} 台</small></div>${many(rest,m,{top})}`}else h+=many(fit,m)}
  if(m.near.length)h+=`<div class="sec">差一點<small>${m.near.length} 台，有一項沒完全達標</small></div>${many(m.near.filter(hit),m)}`;
  const asked=m.out.filter(r=>!S.excluded.includes(r.l.id)).slice(0,5);if(asked.length)h+=`<div class="sec" data-t="asked">常被問到、但沒進清單的<small>最多 5 台</small></div><div class="list">${asked.map(r=>`<div class="li"><button data-a="detail" data-id="${r.l.id}">${esc(r.l.name)}</button><span>${twd(r.l.price)}</span><small class="no" style="grid-column:1/-1;font-weight:400">${esc(r.res.map(x=>x.t).join("、"))}</small></div>`).join("")}</div>`;
  const nOut=m.out.filter(r=>!S.excluded.includes(r.l.id)).length;if(nOut)h+=`<div class="sec" data-t="out">不符合<small>${nOut} 台，按原因分組</small></div>${outGroups(m)}`}
 $("body").innerHTML=h+exSec();renderTray()}

function detail(id){const m=model(),row=[...m.fit,...m.near,...m.out].find(r=>r.l.id===id),l=row.l;const hard=S.reqs.filter(r=>r.field!=="other");const groups={};l.m.forEach(x=>(groups[x[0]]=groups[x[0]]||[]).push(x));
 shell(esc(l.name),`<p class="price">${twd(l.price)}<span class="score">產品力 ${row.p}</span></p><p class="sub">${spec(l)}</p><div class="pills" style="margin:8px 0">${pills(l)}</div>${bars(l)}
 <div class="sec" data-t="against">對照你的需求</div>${hard.length?`<div class="tw"><table class="tbl" style="min-width:0">${hard.map(r=>{const c=isHard(r)?check(l,r):null;const[st,cl]=!c?["供參考","note"]:c[0]==="ok"?["達標","ok"]:c[0]==="near"?["差一點","near"]:["不達標","no"];return`<tr><td style="white-space:normal">${esc(r.label)}</td><td class="${cl}" style="white-space:nowrap">${st}</td><td>${esc(c?c[1]:"影響排序，不當條件")}</td></tr>`}).join("")}</table></div>`:`<p class="note">先告訴我需求，這裡會逐項對照。</p>`}
 ${Object.entries(groups).map(([g,v])=>`<div class="sec">${esc(g)}實測</div><div class="tw"><table class="tbl" style="min-width:0">${v.map(x=>`<tr><td>${esc(x[1])}</td><td>${esc(x[2])} ${esc(x[3])}</td></tr>`).join("")}</table></div>`).join("")}`,`<button class="btn ghost" data-a="fav" data-id="${id}">${favs.includes(id)?"★ 已收藏":"☆ 收藏"}</button><button class="btn" data-a="cmp" data-id="${id}">${S.compare.includes(id)?"已加入對比":"＋對比"}</button>`)}

const tab=v=>{$("app").dataset.tab=v;$("t-chat").classList.toggle("on",v==="chat");$("t-res").classList.toggle("on",v==="res")};

/* ---------- 事件 ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;const go={
 send(){const t=$("txt").value.trim();if(!t)return;$("txt").value="";userSay(t);},
 eg(){$("txt").value=b.textContent;$("txt").focus()},
 opt(){const q=Q.find(x=>x[0]===b.dataset.q),o=q[3][+v];if(!S.asked.includes(q[0]))S.asked.push(q[0]);S.msgs.push({r:"u",t:o[0],id:++seq});if(S.title==="新對話")S.title=o[0];upsert(add(o[1],o[2],o[3],{hard:!!o[4],src:"你選的"}));reply(o[0]);render()},
 skip(){const k=b.dataset.q,r=k==="purpose"?add("purpose","辦公學習","用途：辦公學習",{src:"我假設的"}):k==="budget"?add("budget",{},"預算先不限",{src:"我假設的"}):add("portability","mid","偶爾帶出門",{src:"我假設的"});if(!S.asked.includes(k))S.asked.push(k);S.msgs.push({r:"u",t:"不確定",id:++seq});if(S.title==="新對話")S.title="還不確定需求";upsert(r);S.hold=null;say(`好，我先假設「${r.label}」，不對可以在需求標籤修改。`);reply("",[],false,[r]);render()},
 edit(){sheet={t:"edit",id};openEdit(id)},
 eopt(){const q=Q.find(x=>x[0]===b.dataset.q),o=q[3][+v];S.reqs=S.reqs.filter(r=>r.id!==id);upsert(add(o[1],o[2],o[3],{src:"你改的"}));S.hold=null;closeSheet();say("好，改成「"+o[3]+"」，結果已更新。");render()},
 esave(){const r=S.reqs.find(x=>x.id===id),a1=$("e1").value,a2=$("e2")?.value;let n;if(r.field==="budget"){const lo=+a1||0,hi=+a2||0;if((!lo&&!hi)||(lo&&hi&&lo>hi)){toast("請確認金額");return}const val=lo&&hi?{min:lo,max:hi}:lo?{min:lo}:{max:hi};n=add("budget",val,lo&&hi?`預算 ${twd(lo)}–${(hi).toLocaleString("en-US")}`:lo?`預算 ${twd(lo)} 以上`:`預算 ${twd(hi)} 以內`,{hard:true,src:"你改的"})}else{const x=+a1;if(!(x>0)){toast("請輸入數字");return}n=add(r.field,x,r.field==="size"?`${x} 吋左右`:r.field==="weight_max"?`${x} 公斤以內`:`記憶體 ${x} GB 以上`,{hard:true,src:"你改的"})}upsert(n);S.hold=null;closeSheet();say("好，改成「"+n.label+"」，結果已更新。");render()},
 auth(){sheet={t:"auth"};closeMenu();openAuth()},login(){user=true;closeSheet();toast("已登入（示範）");render()},logout(){user=false;closeSheet();toast("已登出");render()},
 rm(){S.reqs=S.reqs.filter(r=>r.id!==id);say("好，這項拿掉了，結果已更新。");render()},
 relax(){const r=S.reqs.find(x=>x.id===id);S.reqs=S.reqs.filter(x=>x.id!==id);S.msgs.push({r:"u",t:"放寬「"+r.label+"」",id:++seq});reply("");render()},
 fb(){const m=S.msgs.find(x=>x.id==id);m.cards.find(c=>c.k==="fb").done=v;renderChat()},
 fbr(){const m=S.msgs.find(x=>x.id==id);m.cards.find(c=>c.k==="fb").done="yes";renderChat()},
 cmp(){if(S.compare.includes(id))S.compare=S.compare.filter(x=>x!==id);else if(S.compare.length>=4){toast("最多對比 4 台");return}else S.compare.push(id);render()},
 clear(){S.compare=[];render()},
 fav(){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];render()},
 ex(){const on=S.excluded.includes(id);S.excluded=on?S.excluded.filter(x=>x!==id):[...S.excluded,id];toast(on?"已重新考慮":"已不考慮這台，可在清單最下方找回");render()},
 detail(){sheet={t:"detail",id};render()},
 compare(){sheet={t:"compare"};openCompare()},favs(){sheet={t:"favs"};closeMenu();openFavs()},weights(){draft=null;sheet={t:"weights"};openWeights()},settings(){sheet={t:"settings"};closeMenu();openSettings()},filters(){sheet={t:"filters"};openFilters()},
 close(){closeSheet()},
 filter(){const f=b.dataset.f,val=JSON.parse(v),r=add(f,val,b.dataset.l,{hard:true,src:"你選的"});if(S.reqs.some(x=>x.id===r.id))S.reqs=S.reqs.filter(x=>x.id!==r.id);else upsert(r);render()},
 wapply(){S.hold=set.resort?null:model().fit.map(r=>r.l.id);S.manual={...draft};closeSheet();toast("已套用你的權重");render()},
 wreset(){S.manual=null;S.hold=null;closeSheet();toast("已恢復系統建議");render()},
 layout(){layout=v;render()},
 new(){stop();saveRecent();S=fresh();sort=set.defSort;$("q").value="";closeMenu();render()},
 scene(){runScene(+v)},stop(){stop()},
 resume(){saveRecent();S=recents[+v];closeMenu();render()},
 mini(){if(innerWidth<1024){closeMenu();return}mini=!mini;render()},menu(){$("side").classList.toggle("open")},tab(){tab(v)},
};go[a]&&go[a]()});
document.addEventListener("input",e=>{const k=e.target.dataset?.w;if(k&&draft){const n=rebalance(draft,k,+e.target.value);draft=n;for(const x of DK){$("w-"+x).value=n[x];$("wv-"+x).textContent=n[x]+"%"}}if(e.target.id==="q")renderBody()});
document.addEventListener("change",e=>{const i=e.target.id;if(i==="sort"){sort=e.target.value;renderBody()}if(i==="s-sort"){set.defSort=e.target.value;sort=set.defSort;renderBody()}if(i==="s-resort")set.resort=e.target.checked;if(i==="s-anim")set.anim=e.target.checked});
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("send").click()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet)closeSheet()});
restore();render();
