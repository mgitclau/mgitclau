<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回覆主次 Demo</title>
<style>
/* 版面：左＝一則模擬回覆（對話欄寬度），右＝正在選的那一項的 3 個方案並排預覽。
   視覺規則（所有方案都守）：
   1. 三個層級：文字 14.5px 黑 → 卡片 13.5px（結論 15px 粗黑＋明細深灰）→ 細節 12px 灰
   2. 每張卡：小標 → 結論一句 → 明細 → 動作，順序固定
   3. 顏色：黑＝重點、灰＝次要、藍＝可點、綠／黃／紅＝符合／勉強／不符合；橘點只給追問卡 */
:root{
  --ground:#C6CDDC; --panel:#EDF0F5; --chatbg:#E1E5EE; --surface:#fff; --inner:#F2F4F8;
  --ink:#12151C; --ink2:#454C5D; --ink3:#626A7D; --line:#D7DCE6; --hair:rgba(18,21,28,.09);
  --accent:#2340C4; --signal:#F0602A; --good:#1D7349; --warn:#9A5B0B; --bad:#AE3626;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --t-text:14.5px; --t-head:15px; --t-card:13.5px; --t-meta:12px; --t-label:11px;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 var(--sans);color:var(--ink);background:linear-gradient(180deg,#C6CDDC,#BAC3D5) fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.top{max-width:1260px;margin:0 auto;padding:22px 20px 4px}
.top h1{font-size:20px;margin:0 0 4px}
.top p{margin:0;color:var(--ink2);font-size:13px;max-width:900px}
.wrap{max-width:1260px;margin:0 auto;padding:14px 20px 60px;display:grid;grid-template-columns:540px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:1040px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* ============ 對話 ============ */
.chat{background:var(--chatbg);border-radius:26px;padding:18px 14px 22px;box-shadow:0 30px 60px -30px rgba(30,40,70,.35)}
.me{margin:0 0 14px auto;max-width:82%;width:fit-content;background:var(--accent);color:#fff;padding:9px 14px;border-radius:18px 18px 4px 18px;font-size:var(--t-text)}
.bot,.pv-body{background:var(--surface);display:flex;flex-direction:column;gap:14px}
.bot{border-radius:18px 18px 18px 4px;padding:16px 18px 18px;box-shadow:0 1px 2px rgba(22,30,52,.05),0 12px 32px -10px rgba(22,30,52,.16)}
.bot [data-el]{cursor:pointer;outline:2px solid transparent;outline-offset:5px;border-radius:12px;transition:outline-color .2s}
.bot [data-el]:hover{outline-color:#C3CADB}
.bot [data-el].cur{outline-color:var(--signal)}
p{margin:0}

/* ---- 共用零件 ---- */
.num{font-variant-numeric:tabular-nums}
.meta{font-size:var(--t-meta);color:var(--ink3);line-height:1.5}
.btn{border:1.3px solid var(--ink);background:#fff;border-radius:999px;padding:5px 15px;font-size:13px;font-weight:600;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff}
.lnk{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px}
.no{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--ink);color:#fff;font:700 10.5px/1 var(--sans);font-style:normal;margin-right:5px;vertical-align:1.5px}
.th{display:inline-grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;flex:none;overflow:hidden}
.th svg{width:100%;height:100%;display:block}
.fact{color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
details>summary{cursor:pointer;list-style:none;color:var(--accent);font-size:13px;text-decoration:underline;text-underline-offset:3px;width:fit-content}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:" ▾";text-decoration:none;display:inline-block}
details[open]>summary::after{content:" ▴"}

/* ---- 層級 1：文字 ---- */
.tx{font-size:var(--t-text);line-height:1.75}
.tx p{color:var(--ink2)}
.tx b.key{color:var(--ink);font-weight:700}
.tx-2 h4{margin:0 0 2px;font-size:var(--t-head);line-height:1.5;color:var(--ink)}
.tx-2 b.key{font-weight:inherit;color:inherit}
.tx-3 .lead{color:var(--ink);font-weight:700}
.tx-3 details{margin-top:2px}
.tx-3 details p{margin-top:6px;font-size:var(--t-card);line-height:1.7}
.tx-3 b.key{font-weight:inherit;color:inherit}
/* 文字裡的機型 */
.mk{white-space:nowrap;color:var(--ink);font-weight:700}
.mk.m1{text-decoration:underline;text-decoration-color:#B4BBC9;text-underline-offset:3px}
.mk.m2 .th{width:24px;height:17px;border-radius:4px;vertical-align:-3px;margin-right:5px}
.mk.m3 .no{margin-right:4px}

/* ---- 符合台數 ---- */
.ct-1{font-size:var(--t-meta);color:var(--ink3);display:flex;align-items:center;gap:7px}
.ct-1::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}
.ct-2{align-self:center;font-size:var(--t-meta);color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2px 14px}
.ct-3{display:flex;align-items:baseline;gap:8px;font-size:var(--t-card);color:var(--ink2);padding-bottom:12px;border-bottom:1px solid var(--line)}
.ct-3 b{font-size:20px;line-height:1;color:var(--ink)}
.ct-3 span{flex:1}

/* ---- 層級 2：卡片 ---- */
.card{font-size:var(--t-card);line-height:1.55;color:var(--ink2)}
.card.f1{background:var(--inner);border-radius:14px;padding:14px}
.card.f2{border:1px solid var(--line);border-radius:14px;padding:14px}
.card.f3{border-left:2px solid #B4BBC9;padding:1px 0 1px 14px}
.card.k-choice{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:14px}
.lb{display:flex;justify-content:space-between;gap:10px;font-size:var(--t-label);font-weight:600;letter-spacing:.06em;color:var(--ink3);margin-bottom:8px;line-height:1.3}
.lb em{font-style:normal;letter-spacing:0;font-weight:500}
.k-choice .lb span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--signal);margin-right:6px;vertical-align:1px}
.hl{font-size:var(--t-head);font-weight:700;line-height:1.45;color:var(--ink);margin-bottom:10px;text-wrap:balance}
.hl:last-child{margin-bottom:0}
/* 機型列：縮圖＋短名＋價格，所有卡片共用 */
.lap{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lap .th{width:44px;height:32px}
.lap .n{font-weight:700;color:var(--ink);font-size:14px;line-height:1.35}
.lap .m{font-size:var(--t-meta);color:var(--ink3)}
.lap .pr{margin-left:auto;font-weight:700;color:var(--ink);white-space:nowrap}
/* 明細列 */
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--hair)}
.r .v{margin-left:auto;color:var(--ink);font-weight:600;text-align:right;white-space:nowrap}
.r .sub{display:block;font-size:var(--t-meta);color:var(--ink3)}
.rows+.meta,.rows+details,table+.meta{margin-top:8px}
.ic{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;flex:none;transform:translateY(2px)}
.ic.ok{background:var(--good)} .ic.mid{background:#C98A1B} .ic.no_{background:var(--bad)}
.st{font-weight:700;white-space:nowrap} .st.ok{color:var(--good)} .st.mid{color:var(--warn)} .st.no_{color:var(--bad)}
.up{color:var(--good);font-weight:700} .dn{color:var(--ink3);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols h5{margin:0 0 4px;font-size:var(--t-label);letter-spacing:.06em;font-weight:600}
.cols h5.g{color:var(--good)} .cols h5.w{color:var(--warn)}
.cols ul,.pc{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.cols li{color:var(--ink)}
.pc li{padding-left:20px;position:relative;color:var(--ink)}
.pc li::before{position:absolute;left:0;font-weight:700}
.pc .pro::before{content:"＋";color:var(--good)} .pc .con::before{content:"－";color:var(--warn)}
.pc .con{color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:var(--t-card)}
th,td{padding:6px 6px;border-top:1px solid var(--hair);text-align:left;font-weight:400}
thead th{border-top:0;font-size:var(--t-label);letter-spacing:.06em;font-weight:600;color:var(--ink3);padding-top:0}

/* 權重變化 */
.wbar{display:grid;grid-template-columns:48px 1fr 36px 30px;gap:10px;align-items:center;padding:6px 0}
.wbar .tk{position:relative;height:8px;border-radius:4px;background:rgba(18,21,28,.08)}
.wbar .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink)}
.wbar .tk u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--signal)}
.wbar.down .tk i{background:#8E97AB}
.wbar b{color:var(--ink);text-align:right}
.wbar small{font-size:var(--t-meta);text-align:right}

/* 推薦卡 */
.rc-1 .lap .th{width:72px;height:52px;border-radius:10px}
.rc-1 .lap .n{font-size:16px}
.rc-1 .lap .m{font-size:var(--t-card);color:var(--ink2)}
.rc-1 .lap .m b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 10px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.stats div{padding:8px 0 8px 12px;border-left:1px solid var(--hair)}
.stats div:first-child{border:0;padding-left:0}
.stats b{display:block;font-size:19px;line-height:1.2;color:var(--ink)}
.stats small{font-size:var(--t-meta);color:var(--ink3)}

/* 需求對照 */
.ft-2 td:last-child{font-weight:600;color:var(--ink);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips span{display:inline-flex;align-items:baseline;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 11px 2px 5px;font-size:13px;color:var(--ink)}
.chips span b{font-weight:600}
.chips span{align-items:center}
.chips .ic{transform:none}

/* 軟體 */
.dots{display:inline-flex;gap:3px;margin-right:8px;vertical-align:1px}
.dots i{width:14px;height:6px;border-radius:3px;background:rgba(18,21,28,.12)}
.dots.ok i{background:var(--good)} .dots.mid i:nth-child(-n+2){background:#C98A1B} .dots.no_ i:first-child{background:var(--bad)}

/* 對比 */
.scroll{overflow-x:auto}
.cp th,.cp td{text-align:center}
.cp th:first-child,.cp td:first-child{text-align:left;color:var(--ink3);white-space:nowrap;padding-left:0}
.cp thead th{letter-spacing:0;vertical-align:bottom;padding-bottom:8px}
.cp thead .th{width:40px;height:29px;display:grid;margin:0 auto 4px}
.cp thead b{display:block;font-size:12.5px;color:var(--ink);line-height:1.3}
.cp thead small{font-size:var(--t-meta);font-weight:500}
.cp td{color:var(--ink3)}
.cp td.w{color:var(--ink);font-weight:700}
.cp .grp td{font-size:var(--t-label);letter-spacing:.06em;font-weight:600;color:var(--ink3);padding-top:12px;border-top:0}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--t-meta);color:var(--ink2);margin-bottom:6px}
.lg i,.bar u{display:inline-block;border-radius:3px}
.lg i{width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.c0{background:#12151C} .c1{background:#2340C4} .c2{background:#9AA5C0}
.dim{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--hair);align-items:center}
.dim>b{color:var(--ink)}
.bar{display:flex;align-items:center;gap:7px;height:13px}
.bar u{height:7px;text-decoration:none}
.bar span{font-size:var(--t-meta);color:var(--ink3)}
.bar.w span{color:var(--ink);font-weight:700}
.vd{padding:9px 0;border-top:1px solid var(--hair)}
.vd .lap{margin-bottom:4px}
.vd .lap .th{width:36px;height:26px}
.vd p{padding-left:46px}
.vd p b{color:var(--ink)}
.cp-3 details,.cp-2 details{margin-top:8px}
.cp-3 details table,.cp-2 details table{margin-top:8px}

/* 名詞 */
.tm-1 .def{margin-top:0}
.tm-2 .imp{margin-top:8px;padding-top:8px;border-top:1px solid var(--hair);color:var(--ink)}
.tm-2 .imp b{display:block;font-size:var(--t-label);letter-spacing:.06em;color:var(--ink3);font-weight:600}
.tm-3 summary{font-size:var(--t-card)}
.tm-3 p{margin-top:8px}

/* 實物比例 */
.sz{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.sz .rows .r:first-child{border-top:0;padding-top:0}
.sz .r{display:block}
.sz .r small{display:block;font-size:var(--t-label);letter-spacing:.06em;color:var(--ink3);font-weight:600}
.sz .r b{color:var(--ink)}
.wt{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center}
.wt u{display:block;height:10px;border-radius:5px;background:#B4BBC9;text-decoration:none}
.wt .me_ u{background:var(--ink)}
.wt b{color:var(--ink)} .wt span{white-space:nowrap}
.wt .me_{display:contents;color:var(--ink);font-weight:700}
.wt>div{display:contents}

/* 差一點 */
.nr-3{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.nr-3 .hl{margin:0;flex:1 1 230px}
.nr-3 .hl small{display:block;font-size:var(--t-meta);font-weight:400;color:var(--ink3)}

/* 選項卡 */
.q{font-size:16px;font-weight:700;line-height:1.5;color:var(--ink);margin-bottom:12px;text-wrap:balance}
.q small{display:block;font-size:var(--t-card);font-weight:400;color:var(--ink2);margin-top:2px}
.ops{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.op{border:1.3px solid #B4BBC9;background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-weight:600;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:10px}
.op:hover{border-color:var(--ink);background:var(--inner)}
.op span{flex:1}
.op small{font-weight:400;font-size:var(--t-meta);color:var(--ink3);white-space:nowrap}
.ch-1 .op::after{content:"→";color:var(--ink3)}
.ch-2 .ops{flex-direction:row;flex-wrap:wrap}
.ch-2 .op{border-radius:999px;padding:7px 15px}
.ch-2 .op span{flex:none}
.ch-3 .ops{display:grid;grid-template-columns:1fr 1fr}
.ch-3 .op{flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:76px}
.ch-3 .op span{flex:none}
.ch-3 .op.wide{grid-column:1/-1;min-height:0}

/* ============ 右側：選方案 ============ */
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border-radius:26px;padding:18px;box-shadow:0 30px 60px -30px rgba(30,40,70,.35)}
@media(max-width:1040px){.side{position:static;max-height:none}}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.steps button{border:1px solid #B9C0CE;background:#fff;border-radius:999px;padding:3px 10px 3px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.steps button b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--inner);font-size:11px}
.steps button[aria-current=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.steps button[aria-current=true] b{background:#fff;color:var(--ink)}
.now{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.now h2{font-size:17px;margin:0;flex:1}
.now h2 small{font-size:12.5px;font-weight:400;color:var(--ink3);margin-left:8px}
.pvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
.pv{background:#fff;border:2px solid transparent;border-radius:18px;padding:0;text-align:left;display:block;width:100%;cursor:pointer;box-shadow:0 1px 2px rgba(22,30,52,.05)}
.pv:hover{border-color:#B4BBC9}
.pv[aria-pressed=true]{border-color:var(--ink)}
.pv-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.pv-h i{width:16px;height:16px;border-radius:50%;border:1.5px solid #8E97AB;flex:none;display:grid;place-items:center}
.pv[aria-pressed=true] .pv-h i{border-color:var(--ink)}
.pv[aria-pressed=true] .pv-h i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.pv-h b{white-space:nowrap}
.pv-h span{color:var(--ink3)}
.pv-body{padding:14px;border-radius:0 0 16px 16px;pointer-events:none}
.pick{margin-top:18px;background:#fff;border-radius:18px;padding:14px 16px}
.pick h2{font-size:15px;margin:0 0 2px}
.pick pre{margin:8px 0 12px;font:12.5px/1.75 var(--sans);white-space:pre-wrap;background:var(--inner);border-radius:10px;padding:10px 12px;user-select:all}
.pick small{margin-left:10px;color:var(--ink3)}
</style>
</head>
<body>
<div class="top">
  <h1>回覆主次 Demo</h1>
  <p>左邊是一則所有卡片同時出現的模擬回覆。點任何一段文字或卡片，右邊會並排畫出它的 3 個方案，點方案就套用到左邊。選完把最下面的清單複製給 Claude。權重變化、差一點、名詞解釋、實物比例與 Premiere Pro 的內容是示意，其他數字取自真實對話。</p>
</div>
<div class="wrap">
  <div class="chat">
    <div class="me">我主要用 PS 和 AI，預算 8000 以內。哪台最好？我看到一台 72 分的，跟惠普那台差在哪？</div>
    <div class="bot" id="bot"></div>
  </div>
  <aside class="side">
    <div class="steps" id="steps"></div>
    <div class="now"><h2 id="nowName"></h2><button class="btn" id="prev">上一項</button><button class="btn pri" id="next">下一項</button></div>
    <div class="pvs" id="pvs"></div>
    <div class="pick">
      <h2>我選的這一套</h2>
      <pre id="pick"></pre>
      <button class="btn pri" id="copy">複製清單</button><small id="copied"></small>
    </div>
  </aside>
</div>

<script>
/* ---------- 項目：[key, 名稱, [方案1, 方案2, 方案3 的一句說明]] ---------- */
const ELS=[
  ["text","文字段落",["重點句加粗，其餘深灰","每段一個粗體小標題","只留重點句，細節收起"]],
  ["chip","文字裡的機型",["粗體＋淡底線","小縮圖＋粗體","編號＋粗體，卡片上同一個編號"]],
  ["frame","卡片外框",["淺灰底色塊","白底細框","左側細線縮排"]],
  ["count","符合台數",["一行灰色小字","置中小膠囊","數字＋「看全部」"]],
  ["wchange","權重變化卡",["結論＋前後數字","結論＋橫條（橘線是原本）","只有結論，明細收起"]],
  ["rec","推薦卡",["大縮圖＋理由＋優缺點","三個數字一排","強項／要接受的 左右兩欄"]],
  ["fit","需求對照卡",["逐條列，實際值靠右","「你要的｜這台」表格","一排標籤，其餘收起"]],
  ["sw","軟體夠不夠卡",["結論字靠右","三格刻度","只講有問題的那套"]],
  ["compare","對比卡",["表格，贏的變黑變粗","最在意的 3 項畫橫條","每台一句贏在／輸在"]],
  ["term","名詞解釋卡",["先講對你的影響","先講名詞再講影響","收成一行，點了才開"]],
  ["size","實物比例卡",["A4 疊圖＋兩行字","重量對照條","只有文字"]],
  ["near","差一點卡",["結論＋差在／強在","左右兩欄","一行＋按鈕"]],

const R={count,wchange,rec,fit,sw,compare,term,size,near,choice};
const SAMPLE={text:()=>text("p2"),chip:()=>`<div class="tx tx-1"><p>我猜是 ${mk(2)}（72.8 分）或是 ${mk(3)}（72.1 分），<b class="key">跟 ${mk(4)} 最大的差別在螢幕</b>。</p></div>${g("chip")===3?fit().replace("另外","另外"):""}`,frame:()=>fit()+sw()};
function renderChat(){
  document.getElementById("bot").innerHTML=[count(),wchange(),text("p1"),text("p2"),rec(),fit(),sw(),size(),text("p3"),compare(),term(),near(),text("p4"),choice()].join("");
  mark();
}
function mark(){const t=cur==="chip"?"text":cur;document.querySelectorAll("#bot [data-el]").forEach(e=>e.classList.toggle("cur",touched&&cur!=="frame"&&e.dataset.el===t))}
function renderSide(){
  const i=KEYS.indexOf(cur), [k,name,ds]=ELS[i];
  document.getElementById("steps").innerHTML=ELS.map(e=>`<button data-go="${e[0]}" aria-current="${e[0]===cur}">${e[1]}<b>${S[e[0]]}</b></button>`).join("");
  document.getElementById("nowName").innerHTML=`${name}<small>${i+1}／${ELS.length}</small>`;
  document.getElementById("pvs").innerHTML=[1,2,3].map(v=>{O={[k]:v};const body=(SAMPLE[k]||R[k])();O={};
    return `<div class="pv" role="button" tabindex="0" data-pick="${v}" aria-pressed="${S[k]===v}"><div class="pv-h"><i></i><b>方案 ${v}</b><span>${ds[v-1]}</span></div><div class="pv-body">${body}</div></div>`}).join("");
  document.getElementById("pick").textContent=ELS.map(e=>`${e[1]}：方案 ${S[e[0]]}（${e[2][S[e[0]]-1]}）`).join("\n");
  try{localStorage.setItem("replyHierarchyPick2",JSON.stringify(S))}catch(e){}
}
function setCur(k,scroll){cur=k;touched=true;renderSide();mark();
  if(scroll){const t=document.querySelector(`#bot [data-el="${k==="chip"?"text":k==="frame"?"rec":k}"]`);t&&t.scrollIntoView({behavior:"smooth",block:"center"})}}
document.addEventListener("click",e=>{
  const pv=e.target.closest("[data-pick]"); if(pv){S[cur]=+pv.dataset.pick;renderChat();renderSide();return}
  const go=e.target.closest("[data-go]"); if(go){setCur(go.dataset.go,true);return}
  const id=e.target.id, i=KEYS.indexOf(cur);
  if(id==="next"){setCur(KEYS[(i+1)%KEYS.length],true);return}
  if(id==="prev"){setCur(KEYS[(i+KEYS.length-1)%KEYS.length],true);return}
  if(id==="copy"){const t=document.getElementById("pick").textContent,m=document.getElementById("copied");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent="已複製",()=>m.textContent="請手動選取上面的文字複製");return}
  const c=e.target.closest("#bot [data-el]"); if(c&&!e.target.closest("summary")) setCur(c.dataset.el,false);
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-pick]")){e.preventDefault();e.target.click()}});
renderChat();renderSide();
</script>
</body>
</html>
